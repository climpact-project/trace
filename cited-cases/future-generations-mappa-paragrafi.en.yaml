# «STC4360-2018, p. 13», «Generaciones Futuras, supra, at para. 11.2», «Barragán at 48-49», and to
# know which probe and which link in the chain a paragraph supports.
#
# SOURCES. Corpus documents in the folder future-generations-v-ministry-of-the-environment-and-others_f076:
#   corte_suprema_2018   future-generations-v-ministry-of-the-environment-and-others-decision_7519  (Corte Suprema de Justicia, Sala de Casación Civil, STC4360-2018, 5/4/2018, Spanish, 51 pp., OCR)
#   dejusticia_2018      future-generations-v-ministry-of-the-environment-and-others-decision_7592  (excerpts translated into English by Dejusticia, 11 pp.)
#   tribunal_superior_2018  future-generations-v-ministry-of-the-environment-and-others-decision_15f3  (Tribunal Superior de Bogotá, 12/2/2018, Spanish, 21 pp.)
#   salvamento_2018      future-generations-v-ministry-of-the-environment-and-others-opinion_e35a  (salvamento de voto Ramírez Cardona, 12/2/2018, Spanish, 18 pp.)
#   tutela_2018          future-generations-v-ministry-of-the-environment-and-others-complaint_7da3  (tutela, 29/1/2018, 122 pp.) — partial entry
#   impugnacion_2018     future-generations-v-ministry-of-the-environment-and-others-appeal_3c21  (impugnación, 16/2/2018, 40 pp.) — partial entry
#   amicus_hansen_2018   future-generations-v-ministry-of-the-environment-and-others-other_e010  (amicus Hansen, 16/3/2018, English, 4 pp.) — amicus entry
# `pagina` = number of the marker `<!-- page N -->` of the markdown, which coincides with the PDF page.
#
# HOW THE PARAGRAPH NUMBERS WERE ESTABLISHED. The Corte Suprema numbers the Consideraciones from 1 to 14,
# with sub-numbers printed at the beginning of each paragraph (5.1-5.3, 6.1-6.5, 11.1-11.3, 13.1-13.4); the Antecedentes
# have their own numbering (1-3, 2.1-2.6, 1.1-1.3). No reconstruction: the numbers are those
# printed. Two caveats: the number 11.3 is used twice (p. 37 solidarity, p. 38 Paris); the
# number 5 is read «>.» by the OCR (p. 16). The Tribunal Superior numbers the Consideraciones 1-5 and the
# Antecedentes 1-3 with 3.1-3.15. The dissenting opinion numbers 1.1-1.6, 2.1-2.3 (2.3.1-2.3.2 with letters a-d), 3.1-3.4.
# The Dejusticia excerpts report the Spanish page in parentheses («(p. 13)», «p. 34», «p.45»):
# the entries `dejusticia_2018` give the English page and, in `paragrafo`, the Spanish reference.
#
# OBSERVATIONS WITH RESPECT TO `future-generations.yaml` (version 2, unmodified): see file, 2.2.
# No incorrect page number or verbatim found. T-622/2016 is in the corpus (atrato-river-decision-t-622-16-of-november-10-2016_976c).
#
# PROBES: conexidad_diritti, generazioni_future_obbligo, equita_intergenerazionale_violata,
#        deforestazione_clima_diritti, natura_soggetto_diritti, ecocentrico_antropico, tutela_conexidad_collettivo.
# LINKS of the chain (file, section 0):
#   a = admissibility due to conexidad: harm to the environment harms fundamental rights; the action proceeds
#       notwithstanding the acción popular; the minors act in their own name
#   b = basis: fundamental rights determined by the ecosystem; ecocentric-anthropocentric criterion;
#       future generations as rights-holders; duty of non-interference of present generations
#   c = fact and nexus: deforestation as a source of CO2 and the greenhouse effect, imminent and serious harm to present
#       and future generations; precaution, intergenerational equity (obvious transgression), solidarity (co-responsibility)
#   d = breach: Paris and zero deforestation 2020; omissions by CAR, parks, departments, municipalities
#   e = remedy: the Amazon as subject of rights (like the Atrato); plans with participation of the applicants, PIVAC
# Empty lists: the paragraph supports no probe or link (facts, procedure).
# `verbatim`: fragment found in the corpus (normalizing spaces, line breaks, and accents).

