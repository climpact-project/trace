    pagina_de: 81-82
    pagina_en: 57
    sintesi: "Avoiding a short-sighted and one-sided allocation to the detriment of the future: consuming the budget prudently to gain time for transformations; the provisions would be unconstitutional if they left a level of consumption such as to make unreasonable losses inevitable; even under uncertainty, the risk must be contained (Kalkar); proportionality protects before absolute unreasonableness."
    sonde: [proporzionalita_intergenerazionale]
    sonde_P03: [liberta_intertemporale]
    sonde_P04: [liberta_intertemporale]
    sonde_P05: [liberta_intertemporale]
