  - paragrafo: "244-245"
    documento: neubauer-et-al-v-germany-order_c68f
    pagina_de: 100-101
    pagina_en: 72
    sintesi: "The quantities up to 2030 significantly reduce subsequent possibilities: justifiable only with safeguards for a transition respectful of freedom (1), a planning horizon favorable to development (2), requirements for the pathway (3); the risk of severe burdens is high."
    sonde: [proporzionalita_intergenerazionale, vorwirkung_liberta_intertemporale]
    sonde_P03: [percorso_dopo_2030]
    sonde_P04: [percorso_dopo_2030]
    sonde_P05: [percorso_dopo_2030]
    rivista: "30/09/2026, reading of the paragraph text, to be confirmed by the team's legal expert; before: [proporzionalita_intergenerazionale, vorwirkung_liberta_intertemporale]"
    anelli: [f]

  - paragrafo: "246"
    documento: neubauer-et-al-v-germany-order_c68f
    pagina_de: 101
    pagina_en: 72-73
    sintesi: "With the SRU calculation (1.75 degrees at 67%), after 2030 a minimal budget would remain that would barely suffice for another year; strictly respecting it would impose reductions that are unreasonable today, even without absolute priority for climate (para. 198). (OC-32/25 note 394 refers to 246 and 265.)"
    sonde: [budget_co2_parametro, proporzionalita_intergenerazionale]
    sonde_P03: [percorso_dopo_2030]
    sonde_P04: [percorso_dopo_2030]
    sonde_P05: [percorso_dopo_2030]
    rivista: "30/09/2026, reading of the paragraph text, to be confirmed by the team's legal expert; before: [budget_co2_parametro, proporzionalita_intergenerazionale]"
    anelli: [f]
    verbatim: "would barely last for a further year"

  - paragrafo: "247"
    documento: neubauer-et-al-v-germany-order_c68f
    pagina_de: 101-102
    pagina_en: 73
    sintesi: "How many possibilities remain after 2030 cannot be ascertained with precision (paras. 224 et seq.); with a larger budget, the transition would still be compatible with rights, but it would need to be initiated in good time; it could also be smaller (para. 228): the legislature must take precautions (para. 194)."
    sonde: [budget_co2_parametro, proporzionalita_intergenerazionale]
    sonde_P03: [percorso_dopo_2030]
    sonde_P04: [percorso_dopo_2030]
    sonde_P05: [percorso_dopo_2030]
    rivista: "30/09/2026, reading of the paragraph text, to be confirmed by the team's legal expert; before: [budget_co2_parametro, proporzionalita_intergenerazionale]"
    anelli: [f, g]

  - paragrafo: "248-250"
    documento: neubauer-et-al-v-germany-order_c68f
    pagina_de: 102-103
    pagina_en: 73-74
    sintesi: "Respecting future freedom requires initiating the transition in all sectors in good time; the State cannot provide all developments on its own but must create conditions and incentives (Emissionshandel); margin of appreciation, but orientation is also needed for the post-2030 period, with urgency of development and planning certainty (example of transport); the national framework also matters in international markets. (Leitsatz 4, second paragraph.)"
    sonde: [proporzionalita_intergenerazionale]
    sonde_P03: [percorso_dopo_2030]
    sonde_P04: [percorso_dopo_2030]
    sonde_P05: [percorso_dopo_2030]
    prepara: [vorwirkung_liberta_intertemporale]
    rivista: "30/09/2026, reading of the paragraph text, to be confirmed by the team's legal expert; before: [proporzionalita_intergenerazionale]"
    anelli: [g]
    verbatim: "respecting future freedom requires that the transition to climate neutrality be initiated in good time"

  - paragrafo: "251-255"
    documento: neubauer-et-al-v-germany-order_c68f
    pagina_de: 103-104
    pagina_en: 74-76
    sintesi: "The KSG entrusts the post-2030 period to a 2025 regulation (§ 4(6)); the setting must be transparent, timely, and sufficiently far into the future (Irish Supreme Court 6.45 et seq.), in stages and with sufficient detail; Art. 20a remains decisive: a pathway toward neutrality within the budget, with ever-decreasing quantities (Art. 4(3) Paris)."
    sonde: [budget_co2_parametro, proporzionalita_intergenerazionale]
    sonde_P03: [percorso_dopo_2030]
    sonde_P04: [percorso_dopo_2030]
    sonde_P05: [percorso_dopo_2030]
    prepara: [art20a_giustiziabile_autovincolo, vorwirkung_liberta_intertemporale]
    rivista: "30/09/2026, reading of the paragraph text, to be confirmed by the team's legal expert; before: [proporzionalita_intergenerazionale]"
    anelli: [g]
    verbatim: "it is imperative under constitutional law that further reduction targets beyond 2030 are specified in good time, extending sufficiently far into the future"

  - paragrafo: "256-258"
    documento: neubauer-et-al-v-germany-order_c68f
    pagina_de: 104-105
    pagina_en: "76 (257-258 om.)"
    sintesi: "The technique of § 4(6) (decreasing annual quantities by regulation) is in principle suitable, but the setting is not sufficiently regulated: a single setting «nel 2025» for «ulteriori periodi», perhaps only two years, with five years' notice; a repeated and far-off process is needed."
    sonde: [proporzionalita_intergenerazionale]
    sonde_P03: [percorso_dopo_2030]
    sonde_P04: [percorso_dopo_2030]
    sonde_P05: [percorso_dopo_2030]
    rivista: "30/09/2026, reading of the paragraph text, to be confirmed by the team's legal expert; before: [proporzionalita_intergenerazionale]"
    anelli: [g]

  - paragrafo: "259-265"
    documento: neubauer-et-al-v-germany-order_c68f
    pagina_de: 105-108
    pagina_en: "76-77 (262-264 om.)"
    sintesi: "Reservation of law and Art. 80(1) GG: if the regulation remains, the legislature must itself set the magnitude of the annual quantities or essential criteria; essential questions for freedom and equality belong to the law; § 4(6) does not state when and by how much to reduce (263, German only: the post-2030 distribution entails profound interferences, with the Irish Court 6.37 et seq.; the «dynamischer Grundrechtsschutz» does not apply); the mere participation of the Bundestag does not replace the legislative procedure (265; Leitsatz 5)."
    sonde: []
    sonde_P03: [percorso_dopo_2030]
    sonde_P04: [percorso_dopo_2030]
    sonde_P05: [percorso_dopo_2030]
    anelli: [g]
    verbatim: "Mere parliamentary involvement cannot replace a legislative process"

# ═══════════════════════════ D-E. CONSEQUENCES AND VOTE (paras. 266-270) ═══════════════════════════

  - paragrafo: "266-268"
    documento: neubauer-et-al-v-germany-order_c68f
