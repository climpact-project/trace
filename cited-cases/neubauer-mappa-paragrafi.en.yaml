  - paragrafo: "239-241"
    documento: neubauer-et-al-v-germany-order_c68f
    pagina_de: 99-100
    pagina_en: "71 (240-241 om.)"
    sintesi: "No autonomous duty of investigation and reasoning from Art. 20a; the parliamentary procedure with its publicity offers a guarantee; what matters is that the compatibility of the quantities can be reasoned coherently."
    sonde: []
    sonde_P03: []
    sonde_P04: []
    sonde_P05: []
    prepara: [art20a_giustiziabile_autovincolo]
