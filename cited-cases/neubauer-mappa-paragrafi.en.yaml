# PROBES OF 01/10/2026: each entry carries `sonde` (those of 23/09, which remain for comparison) and `sonde_P03`
# (the new PI probes). Neubauer: per Randnummer, from the intervals written in the case file; Future Generations: from the old ones and from the orders.
# MAP OF NEUBAUER PARAGRAPHS (Klimabeschluss) — version 1, 23 September 2026
#
# Companion to `neubauer-fascicolo.md`. It serves to decipher citations of the type «Neubauer, para. 192»,
# «BVerfG, Rn. 203», «headnote 2c» and to know which probe and which link of the chain a passage supports.
#
# SOURCES. The decision is a single one, in two versions of the corpus:
#   DE  neubauer-et-al-v-germany-order_c68f  (German original, 110 pp.)  -> `pagina_de`
#   EN  neubauer-et-al-v-germany-order_7977  (official BVerfG English translation, 78 pp.) -> `pagina_en`
# `documento` is the German, source of the canonicals; the English pages refer to _7977.
# `pagina` = number of the marker `<!-- page N -->` of the markdown, which coincides with the PDF page.
# «om.» in `pagina_en` = the Rn. is omitted in the English translation («[…]»).
#
# HOW THE NUMBERS WERE ESTABLISHED. The Randnummern (Rn.) are identical in the two languages. In the German
# PDF the marginal number stands at the opening line of the paragraph: the boundaries were counted on the
# German (e.g. Rn. 202 = «(b) So oder so...», Rn. 203 = «Dabei könnte sich der Staat ... nicht
# entziehen», Rn. 204 = «Das Pariser Übereinkommen...») and checked against the Court's internal cross-references
# (Rn. 225 -> «oben Rn. 203»; Rn. 182 -> «Rn. 154, 164, 177» and «Rn. 178»; Rn. 243 -> «Rn. 192 ff.»;
# Rn. 247 -> «Rn. 194», «Rn. 228»; Rn. 246 -> «Rn. 198»; Rn. 210 -> «Rn. 201») and against the index (Gliederung).
# In the English the marginal number is sometimes on the following page for paragraphs spanning pages
# (Rn. 198, 201, 203) and two Rn. may be merged into one paragraph (205-206): the German governs.
# In the German, passages spanning pages carry the page number and the numbers of the following Rn.
# inserted by the extraction; the pages indicated here are those in which the paragraph begins and ends.
#
# CORRECTIONS WITH RESPECT TO `neubauer.yaml` (v. 1, unmodified): see file, 2.2 (Rn. 203 not 202;
# 172 not 173; 187 not 188; 176 not 177 and 175 not 176; 179 not 180; 209 not 208; 205-206; 207; 120).
#
# PROBES: schutzpflicht_clima, vorwirkung_liberta_intertemporale, proporzionalita_intergenerazionale,
# budget_co2_parametro, art20a_giustiziabile_autovincolo, protezione_extraterritoriale.
# LINKS of the chain (file, section 0):
#   a = largely irreversible warming, cumulative CO2, finite remaining budget
#   b = Schutzpflicht of life and health directed to the future, only objective towards posterity, mitigation
#       internationally embedded plus adaptation, limited review: not violated
#   c = art. 20a justiciable, international dimension, concretized by the legislature in the Paris
#       target that binds it
#   d = target translated into remaining budget, global then national; no judicial figure; special
#       diligence under uncertainty
#   e = eingriffsähnliche Vorwirkung of the quantities permitted today on the future freedom of the same applicants
#   f = proportionality between generations: no generation consumes the budget by offloading a radical reduction
#   g = remedy: precautions, timely orientation, legislative reservation, order to legislate by 31/12/2022
#   h = abroad: Schutzpflicht conceivable in principle, of different content, left open
# Empty lists: the passage supports no probe nor link (facts, procedure) or supports only an axis
# not promoted to a probe (Leitsatz 2c and Rn. 199-204: Urgenda's own_share nested; Leitsatz 5 and
# Rn. 259-265: legislative reservation).

