  - paragrafo: "243"
    documento: neubauer-et-al-v-germany-order_c68f
    pagina_de: 100
    pagina_en: 72
    sintesi: "In unconstitutional terms, as they create an uncontained risk of future harm: the duty arising from proportionality to distribute reductions over time in a forward-looking and rights-respecting manner until neutrality has been violated (reference to paras. 192 et seq.)."
    sonde: [proporzionalita_intergenerazionale, vorwirkung_liberta_intertemporale]
    sonde_P03: []
    sonde_P04: []
    sonde_P05: []
    rivista: "30/09/2026, reading of the paragraph text, to be confirmed by the team's legal expert; before: [proporzionalita_intergenerazionale]"
