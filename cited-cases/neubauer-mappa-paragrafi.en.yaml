  - paragrafo: "242"
    documento: neubauer-et-al-v-germany-order_c68f
    pagina_de: 100
    pagina_en: 71-72
    sintesi: "It remains for the legislature the commitment, declared by concretizing Art. 20a, to limit warming possibly to 1.5; the 55% seems to have originated from the 2 degrees (Rn. 166)."
    sonde: [art20a_giustiziabile_autovincolo]
    sonde_P03: []
    sonde_P04: []
    sonde_P05: []
    prepara: [budget_co2_parametro]
