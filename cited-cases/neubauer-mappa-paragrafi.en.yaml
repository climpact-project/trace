    pagina_de: 80
    pagina_en: 55-56
    sintesi: "Justification in two steps: compatibility with the fundamental decisions of the Constitution, including Art. 20a (Leitsatz 3), and proportionality towards future freedom; the risk would be unjustifiable if the provisions violated Art. 20a."
    sonde: [art20a_giustiziabile_autovincolo]
    sonde_P03: [liberta_intertemporale]
    sonde_P04: [liberta_intertemporale]
    sonde_P05: [liberta_intertemporale]
    prepara: [proporzionalita_intergenerazionale, vorwirkung_liberta_intertemporale]
