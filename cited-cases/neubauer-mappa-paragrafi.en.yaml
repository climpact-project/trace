    verbatim: "The state may not evade its responsibility here by pointing to greenhouse gas emissions in other states"

  - paragrafo: "204"
    documento: neubauer-et-al-v-germany-order_c68f
    pagina_de: 86
    pagina_en: 61
    sintesi: "Paris rests on mutual trust: a common target without binding measures, a voluntary and transparent mechanism; trust in the will to comply is the key to its effectiveness; the path of Art. 20a passes through this agreement. (Cited by Eicke in KlimaSeniorinnen as «§ 204».)"
    sonde: []
    sonde_P03: [dimensione_internazionale]
    sonde_P04: [dimensione_internazionale]
    sonde_P05: [dimensione_internazionale]
    anelli: [c]
    verbatim: "The Paris Agreement very much relies on mutual trust as a precondition for effectiveness."

  - paragrafo: "205"
    documento: neubauer-et-al-v-germany-order_c68f
    pagina_de: 86-87
    pagina_en: 61-62
    sintesi: "CANONICAL art20a_giustiziabile_autovincolo. The objection that Art. 20a does not offer a justiciable standard and leaves the targets to the legislature does not exclude review; Art. 20a is a justiciable norm, also in the Klimaschutzgebot; the text assigns the law a prerogative of concretisation, but it is not a non-binding proclamation (Emissionshandel)."
    sonde: [art20a_giustiziabile_autovincolo]
    sonde_P03: [budget_residuo]
    sonde_P04: [budget_residuo]
    sonde_P05: [budget_residuo]
    rivista: "30/09/2026, reading of the paragraph text, to be confirmed by the team lawyer; before: [art20a_giustiziabile_autovincolo]"
    anelli: [c]
    verbatim: "Art. 20a GG is a justiciable legal provision."

  - paragrafo: "206"
    documento: neubauer-et-al-v-germany-order_c68f
    pagina_de: 87
    pagina_en: 61-62
    sintesi: "The constraint must not be abandoned by leaving concretisation to the legislature alone: Art. 20a acts as a counterweight to the political process, organised in electoral cycles and structurally slow on long-term ecological interests, while future generations, the most affected, have no voice; it imposes substantive constraints on democratic decision-making. (In the English merged into the paragraph of Rn. 205.)"
    sonde: [art20a_giustiziabile_autovincolo]
    sonde_P03: [budget_residuo]
    sonde_P04: [budget_residuo]
    sonde_P05: [budget_residuo]
    rivista: "30/09/2026, reading of the paragraph text, to be confirmed by the team lawyer; before: [art20a_giustiziabile_autovincolo]"
    anelli: [c]
    verbatim: "future generations - those who will be most affected - naturally have no voice of their own in shaping the current political agenda"

  - paragrafo: "207"
    documento: neubauer-et-al-v-germany-order_c68f
    pagina_de: 87
    pagina_en: 62
    sintesi: "Art. 20a leaves a wide margin; it is not in principle for the courts to derive from it quantified warming limits, emission quantities or reduction targets; but it must not be emptied, and review of its boundaries remains with the Court: it is not the only norm excluded from judicial scrutiny. (neubauer.yaml: «Rn. 206-207».)"
    sonde: [art20a_giustiziabile_autovincolo]
    sonde_P03: [budget_residuo]
    sonde_P04: [budget_residuo]
    sonde_P05: [budget_residuo]
    prepara: [budget_co2_parametro]
    rivista: "30/09/2026, reading of the paragraph text, to be confirmed by the team lawyer; before: [art20a_giustiziabile_autovincolo, budget_co2_parametro]"
    anelli: [c, d]
    verbatim: "It is not, in principle, for the courts to translate the open wording of Art. 20a GG into quantifiable global warming limits and corresponding emission amounts or reduction targets."

  - paragrafo: "208-210"
    documento: neubauer-et-al-v-germany-order_c68f
    pagina_de: 88-89
    pagina_en: 62-63
    sintesi: "The legislature has concretised the target in § 1 S. 3 KSG (well below 2, possibly 1.5): it is the constitutional measure also for the Court (208); text of § 1 KSG (209, not 208 as in neubauer.yaml); it is the Paris threshold deliberately assumed, in a framework in which Germany fulfils Art. 20a through international means (210)."
    sonde: [art20a_giustiziabile_autovincolo]
    sonde_P03: [budget_residuo]
    sonde_P04: [budget_residuo]
    sonde_P05: [budget_residuo]
    rivista: "30/09/2026, reading of the paragraph text, to be confirmed by the team lawyer; before: [art20a_giustiziabile_autovincolo]"
    anelli: [c]
    verbatim: "The temperature limit specified in § 1 third sentence KSG is the relevant standard under constitutional law and must also form the basis of the Federal Constitutional Court’s review."

  - paragrafo: "211-212"
    documento: neubauer-et-al-v-germany-order_c68f
    pagina_de: 89-90
    pagina_en: 63-64
    sintesi: "The legislature is not free, but with the Paris target it remains within the margin, given the uncertainty documented by the IPCC; new reliable knowledge may impose other targets (Court review, permanent duty of adjustment); a retreat would have to be justified (Art. 4(3) Paris, § 3(3) KSG)."
    sonde: [art20a_giustiziabile_autovincolo]
    sonde_P03: [budget_residuo]
    sonde_P04: [budget_residuo]
    sonde_P05: [budget_residuo]
    prepara: [budget_co2_parametro]
    rivista: "30/09/2026, reading of the paragraph text, to be confirmed by the team lawyer; before: [art20a_giustiziabile_autovincolo, budget_co2_parametro]"
    anelli: [c]

  - paragrafo: "213"
    documento: neubauer-et-al-v-germany-order_c68f
    pagina_de: 90-91
    pagina_en: 64-65
    sintesi: "CANONICAL bis art20a_giustiziabile_autovincolo. The target of § 1 S. 3 KSG is an essential concretisation with an orientation function also for review; the legislature could redefine it, but not every incompatible norm is a new concretisation: a change of course must be recognisable and publicly debatable, for the transparency function of the legislative process; as long as it does not redefine it in this way, it is bound by its own concretisation."
    sonde: [art20a_giustiziabile_autovincolo]
    sonde_P03: [budget_residuo]
    sonde_P04: [budget_residuo]
    sonde_P05: [budget_residuo]
    rivista: "30/09/2026, reading of the paragraph text, to be confirmed by the team lawyer; before: [art20a_giustiziabile_autovincolo]"
    anelli: [c]
    verbatim: "it must be held to its own specification of the goal arising from constitutional law"

  - paragrafo: "214-215"
    documento: neubauer-et-al-v-germany-order_c68f
    pagina_de: 91
    pagina_en: 65
    sintesi: "Measured against the target, the norms do not violate Art. 20a; but the review is not direct: the temperature must be translated into emissions using the IPCC budget approach (a); the calculation of the national budget (b) involves uncertainties and assessments; margin of the legislature, not arbitrary: reliable data on possible exceedance must be considered, not as an exact measure (c)."
    sonde: [budget_co2_parametro]
    sonde_P03: [budget_residuo]
    sonde_P04: [budget_residuo]
    sonde_P05: [budget_residuo]
    prepara: [art20a_giustiziabile_autovincolo]
    rivista: "30/09/2026, reading of the paragraph text, to be confirmed by the team lawyer; before: [budget_co2_parametro]"
    anelli: [d]
    verbatim: "the temperature measurement must be converted into an emission measurement"

  - paragrafo: "216"
    documento: neubauer-et-al-v-germany-order_c68f
    pagina_de: 91
    pagina_en: 65
    sintesi: "Two steps: from the threshold (linear relationship, Rn. 32) to the remaining global budget, then the share attributable to Germany, the remaining national budget; the IPCC and SRU have calculated them and on this basis the compatibility of the permitted quantities can be measured."
    sonde: [budget_co2_parametro]
    sonde_P03: [budget_residuo]
    sonde_P04: [budget_residuo]
    sonde_P05: [budget_residuo]
    rivista: "30/09/2026, reading of the paragraph text, to be confirmed by the team lawyer; before: [budget_co2_parametro]"
    anelli: [d]
    verbatim: "The second step is to determine how much of this is attributable to Germany - this is the specific remaining national CO2 budget."

  - paragrafo: "217-218"
    documento: neubauer-et-al-v-germany-order_c68f
    pagina_de: 91-92
    pagina_en: om.
    sintesi: "Only in German: the Government declares that it does not reason in terms of national budgets but does not deny their validity; reduction targets without an idea of the total quantity risk exceeding the threshold, it would be doing climate «ins Blaue hinein» by trial and error; the Government itself admits the budget as a plausibility check (reception: Hoge Raad 2.1, 4.6, 7.4.3; Irish Supreme Court 4.3)."
    sonde: [budget_co2_parametro]
    sonde_P03: [budget_residuo]
    sonde_P04: [budget_residuo]
    sonde_P05: [budget_residuo]
    rivista: "30/09/2026, reading of the paragraph text, to be confirmed by the team lawyer; before: [budget_co2_parametro]"
    anelli: [d]
    verbatim: "Letztlich bedeutete dies, Klimaschutz ins Blaue hinein zu betreiben."

  - paragrafo: "219"
    documento: neubauer-et-al-v-germany-order_c68f
    pagina_de: 93
    pagina_en: 66
    sintesi: "Figures: IPCC since 2018, 420 Gt for 1.5 degrees at 67%, 1170 Gt for 2 degrees; SRU since 2020, 6.7 Gt for Germany for 1.75 degrees at 67% (excluding prov_ipcc_budget)."
    sonde: []
    sonde_P03: [budget_residuo]
    sonde_P04: [budget_residuo]
    sonde_P05: [budget_residuo]
    prepara: [budget_co2_parametro]
    rivista: "30/09/2026, reading on the text of the paragraph, to be confirmed by the team lawyer; before: [budget_co2_parametro]"
    anelli: [d]

  - paragrafo: "220-223"
    documento: neubauer-et-al-v-germany-order_c68f
    pagina_de: 93-94
    pagina_en: 66-67
    sintesi: "The SRU calculation is verifiable and based on the IPCC but with significant uncertainties on the global budget (±400, ±250, -100, ±250 Gt; negative emissions); no more precise data; the applicants do not doubt its reliability, nor does the Government, which only considers the uncertainties too great to draw conclusions from them (polarity polarita_incertezze_troppo_grandi)."
    sonde: [budget_co2_parametro]
    sonde_P03: [budget_residuo]
    sonde_P04: [budget_residuo]
    sonde_P05: [budget_residuo]
    rivista: "30/09/2026, reading on the text of the paragraph, to be confirmed by the team lawyer; before: [budget_co2_parametro]"
    anelli: [d]

  - paragrafo: "224-227"
    documento: neubauer-et-al-v-germany-order_c68f
    pagina_de: 94-95
    pagina_en: 67-68
    sintesi: "National budget: different allocation criteria (SRU: per capita, 1.1%); Art. 20a does not set one nor the fair share, but the choice is not arbitrary and the obligation does not lapse because the share is indeterminable; it must be chosen so as to foster mutual trust (Rn. 203); indications from international law (Art. 2(2), 4(4) Paris; Art. 3 UNFCCC, CBDR); transfers under Art. 6 Paris and negative emissions uncertain."
    sonde: [art20a_giustiziabile_autovincolo, budget_co2_parametro]
    sonde_P03: [budget_residuo]
    sonde_P04: [budget_residuo]
    sonde_P05: [budget_residuo]
    rivista: "30/09/2026, reading on the text of the paragraph, to be confirmed by the team lawyer; before: [budget_co2_parametro]"
    anelli: [d]
    verbatim: "Nor can a specific constitutional obligation to reduce CO2 emissions be invalidated by simply arguing that Germany’s share of the reduction burden and of the global CO2 budget are impossible to determine."

  - paragrafo: "228"
    documento: neubauer-et-al-v-germany-order_c68f
    pagina_de: 95
    pagina_en: 68
    sintesi: "The uncertainties go in both directions: the remaining budget could also be smaller."
    sonde: [budget_co2_parametro]
    sonde_P03: [budget_residuo]
    sonde_P04: [budget_residuo]
    sonde_P05: [budget_residuo]
    rivista: "30/09/2026, reading on the text of the paragraph, to be confirmed by the team lawyer; before: [budget_co2_parametro]"
    anelli: [d]

  - paragrafo: "229"
    documento: neubauer-et-al-v-germany-order_c68f
    pagina_de: 95-96
    pagina_en: 68-69
    sintesi: "Although uncertain, the SRU quantification must be taken into account by the statutory targets; Art. 20a leaves a margin of appreciation but not at will: under scientific uncertainty it sets limits and imposes a special duty of care, also in responsibility towards future generations: to consider sufficiently reliable indications of serious or irreversible damage (Art. 3(3) UNFCCC); the IPCC estimates must be considered if they indicate the possible exceeding of the threshold."
    sonde: [budget_co2_parametro]
    sonde_P03: [budget_residuo]
    sonde_P04: [budget_residuo]
    sonde_P05: [budget_residuo]
    prepara: [art20a_giustiziabile_autovincolo]
    rivista: "30/09/2026, reading on the text of the paragraph, to be confirmed by the team lawyer; before: [budget_co2_parametro]"
    anelli: [d]
    verbatim: "the legislator must even take account of mere indications pointing to the possibility of serious or irreversible impairments, as long as these indications are sufficiently reliable"

  - paragrafo: "230-235"
    documento: neubauer-et-al-v-germany-order_c68f
    pagina_de: 96-97
    pagina_en: 69-70
    sintesi: "Application: the provisions hold; but with 6.7 Gt the budget would be almost exhausted by 2030 (Anlage 2 amounts to about 7 Gt CO2eq, over 6 Gt CO2, without LULUCF and international transport); neutrality immediately after 2030 unlikely; with 1.75-2 degrees not excluded; 1.75 does not achieve the effort for 1.5."
    sonde: [budget_co2_parametro]
    sonde_P03: [budget_residuo]
    sonde_P04: [budget_residuo]
    sonde_P05: [budget_residuo]
    prepara: [art20a_giustiziabile_autovincolo, proporzionalita_intergenerazionale]
    rivista: "30/09/2026, reading on the text of the paragraph, to be confirmed by the team lawyer; before: [budget_co2_parametro]"
    anelli: [d]

  - paragrafo: "236-237"
    documento: neubauer-et-al-v-germany-order_c68f
    pagina_de: 97-98
    pagina_en: 70-71
    sintesi: "No ascertainable exceeding of the margin: the uncertainty on the global and national budget is too great for the SRU figure to be an exact measure of control; the IPCC estimates must nonetheless be considered (Rn. 229) but the violation of this duty of care is not ascertainable: budget largely consumed, not exceeded; the SRU chose 1.75 and not 2 degrees."
    sonde: [budget_co2_parametro]
    sonde_P03: [budget_residuo]
    sonde_P04: [budget_residuo]
    sonde_P05: [budget_residuo]
    prepara: [art20a_giustiziabile_autovincolo]
    rivista: "30/09/2026, reading on the text of the paragraph, to be confirmed by the team lawyer; before: [budget_co2_parametro]"
    anelli: [d]
    verbatim: "currently too great to allow the budget size calculated by the Advisory Council to serve as an exact numerical benchmark for review by the Federal Constitutional Court"

  - paragrafo: "238"
    documento: neubauer-et-al-v-germany-order_c68f
    pagina_de: 98
    pagina_en: 71
    sintesi: "That current instruments are insufficient for the 55% is not a constitutional violation: § 3(1) S. 2 KSG is not the concretization of Art. 20a (it is § 1 S. 3); the deficit is recoverable."
    sonde: [art20a_giustiziabile_autovincolo]
    sonde_P03: []
    sonde_P04: []
    sonde_P05: []
    rivista: "30/09/2026, reading on the text of the paragraph, to be confirmed by the team lawyer; before: [art20a_giustiziabile_autovincolo]"
