    anelli: [e, f]

  - paragrafo: "183"
    documento: neubauer-et-al-v-germany-order_c68f
    pagina_de: 78
    pagina_en: 53-54
    sintesi: "CANONICAL bis vorwirkung_liberta_intertemporale. The decision to permit the quantities until 2030 has an anticipatory effect similar to an interference with protected freedom and requires justification; no violation of Art. 20a; unconstitutional due to disproportionate risk; obligation to safeguard freedom over time and to allocate it among generations; minimum post-2030 rules that guide and incentivise are lacking."
    sonde: [proporzionalita_intergenerazionale, vorwirkung_liberta_intertemporale]
    sonde_P03: [liberta_intertemporale]
    sonde_P04: [liberta_intertemporale]
    sonde_P05: [liberta_intertemporale]
    rivista: "30/09/2026, reading of the paragraph text, to be confirmed by the team lawyer; before: [proporzionalita_intergenerazionale, vorwirkung_liberta_intertemporale]"
    anelli: [e, f, g]
    verbatim: "has an advance interference-like effect (eingriffsähnliche Vorwirkung) on the freedom of the complainants"

  - paragrafo: "184-185"
    documento: neubauer-et-al-v-germany-order_c68f
    pagina_de: 78-79
    pagina_en: 54
    sintesi: "All freedom, including that which emits CO2, is protected (Art. 2(1) GG); but it encounters the limits of Art. 20a and of the Schutzpflichten, given that CO2 is irreversible; once the target budget is exhausted, emissive freedom prevails only if it wins in the balancing exercise, with decreasing weight."
    sonde: [art20a_giustiziabile_autovincolo, vorwirkung_liberta_intertemporale]
    sonde_P03: [liberta_intertemporale]
    sonde_P04: [liberta_intertemporale]
    sonde_P05: [liberta_intertemporale]
    prepara: [budget_co2_parametro]
    rivista: "30/09/2026, reading of the paragraph text, to be confirmed by the team lawyer; before: [art20a_giustiziabile_autovincolo, vorwirkung_liberta_intertemporale]"
    anelli: [e]

  - paragrafo: "186"
    documento: neubauer-et-al-v-germany-order_c68f
    pagina_de: 79
    pagina_en: 54-55
    sintesi: "The provisions that permit emissions today create an irreversible legal risk for future freedom: every permitted quantity consumes the constitutionally predetermined budget; rapid consumption by 2030 shortens the time for technical and social developments."
    sonde: [budget_co2_parametro, vorwirkung_liberta_intertemporale]
    sonde_P03: [liberta_intertemporale]
    sonde_P04: [liberta_intertemporale]
    sonde_P05: [liberta_intertemporale]
    prepara: [proporzionalita_intergenerazionale]
    rivista: "30/09/2026, reading of the paragraph text, to be confirmed by the team lawyer; before: [budget_co2_parametro, vorwirkung_liberta_intertemporale]"
    anelli: [e]
    verbatim: "every amount of CO2 that is allowed today irreversibly depletes the remaining budget that was predetermined in accordance with constitutional law"

  - paragrafo: "187"
    documento: neubauer-et-al-v-germany-order_c68f
    pagina_de: 79-80
    pagina_en: 55
    sintesi: "The risk is caused precisely by the provisions that set the quantities (§§ 3(1) S. 2, 4(1) S. 3 KSG, Anlage 2): inevitable and irreversible consumption of the budget; anticipatory effect not only in fact but in law, because it is the Constitution itself that makes the prohibition on any consumption more urgent; justification is required already now. (neubauer.yaml: Rn. 188.)"
    sonde: [vorwirkung_liberta_intertemporale]
    sonde_P03: [liberta_intertemporale]
    sonde_P04: [liberta_intertemporale]
    sonde_P05: [liberta_intertemporale]
    rivista: "30/09/2026, reading of the paragraph text, to be confirmed by the team lawyer; before: [vorwirkung_liberta_intertemporale]"
    anelli: [e]
