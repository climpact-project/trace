    pagina_de: 81
    pagina_en: 56
    sintesi: "CANONICAL proporzionalita_intergenerazionale. Rights require that reductions up to climate neutrality be allocated over time in a forward-looking manner, so that losses of freedom remain reasonable and burdens do not fall unilaterally on the future; no generation may consume a large part of the budget with light weight, leaving subsequent generations a radical reduction (the applicants' «Vollbremsung»); the impact must be assessed today, while it is still possible to change course."
