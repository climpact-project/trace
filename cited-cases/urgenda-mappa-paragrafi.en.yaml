# English translation of the Italian case file used by TRACE 0.1 (urgenda-mappa-paragrafi.yaml, SHA-256 9bc4f7d47ca8158990c996b6f69313587c5f8594fae6392edb4c5112a7e4d3e7), made on 7 October 2026 with DeepSeek V4 Flash and not yet checked by the research team.
# MAP OF URGENDA PARAGRAPHS — version 1, 23 September 2026
#
# Companion to `urgenda-fascicolo.md`. It serves to decipher precise citations of the type
# «Urgenda, supra note 33, paras. 5.7.5-5.7.7» and to know which probe and which link
# of the chain a paragraph supports.
#
# SOURCES. Only the three documents of the corpus, in English translation:
#   rechtbank_2015  urgenda-foundation-v-state-of-the-netherlands-decision_f1ad  (Rechtbank Den Haag, 24/6/2015, 55 pp.)
#   hof_2018        urgenda-foundation-v-state-of-the-netherlands-decision_8a5e  (Gerechtshof Den Haag, 9/10/2018, 19 pp.)
#   hoge_raad_2019  urgenda-foundation-v-state-of-the-netherlands-judgment_ed17  (Hoge Raad, 20/12/2019, 47 pp.)
# `pagina` = number of the `<!-- page N -->` marker of the markdown, which coincides with the PDF page.
#
# HOW THE PARAGRAPH NUMBERS WERE ESTABLISHED. In the print PDFs of rechtspraak.nl the
# numbers are in a column at the top of each page, detached from the text. The paragraph of each
# paragraph was reconstructed by counting the paragraphs that begin on the page, and checked:
#   - Hoge Raad: against the original Dutch of the corpus (judgment_4966) and the court's internal
#     cross-references (e.g. 4.8 refers to 4.7, 7.5.3 to 5.3.4, 8.2.6 to «8.2.4, second paragraph»);
#   - Rechtbank: against the index of the judgment itself (pp. 3-4) and the summary of the
#     Advocate General's conclusion (opinion_9d44, pp. 11-12), which cites 4.6, 4.7, 4.8, 4.34, 4.42-4.46, 4.54, 4.55, 4.63,
#     4.83-4.93, 4.94-4.102;
#   - Hof: numbers printed at the beginning of each paragraph, no reconstruction.
# `incerto: true` marks the few entries in which the boundary between two numbers cannot be decided from the corpus.
#
# THREE CORRECTIONS WITH RESPECT TO `urgenda.yaml` (version 2, unmodified):
#   1. The canonical of `ordine_non_legge` («Therefore, the courts are not prevented ... They may
#      also order ... as long as that order does not amount to an order to create legislation with a
#      particular content») is para. 8.2.6, not 8.2.7. The 8.2.7 is the following paragraph
#      («In light of the foregoing ... leaves the State free to choose the measures»). Verified
#      against the Dutch: «Uit het voorgaande volgt ...» falls under 8.2.6, «In het licht van het voorgaande»
#      opens 8.2.7 (judgment_4966, pp. 35-36).
#   2. The passage on due diligence and Jugheli (referred to by `due_diligence_buon_governo` at 5.3.4) is
#      para. 5.3.3; the 5.3.4 is the limit of the «impossible or disproportionate burden» (as stated by the Dutch
#      at p. 21 and by the cross-reference of 7.5.3). The English translation of 6.5 erroneously writes «5.5.3».
#   3. The seed of `dovere_diligenza` «However, both articles ... can serve as a source of
#      interpretation» is para. 4.46 of the Rechtbank, not 4.45 (4.45 is the denial of victim
#      status under Article 34 ECHR). This is stated by the judgment itself in 4.109 («In 4.45 and 4.46») and by the Advocate General.
#   Furthermore, the quotation from the Council of Europe Manual on the «wide margin of appreciation»
#   is in para. 4.48 (which continues on p. 41), not in 4.49.
#
# PROBES: propria_quota, obblighi_positivi, dovere_diligenza, ordine_non_legge, target_giudiziale.
# LINKS of the chain (ISTRUZIONI_CATENA in tools/adjudica_llm.py):
#   a = serious risk, known to science, deferred by decades, affecting the entire population
#   b = a duty of care of the State follows from it (civil-law diligence or Articles 2 and 8 ECHR)
#   c = the modest contribution does not exonerate: each is responsible for their own share
#   d = the minimum content is derived from scientific and international consensus; the court fixes it
#   e = order as to result, freedom of means
# Empty lists: the paragraph supports no probe nor link (facts, procedure).

voci:

