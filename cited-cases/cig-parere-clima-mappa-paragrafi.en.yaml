# English translation of the Italian case file used by TRACE 0.1 (cig-parere-clima-mappa-paragrafi.yaml, SHA-256 543294e80301593c3f42d908890a2fd1c1aa65fba6e193b4984dfe1e275d1fd8), made on 7 October 2026 (the P09 fields added on 8 October 2026) with DeepSeek V4 Flash and not yet checked by the research team.
# MAP OF THE PARAGRAPHS OF THE ICJ ADVISORY OPINION ON CLIMATE (Obligations of States in respect of Climate Change, 23/7/2025)
# Proposal of 01/10/2026 for the PI; probes in the second version indicated by the PI.
#
# Companion to `cig-parere-clima-fascicolo.md` and `cig-parere-clima.yaml`. It serves to decipher quotations such as
# «ICJ AO, para. 427», «Obligations of States in respect of Climate Change, paras 280-300», «§ 403», «¶¶ 388-89»,
# «[438]», «Parágrafo 242», and to know which probe a passage supports.
#
# SOURCE. A single document in the corpus: request-for-an-advisory-opinion-on-the-obligations-of-states-with-respect-to-
# climate-change-decision_af16 (140 pp.). ENGLISH text; the cover also bears the French title, but the French
# text, which is authoritative (§ 457), is not in the corpus [not verified in the corpus].
# `pagina` = number of the marker `<!-- page N -->` in the markdown, which coincides with the PDF page.
# `pagina_stampa` = page number at the foot of the Court's edition («- 73 -»): PDF page minus 7.
# The pages of a group run from the page on which the first paragraph begins to the one on which the last ends;
# when a section heading begins after a paragraph, the final page may be that of the heading.
#
# NUMBERING. The paragraphs are those of the Court, from 1 to 457, counted sequentially in the text (no gaps, no
# duplicates). § 457 is the operative part; quotations of the type «operative para. 3(E)» or «457(3)(A)(f)» must be read at the
# cited point: § 457 does not carry a single probe.
#
# PROBES (second version, approved by the PI on 01/10/2026: only DISTINCTIVE principles, specific to this opinion; prefix
# `cig-parere-clima.` in the case file): obiettivo_1_5, ndc_discrezionalita_limitata, diligenza_stringente_clima,
# non_lex_specialis, fossili_illecito, erga_omnes, continuita_stato.
# Each paragraph carries at most ONE probe: the ranges of the probes do not overlap.
# Empty lists: facts, procedure, science, scope of the questions, parties' arguments, and the GENERIC principles that
# the PI has excluded from the probes (cooperation, human rights and the environment, adaptation, CBDR-RC, intergenerational equity,
# UNCLOS). The operative part (§ 457) carries no probes: its summary states which sub-points correspond to which probe.
# The first version of the map (seven different probes) is replaced by this one.
# `verbatim`, where present, is a short phrase found identically in the corpus text (normalized spaces).

# FIELDS OF SERIES P09 (08/10/2026): proposal of 8/10 (training/mappa_cig_P09/PROPOSTA-2026-10-08.md) revised by the research
# group with the PI's decisions of 8/10/2026; Claude Opus 5.5 as ancillary support (tidying and reordering).
#   sonde_P09       P09 probes that the entry SUPPORTS (id without the case prefix); the tool tools/principi_da_paragrafi.py reads them
#                   with --sonde P09. The old field `sonde` (P07) remains as it was.
#   sostengono_P09  when present: only the paragraphs of the entry that support; the others of the entry prepare
#   prepara_P09     probes that the entry only PREPARES: it does not enter principi_da_paragrafi
#   dispositivo_P09 (only § 457) the sub-points of the operative part with their probes; a quotation «457(3)(B)(a)» takes the
#                   probes of the cited sub-point (also written «457(B)(a)»), the bare «§ 457» only prepares
#   confidenza_P09, ragione_P09, verbatim_P09  as in the proposal; «decided by PI» on the three entries decided by the PI

