  sintesi: "Operative paragraph, unanimously: (1) jurisdiction; (2) response to the request; (3) A obligations under the climate treaties, letters a-h; B custom, a prevention and b cooperation; C ozone, biodiversity, desertification; D UNCLOS; E human rights; (4) violation and wrongful act, duty to perform, cessation, assurances, full reparation with a sufficiently direct and certain causal link. Correspondences with the probes (para. 457 bears none): (3)A(e) and (3)A(f), NDCs capable together of 1.5 degrees, to ndc_discrezionalita_limitata ((f) also mentions 1.5, cf. obiettivo_1_5); (3)B(a), prevention with due diligence, to diligenza_stringente_clima; (4) to fossili_illecito (violation as wrongful act) and to erga_omnes (cessation, assurances, reparation). They have no sub-point of the operative paragraph: non_lex_specialis, continuita_stato, and the erga omnes part in the strict sense."
