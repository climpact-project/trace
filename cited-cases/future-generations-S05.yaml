# CASO CITATO — FUTURE GENERATIONS (Generaciones Futuras v. Minambiente), query specification v2
#
# VERSIONE 2 (23 settembre 2026): riscrittura della v1 del 9 settembre secondo il Registro di
# Urgenda (732 righe giudicate, prima misura vera delle sonde). Che cosa cambia, e perche':
#
# 1. LA SONDA PORTA LA VIA, NON LA CONCLUSIONE (registro, "Come reimpostare le sonde", 1; falsi
#    positivi che dicono la stessa cosa di Urgenda prendendola da Parigi, dalla CBDR, da una
#    costituzione). Test applicato a ogni sonda: "reggerebbe identica se il caso non fosse mai
#    esistito?" — la domanda che con Qwen ha separato il 56% dal 21%. Tre sonde della v1 non lo
#    passavano e sono riscritte: `conexidad_diritti` (ora porta «seres sintientes» e la
#    sopravvivenza di famiglia, societa' e Stato), `deforestazione_clima_diritti` (ora porta la
#    deforestazione come fonte climatica e la corresponsabilita' dello Stato per solidarieta'),
#    `ecocentrico_antropico` (ora porta il conio «ecocéntrico-antrópico», «a la par», i
#    «derechos-deberes»). Le altre quattro lo passavano gia'.
# 2. ESCLUSIONI DI POLARITA' E DI PROVENIENZA, NON DI STESSO TEMA (registro, 4: stesso tema 27,4%
#    contro nessuna 32,7%, non distingue; polarita' 13,2%, distingue). Le escluse di stesso tema
#    della v1 sono tolte. Ogni sonda ha ora: una POLARITA' (chi dice il contrario) e da tre a
#    cinque PROVENIENZE (chi dice la stessa cosa prendendola da un'altra fonte: costituzione,
#    Corte Constitucional, Stoccolma, Parigi, dottrina, altro caso). Campo `tipo`.
# 3. IL TESTO VERO BATTE IL TESTO SCRITTO (registro, 6: passaggi reali 0,681, frasi scritte da un
#    LLM 0,630). Dove la fonte e' nel fascicolo, l'esclusa e' VERBATIM dal corpus, con documento e
#    pagina: la Corte cita per esteso le proprie fonti (T-411/1992, C-431/2000, C-449/2015, art. 79
#    C.P., Stoccolma, Parigi, T-622/2016, T-362/2014, STC 7630/2016, Peces-Barba, Rodríguez Palop),
#    e il primo grado scrive la polarita' procedurale. Campo `origine: verbatim`. Dove la fonte non
#    e' nel fascicolo (Rio, UNFCCC, OC-23/17, Ecuador, Neubauer, Juliana, Urgenda), l'esclusa e'
#    scritta dall'esecutore, `origine: redazionale`, DA SOSTITUIRE con i passaggi veri bocciati dai
#    validatori dopo la prima esecuzione.
# 4. UNA FORMULAZIONE SOLA PER DEFAULT (registro, 2: la seconda allarga del 64-80% e su tre sonde su
#    cinque porta rumore). Si esegue `testo`. `probe_alternativa` e `probe_es` restano nel file
#    come PROVE: si eseguono una volta, si misurano da sole sul campione giudicato, si tengono solo
#    se rendono almeno quanto `testo`. Vedi `politica_formulazioni`.
# 5. MARCATORI SOLO NELLE LINGUE DEL CORPUS, CORTI, DA CONTARE (registro, 7: 44 marcatori su 101
#    di Urgenda non compaiono mai nel corpus). Tolti it/pt/fr; restano en/es, 1-3 parole;
#    `contati_sul_corpus: false` finche' non sono contati; `falsi_amici` con la ragione (lezione di
#    "tort", 6% di precisione).
# 6. LE FRASI DELLA SENTENZA SONO UNA RICERCA A PARTE (registro, 8: 403 righe mai viste dalle
#    sonde). `canonical` e `seeds` vanno eseguiti come query autonome, mai incollati nella sonda.
#    Vedi `frasi_della_sentenza`.
# Confermato dalla v1 e non toccato: lettore della pipeline (chiavi `nome`, `data_decisione`,
# `forme`, `semantic_queries` con `titolo` e `testo` PRIMA di `seeds`, `formulazioni_escluse` con
# `per`); canonical dallo spagnolo integrale con `corpus_legge` e `salto_pagina` dichiarati; data
# soglia 12 febbraio 2018; `probe_es` (decisioni del ricercatore, 9/9/2026).
#
# ESCLUSIONE DEGLI ATTI DEL CASO CITATO (registro, 10 e "Gli errori": nella ricerca a 2.000
# candidati 46 dei 400 migliori erano atti di Urgenda stessa). `escludi_case_id` va applicato anche
# alla ricerca allargata e alla ricerca per frasi: chi cerca con le parole del giudice trova prima
# di tutto il giudice, e qui le parole sono anche nel ricorso (122 pp.) e nell'impugnación.

