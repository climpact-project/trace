    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "209-210"
    sintesi: "CO2 Act of 2011: minus 20% by 2020, already insufficient for the Federal Council in 2009; 2020 target missed (about minus 11%)."
    sonde: [klimaseniorinnen.requisiti_quadro_regolatorio]

  - paragrafo: "§§ 560-562"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "210"
    sintesi: "Revision rejected at the referendum of 2021; legislative gap after 2024: the targets required by § 550 (a)-(b) are missing."
    sonde: [klimaseniorinnen.requisiti_quadro_regolatorio]

  - paragrafo: "§§ 563-568"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "210-212"
    sintesi: "NDC of 2021 and Climate Act of 2022, not in force: targets without concrete measures, period 2025-2030 not regulated; the mere commitment to measures «in good time» is not enough."
    sonde: [klimaseniorinnen.requisiti_quadro_regolatorio]

  - paragrafo: "§§ 569-572"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "212-213"
    sintesi: "Carbon budget: estimate by the association, no budget set by the Government; no effective framework without quantification; reference to Neubauer (Rn. 215-229) and to common but differentiated responsibilities; indicative budgets of the European Climate Law."
    sonde: [klimaseniorinnen.requisiti_quadro_regolatorio]
    nota: "§ 571 cites Neubauer: whoever takes up the national budget from here takes up Neubauer in nested form."

  - paragrafo: "§ 573"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "213"
    sintesi: "Conclusion: critical gaps, no quantification, missed past targets; by not acting in a timely, appropriate and coherent manner, the State has exceeded the margin."
    sonde: [klimaseniorinnen.requisiti_quadro_regolatorio]

