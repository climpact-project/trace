    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "191-192"
    sintesi: "Distinction between victim status and representation; the association cannot assert health; evolution of society towards climate litigation by associations."
    sonde: [klimaseniorinnen.legittimazione_associazioni]

  - paragrafo: "§ 498"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "192"
    sintesi: "Climate-specific considerations support recognising standing for associations as representatives, even if they are not themselves victims."
    sonde: [klimaseniorinnen.legittimazione_associazioni]

  - paragrafo: "§ 499"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "192"
    sintesi: "Climate as a common concern and distribution across generations support the standing of associations; States must also protect those who may be seriously affected in the future without timely action."
    sonde: [klimaseniorinnen.legittimazione_associazioni]
    nota: "The central sentence is on the merits and is cited for urgency together with § 436 (Greenpeace Nordic, a request for an advisory opinion). Assigned to associations because the opening and closing concern standing. Question to the PI."

  - paragrafo: "§§ 500-501"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "192-193"
    sintesi: "No abstract complaint about the general deterioration of living conditions; Aarhus as a reference, without admitting popular action."
    sonde: [klimaseniorinnen.legittimazione_associazioni]

  - paragrafo: "§ 502"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "193-194"
    sintesi: "The three conditions (regular establishment; statutory purpose dedicated to the defence of the members' human rights; qualification and representativeness) and the assessment factors; no separate requirement that the represented persons be victims."
    sonde: [klimaseniorinnen.legittimazione_associazioni]

  - paragrafo: "§ 503"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "194"
    sintesi: "If domestic law limits the standing of associations, the Court may consider the access to court of individual members."
    sonde: [klimaseniorinnen.legittimazione_associazioni]

  - paragrafo: "§§ 504-506"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "194"
    sintesi: "The Government's objections; joint examination with the applicability of the provisions."
    sonde: []

  - paragrafo: "§§ 507-513"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "194-196"
    sintesi: "Art. 2 in the climate context: activity dangerous to life by its very nature (§ 509); risk «reale e imminente» read in light of irreversibility, with material and temporal proximity; a serious risk of a significant decline in life expectancy may trigger Art. 2 (§ 513)."
    sonde: []
    nota: "Without a probe: Art. 2 was not examined (§§ 536-537). Cited by 12 documents (De Conto and Uricchio v. Italy for § 513, Smith v. Attorney General for §§ 507-509)."

  - paragrafo: "§§ 514-518"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "196-198"
    sintesi: "Applicability of Art. 8 in environmental cases, summary: actual interference, minimum threshold of severity, exposure to a serious environmental risk."
    sonde: []

  - paragrafo: "§ 519"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "198"
    sintesi: "Art. 8 includes a right to effective protection by the State from the serious adverse effects of climate change on life, health, well-being and quality of life."
    sonde: [klimaseniorinnen.art8_protezione_effettiva]

  - paragrafo: "§ 520"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "198"
    sintesi: "The applicability of Art. 8 depends on the same criteria as victim status (§§ 487-488) or the standing of associations (§ 502)."
    sonde: [klimaseniorinnen.art8_protezione_effettiva]

  - paragrafo: "§§ 521-526"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "198-199"
    sintesi: "Application: the association satisfies the three conditions (over 2,000 members, average age 73; the individual members did not have access to a court); it has standing and Art. 8 applies."
    sonde: [klimaseniorinnen.legittimazione_associazioni]

  - paragrafo: "§§ 527-535"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "199-201"
    sintesi: "Application: the four applicants do not reach the threshold (no critical medical condition not alleviable by available adaptation); applications inadmissible ratione personae."
    sonde: [klimaseniorinnen.vittima_soglia_alta]

  - paragrafo: "§§ 536-537"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "201-202"
    sintesi: "Art. 2 not examined for the association; individual applications under Art. 2 inadmissible; examination under Art. 8 alone, taking into account the principles of Art. 2."
    sonde: []

  - paragrafo: "§§ 538-541"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "202-205"
    sintesi: "General principles of positive obligations in environmental matters (regulatory framework, effective implementation, wide margin, choice of means, information, decision-making process) and subsidiarity: summary."
    sonde: []
    nota: "§ 538 is widely cited (16 references, 7 documents), but it summarises previous case law."

  - paragrafo: "§ 542"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "205"
    sintesi: "Climate protection weighs considerably in the balancing: urgency, severity and irreversibility, global nature of emissions, poor past record of States."
    sonde: [klimaseniorinnen.margine_differenziato]

  - paragrafo: "§ 543"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "205"
    sintesi: "Reduced margin on the commitment to combat climate change and on targets; wide margin on the choice of means."
    sonde: [klimaseniorinnen.margine_differenziato]

  - paragrafo: "§ 544"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "205-206"
    sintesi: "Art. 8 entails a right to effective protection from the serious effects of climate (reference to § 519)."
    sonde: [klimaseniorinnen.art8_protezione_effettiva]

  - paragrafo: "§ 545"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "206"
    sintesi: "The State must do its part: primary duty to adopt and concretely apply measures capable of mitigating present and future, potentially irreversible, effects."
    sonde: [klimaseniorinnen.art8_protezione_effettiva]

  - paragrafo: "§ 546"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "206"
    sintesi: "In line with UNFCCC, Paris and IPCC, States must prevent a temperature increase beyond levels capable of serious and irreversible effects on rights."
    sonde: [klimaseniorinnen.art8_protezione_effettiva]

  - paragrafo: "§ 547"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "206"
    sintesi: "The global Paris goals alone are not sufficient as a criterion: each State must define its own adequate path towards neutrality."
    sonde: [klimaseniorinnen.requisiti_quadro_regolatorio]

  - paragrafo: "§ 548"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "206-207"
    sintesi: "Substantial and progressive reduction towards neutrality within, in principle, three decades; the authorities must act in time, appropriately and consistently."
    sonde: [klimaseniorinnen.requisiti_quadro_regolatorio]

  - paragrafo: "§ 549"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "207"
    sintesi: "Immediate action and intermediate targets to avoid a disproportionate burden on future generations, within a binding national framework."
    sonde: [klimaseniorinnen.requisiti_quadro_regolatorio]

  - paragrafo: "§ 550"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "207"
    sintesi: "The five requirements: (a) timelines for neutrality and remaining carbon budget or equivalent quantification; (b) intermediate targets and pathways; (c) proof of compliance; (d) updating; (e) timely and consistent action."
    sonde: [klimaseniorinnen.requisiti_quadro_regolatorio]
    nota: "The most cited paragraph of the judgment (36 references, 17 documents)."

  - paragrafo: "§ 551"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "207"
    sintesi: "Overall assessment: a single shortcoming does not in itself entail exceeding the margin."
    sonde: [klimaseniorinnen.margine_differenziato]

  - paragrafo: "§ 552"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "207-208"
    sintesi: "Mitigation must be supplemented by adaptation measures against the most serious or imminent consequences."
    sonde: [klimaseniorinnen.art8_protezione_effettiva]

  - paragrafo: "§§ 553-554"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "208"
    sintesi: "Procedural guarantees: information accessible to the public and the possibility that the opinions and interests of the persons affected are taken into account in the decisions."
    sonde: [klimaseniorinnen.margine_differenziato]

  - paragrafo: "§ 555"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "208"
    sintesi: "Non-compliance with mitigation alone is sufficient for the violation, without examining adaptation."
    sonde: [klimaseniorinnen.requisiti_quadro_regolatorio]

  - paragrafo: "§§ 556-557"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "208-209"
    sintesi: "The Court considers the overall situation up to 14/2/2024 and does not resolve the parties' disagreement on the studies."
    sonde: []

