# ── Anchor-case record (guide §2: to be recorded for every case, BEFORE any count) ──
caso_ancora:
  posizione_nella_lista: 1              # first case built (guide §2)
  motivazione_selezione: >
    La guida (§2) prescrive che la motivazione sia enunciata su basi
    indipendenti dal corpus e prima di qualunque conteggio di citazioni; per Urgenda un
    conteggio esiste gia' (run del 31/07 e del 25/08/2026), quindi la motivazione va scritta
    dichiarando che e' posteriore. Proposta, non ancora approvata: prima decisione in cui
    una corte ordina a uno Stato una riduzione quantificata delle emissioni su base non
    legislativa; rende disponibili in forma nuova la responsabilita' per la propria quota, gli
    obblighi positivi convenzionali applicati a un rischio globale e differito, e l'ordine di
    risultato che non prescrive i mezzi.
