  progetto: chi cita Urgenda la cita a prescindere dal grado, quindi la soglia segue il giudizio e
  non la proposizione. Conseguenza da tenere presente in lettura: quattro canonical su cinque
  vengono dalla Cassazione (20 dicembre 2019) e uno dal primo grado; fra il 24 giugno 2015 e il
  20 dicembre 2019 la rete semantica restituira' candidati che non possono riprendere le
