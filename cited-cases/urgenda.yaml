# CITED CASE — URGENDA (query specification, version 2)
#
# What to search for. The codebook (`codebook/citazioni.yaml`) defines HOW to classify what is
# found; this file defines only WHAT to search for. No classification and no `tipo_citazione`
# is assigned here. This file was written against codebook `0.2-pilot`.
#
# FILE HISTORY. Version 1 = pilot: five probes whose `testo` was drawn from the Supreme Court
# judgment (two from its opening summary, one verbatim from para. 8.2.6, two paraphrased), ten
# excluded formulations without written reasons, fourteen lexical forms without exclusions.
# Version 2 keeps the FIVE PROPOSITIONS of the pilot and rewrites them following the project's
# reference specification and the format of the other cited-case files (`leghari.yaml`,
# `greenpeace-nordic.yaml`, `juliana.yaml`): verbatim canonical passage with document and page,
# seeds, 25-35-word probe, alternative probe, lexical markers, exclusions with reasons (at least
# three, one of them a polarity exclusion), lexical forms with reasoned exclusions, and the
# anchor-case record (methodological guide, §2).
#
# PIPELINE COMPATIBILITY (guide §15.1). `leggi_caso()` in `tools/cerca.py` is not a full YAML
# parser: it strips comments and reads `nome`, `codebook_versione`, `data_decisione`,
# `escludi_case_id`, `forme`, `semantic_queries` as {id, titolo, testo}, and
# `formulazioni_escluse` with `per`. The portal (`sondeDelCaso`) extracts the `titolo:` entries
# inside the `semantic_queries:` block. This file KEEPS those keys with that meaning and adds
# the documentary fields alongside them:
#   pipeline            | this file                             | other cited-case files
#   nome                | nome                                  | official_name
#   data_decisione      | data_decisione (+ data_soglia_motivazione) | data_soglia
#   forme (flat list)   | forme (flat list, categories in comments) + forme_escluse | lexical_variants.* + EXCLUSIONS
#   titolo              | titolo                                | etichetta
#   testo (the probe)   | testo  — placed BEFORE seeds, since seeds also have a `testo` field | probe
#   formulazioni_escluse| formulazioni_escluse (single block, with `per`, + `ragione`) | exclusions nested per probe
# If the other files are aligned to these keys, the pipeline reads them without changes to the
# reader. Adopting the nested schema instead would require changing `leggi_caso()`.
#
# CODING RULE: the level of court is NOT distinguished. Citing Urgenda means citing Urgenda,
# whether the reference is to the District Court of The Hague (2015), the Court of Appeal (2018)
# or the Supreme Court (2019). The rule applies to the CITING side. On the CITED side, each
# canonical passage records the document and court it comes from, because the three courts do
# not state the five propositions in the same way, and one (the civil-law duty of care) is
# stated only at first instance.
#
# EDITORIAL CONVENTION FOR VERBATIM TEXT. `canonical` and `seeds.testo` are extracted
# programmatically from the corpus markdown and verified token by token. Every deviation is
# declared in `nota_verbatim` under three categories: `omissione` (internal citation,
# parenthetical or main clause omitted), `corpus_legge` (corrected OCR corruption: none here,
# the three source documents are PDFs with native text), `salto_pagina` (new category: print
# header and marginal paragraph numbers that extraction inserts inside a passage spanning two
# pages; used once, on one seed). The court's internal cross-references ("see above in
# para. 5.2.2") are NOT omitted: they are part of the text.
#
# LANGUAGE. Probes are in English: the three judgments are read abroad in the English
# translation published on rechtspraak.nl, and later citing texts echo that vocabulary
# (rule 5.5). Probes are written as declarative judgment passages, not as questions: the index
# manifest sets `prefisso_domanda: "passage: "` (guide §13.2), so each probe is embedded as if
# it were a passage.

nome: Urgenda Foundation v. State of the Netherlands
non_english_name: Stichting Urgenda tegen De Staat der Nederlanden (Ministerie van Economische Zaken en Klimaat)
case: urgenda-foundation-v-state-of-the-netherlands_3297
codebook_versione: 0.2-pilot
stato: bozza
versione_file: 2
data_versione: 2026-09-02
