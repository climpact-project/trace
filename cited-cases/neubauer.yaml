# CITED CASE: NEUBAUER AND OTHERS v. GERMANY (Klimabeschluss), query specification v1
#
# Bundesverfassungsgericht, First Senate, Order of 24 March 2021, 1 BvR 2656/18, 1 BvR 78/20,
# 1 BvR 96/20, 1 BvR 288/20. Built with the same rules as the Urgenda register (stated in
# `future-generations.yaml` v2): each probe carries the line of reasoning, not the outcome
# (`elemento_proprio`); exclusions of polarity and provenance only; verbatim text wherever the
# source is in the case file; one formulation run by default; lexical markers in the corpus
# languages; sentences of the judgment run as a separate search; the case's own documents
# excluded from the broadened search as well.
#
# LANGUAGE. Canonical passages are verbatim from the German ORIGINAL. Seeds come from the Court's
# OFFICIAL English translation (78 pp., with omissions declared as «[…]»), the version foreign
# courts read. Probes are in English; `probe_de` holds the German formulation and is a TRIAL, like
# `probe_alternativa` (the corpus contains German documents: the five complaints of this case file,
# and Austrian and Swiss cases). Where the official translation omits a Randnummer (e.g. paras.
# 186-189, abridged), the seed is missing and this is stated.
#
# NATIVE TEXT, NO OCR: no `corpus_legge`. Both versions, however, carry the PDF's end-of-line
# HYPHENATION («Ver- pflichtung», «sen- tence»): split words are rejoined and every rejoin is
# listed in `nota_verbatim.sillabazione` (a category introduced for this file). The three genuine
# hyphens broken at line end («decision- making») are kept. Across page breaks the extraction
# inserts the page number and Randnummer numbers: `salto_pagina`.
#
# FROM FOUR PROPOSITIONS TO SIX PROBES. «Constitutional duty of protection» ->
# `schutzpflicht_clima` (with its specific point: towards future generations the duty is ONLY
# objective). «Not imposing disproportionate burdens on those who live later» ->
# `proporzionalita_intergenerazionale`. «Target consistent with the budget» ->
# `budget_co2_parametro`. «Intertemporal Freiheitssicherung, vertical and horizontal» -> two
# probes: `vorwirkung_liberta_intertemporale` (diachronic: the Vorwirkung on the same persons over
# time) and `protezione_extraterritoriale` (horizontal: the complainants from Bangladesh and Nepal,
# paras. 173-181). As for the Colombian case, one further probe is added,
# `art20a_giustiziabile_autovincolo` (Leitsatz 2e, paras. 205-207, 213): it is the axis on which
# the case is cited by courts that must decide whether a constitutional climate objective is
# justiciable, and it contains the rule «the legislature is bound by its own concretisation», the
# mirror image of Urgenda's excluded `target_autoimposto`.
#
# AXIS NOT PROMOTED, with authorship expressly attributed to others: «the State cannot evade its
# responsibility by pointing to the emissions of other States» (Leitsatz 2c, para. 202). The Court
# says so expressly citing VG Berlin, BVerwG, Thomson (New Zealand), Hof Den Haag para. 64, Hoge
# Raad para. 5.7.7 and the Ninth Circuit: it is Urgenda's `propria_quota`, taken up with
# attribution. The passage (EN p. 60) belongs in the Urgenda file as a verbatim PROVENANCE
# exclusion for that probe, not here. Second axis not promoted: Leitsatz 5 (emission quantities
# are set by the parliamentary legislature, not by the executive through regulations;
# Wesentlichkeitstheorie). Third: the duty of «timely orientation and planning certainty» for the
# transition (paras. 248-250).

