  motivazione_selezione: >
    Proposta, non ancora approvata: prima corte costituzionale che fonda
    l'incostituzionalita' di una legge climatica non sull'insufficienza presente della protezione
    ma sull'effetto anticipato di interferenza (eingriffsähnliche Vorwirkung) che le quantita' di
    emissione ammesse oggi hanno sulla liberta' futura; rende disponibili la costruzione dei diritti
    fondamentali come garanzia intertemporale di liberta', la proporzionalita' fra generazioni nel
    consumo del budget, la giustiziabilita' di un obiettivo climatico costituzionale e il vincolo
    del legislatore alla propria concretizzazione del target.
  famiglia_giuridica: civil law, costituzionalismo tedesco (Grundgesetz)
  data_prima_pronuncia: 2021-03-24
  data_ultima_pronuncia: 2021-03-24
