# CASO CITATO — CORTE INTERNAZIONALE DI GIUSTIZIA, PARERE CONSULTIVO SUL CLIMA, query specification v1 (PROPOSTA)
#
# Obligations of States in respect of Climate Change / Obligations des Etats en matiere de changement climatique,
# parere consultivo del 23 luglio 2025, General List No. 187, reso su richiesta dell'Assemblea generale
# (risoluzione 77/276 del 29 marzo 2023). Unanime in ogni punto del dispositivo (§ 457).
#
# STATO. Proposta del 01/10/2026 per il PI nella cartella
# cited-cases/proposte-2026-10-01/cig-parere-clima/. Non sostituisce `cited-cases/icj-clima-2025.yaml` (19/09/2026,
# solo forme): lo assorbe. Nessuna sonda e' approvata. Riassunto per il PI: PROPOSTA.md.
#
# FONTE. Un solo documento del corpus, request-for-an-advisory-opinion-on-the-obligations-of-states-with-respect-to-climate-change-decision_af16,
# 140 pagine. E' il testo INGLESE
# dell'edizione della Corte: solo la copertina porta anche il titolo francese. Il testo francese, che fa fede
# (§ 457: «the French text being authoritative»), non e' nel corpus [non verificato nel corpus]. I canonical sono
# quindi dall'inglese, come i seed di Neubauer dalla traduzione ufficiale. Testo nativo, niente OCR.
# Pagina = marcatore `<!-- page N -->` del markdown = pagina del PDF; la pagina stampata della Corte e' N - 7.
#
# COME SONO NATE LE SONDE. Lettura integrale dei §§ 94-457 e dei §§ 1-93 per sommario; prima versione di sette sonde
# proposta. SECONDA VERSIONE (01/10/2026): sette sonde indicate dal PI, solo principi DISTINTIVI, propri di
# questo parere, ciascuna con `elemento_proprio`; intervalli verificati sul testo e resi disgiunti.
# Fatti, procedura, scienza, ambito delle domande, tesi dei partecipanti e principi generici (cooperazione, diritti
# umani e ambiente, adattamento) non hanno sonda. Conteggio delle citazioni: conta_paragrafi.py, stessa cartella.
#
# LINGUA DELLE SONDE. Inglese, come i passi che chi cita riecheggia. Il numero 1,5 gradi resta nella sola sonda
# `obiettivo_1_5`: li' e' l'elemento proprio del parere, non un fatto del giudizio.

