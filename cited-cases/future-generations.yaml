forme_escluse:
  - forma: Future Generations
    ragione: Locuzione comune del lessico climatico e dei diritti umani. Da sola produce migliaia di falsi positivi.
  - forma: generaciones futuras
    ragione: Idem in spagnolo; e' l'espressione che la Corte stessa usa come concetto, non come nome.
  - forma: Generaciones Futuras
    ragione: Idem con maiuscole.
  - forma: Minambiente
    ragione: Convenuto in ogni causa ambientale colombiana.
  - forma: Ministry of the Environment
    ragione: Ministero dell'ambiente di qualunque Stato.
  - forma: Amazonía
    ragione: Toponimo; anche nei documenti brasiliani.
  - forma: Amazon
    ragione: Toponimo; anche l'impresa.
  - forma: STC
    ragione: Sigla di ogni sentenza di tutela della Sala Civil della Corte Suprema colombiana.
  - forma: Tolosa Villabona
    ragione: Ponente di decine di STC. Resta in composizione con il numero.
  - forma: Dejusticia
    ragione: Organizzazione ricorrente e traduttrice, parte di molti altri procedimenti.
  - forma: Atrato
    ragione: >
      PROCEDIMENTO DIVERSO (T-622/2016, Corte Constitucional): e' il precedente che questa sentenza
      dichiara di seguire; chi cita l'Atrato cita l'Atrato.
  - forma: T-622 de 2016
    ragione: Idem.
  - forma: PIVAC
    ragione_nota: >
      NON esclusa ma segnalata: sigla del rimedio ordinato; puo' comparire in atti di esecuzione
      che non citano la sentenza per nome. Da valutare dopo la prima esecuzione.
  - forma: Hansen
    ragione: Amicus, non parte; nome ricorrente in tutto il contenzioso climatico statunitense.

falso_positivo_dichiarato:
  tipo: riassunti Sabin nell'indice
  nota: >
    Il `riassunto_caso` di altri casi puo' nominare questo ("as Colombia's Supreme Court did"):
    se `build_chunks.py` indicizza il front matter, ogni documento di quel caso produce una
    menzione redazionale. Da verificare con Giuseppe. La table of authorities pesa poco qui:
    il caso e' poco citato in memorie di common law.

# ── Probes (semantic queries) ───────────────────────────────────────────────────────────────
# ONE ARTICULATED PROPOSITION PER PROBE (25-35 words), CARRYING THE JUDGMENT'S OWN ELEMENT. None
# contains the case name, the figures of the judgment (1.6°, 2.14°, 2041, 2071, 44%) or the Amazon
# as a place name. All canonical passages are from the Corte Suprema, full Spanish text; where the
# Court's wording is a QUOTATION (T-622, T-411, C-431, C-389, Peces-Barba, Rodríguez Palop,
# Kormody), it is not canonical: it is a verbatim PROVENANCE exclusion, below.

semantic_queries:

  - id: future-generations.conexidad_diritti
    titolo: "Conexidad: i diritti fondamentali sono determinati dall'ecosistema; senza ambiente sano non sopravvivono i sujetos de derecho né famiglia, società e Stato"
    testo: |
      Fundamental rights to life, health, subsistence and dignity are substantially
      determined by the ecosystem; without a healthy environment neither subjects of law nor
      sentient beings can survive, nor can family, society or the State exist.
    probe_es: |
      Los derechos fundamentales a la vida, la salud y la dignidad están determinados por el
      ecosistema; sin ambiente sano no sobreviven los sujetos de derecho ni los seres
      sintientes, ni subsisten familia ni Estado.
    probe_alternativa: |
      Because the guarantees of life, health and human dignity depend on a healthy
      environment, the progressive deterioration of the environment is itself a grave attack
      on those fundamental rights.
    elemento_proprio: >
      Non "l'ambiente sano e' un diritto" (art. 79 C.P., ogni costituzione ecologica) ma: i diritti
      sono DETERMINATI dall'ecosistema; i «seres sintientes» accanto ai «sujetos de derecho»; la
      sopravvivenza di famiglia, societa' e Stato. Riscritta nella v2 perche' la v1 reggeva
      identica senza il caso.
    canonical: |
      En virtud de lo discurrido, puede predicarse, los derechos fundamentales de la vida,
      salud, el mínimo vital, la libertad y la dignidad humana están ligados sustancialmente
      y determinados por el entorno y el ecosistema. Sin ambiente sano los sujetos de
      derecho y los seres sintientes en general no podremos sobrevivir, ni mucho menos
      resguardar esos derechos, para nuestros hijos ni para las generaciones venideras.
      Tampoco podrá garantizarse la existencia de la familia, de la sociedad o del propio
      Estado.
    canonical_pagina: 13
    canonical_paragrafo: 2. CONSIDERACIONES, 2 (p. 13)
    canonical_documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
    canonical_grado: Corte Suprema de Justicia, Sala de Casación Civil, 5 aprile 2018
    nota_verbatim:
      corpus_legge: >
        Il corpus legge: «el minimo vital» letto «el mínimo vital».
    seeds:
      - testo: >
          By virtue of what has been said, it can be preached, that the fundamental rights
          of life, health, the minimum subsistence, freedom, and human dignity are
          substantially linked and determined by the environment and the ecosystem. Without
          a healthy environment, subjects of law and sentient beings in general will not be
          able to survive, much less protect those rights, for our children or for future
          generations. Neither can the existence of the family, society or the state itself
          be guaranteed.
        documento: future-generations-v-ministry-of-the-environment-and-others-decision_7592
        pagina: 3
        paragrafo: estratti Dejusticia, "(p. 13)"
        avvertenza: >
          Traduzione degli estratti: e' la formulazione inglese che circola.
      - testo: >
          El deterioro creciente del medio ambiente es atentado grave para la vida actual y
          venidera y de todos los otros derechos fundamentales; además, agota paulatinamente
          la vida y todos los derechos conexos con ella. La imposibilidad de ejercer los
          derechos fundamentales al agua, a respirar aire puro y disfrutar un ambiente sano
          enferma diariamente a los sujetos de derecho vivientes, aumenta la carencia de
          agua dulce y disminuye las expectativas de vida digna.
        documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
        pagina: 13-14
        paragrafo: 2 (pp. 13-14)
        nota_verbatim:
          salto_pagina: >
            Passo a cavallo di due pagine: nel corpus, fra le due parti, l'estrazione
            inserisce il testo delle note a piè di pagina, il numero di pagina e
            l'intestazione «Radicación n.° 11001-22-03-000-2018-00319-01». Qui rimossi.
        avvertenza: >
          Segue il canonical; fonte della probe_alternativa.
      - testo: >
          en el presente decurso es procedente esta acción residual y excepcional para
          proteger las garantías iusfundamentales, individuales y colectivas, amenazadas,
          debido a la conexidad del medio ambiente sano con prerrogativas supralegales como
          la vida, la salud o la dignidad humana.
        documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
        pagina: 30
        paragrafo: 9 (p. 30)
        nota_verbatim:
          omissione: >
            Omessa la reggente «Por lo discurrido, se insiste,».
          corpus_legge: >
            Il corpus legge: «garantías tusfundamentales» letto «garantías
            iusfundamentales».
      - testo: >
          El Estado Constitucional se caracteriza porque persigue el respeto por el otro
          como límite a los preceptos supralegales, bajo el supuesto que todos los actos que
          impactan negativamente la naturaleza, implican indiscutiblemente menoscabo de los
          derechos fundamentales personales, así como del propio entorno.
        documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
        pagina: 17
        paragrafo: 5.1 (p. 17)
        nota_verbatim:
          corpus_legge: >
            Il corpus legge: «personales!!,» letto «personales,»; «asi como» letto «así
            como».
    lexical_markers:
      contati_sul_corpus: false
      en: [sentient beings, subjects of law, determined by the ecosystem, healthy environment]
      es: [seres sintientes, sujetos de derecho, determinados por el entorno, conexidad, ambiente sano, mínimo vital]
      falsi_amici:
        - marcatore: connection
          ragione: traduce «conexidad» ma e' parola comune inglese; pesca qualunque cosa
        - marcatore: tutela
          ragione: in italiano e' "protezione" generica; in inglese "tutela" e' guardianship; pesca fuori dal diritto colombiano

  - id: future-generations.generazioni_future_obbligo
    titolo: "I diritti ambientali delle generazioni future come obbligo di non-fare che limita la libertà delle presenti"
    testo: |
      The environmental rights of future generations, grounded in the solidarity of the
      species and the intrinsic value of nature, create a binding obligation of non-action
      that limits the freedom of action of present generations.
    probe_es: |
      Los derechos ambientales de las generaciones futuras constituyen una relación jurídica
      obligatoria de no hacer que limita la libertad de acción de las generaciones presentes
      y les impone nuevas cargas de cuidado.
    probe_alternativa: |
      Solidarity with nature and with those not yet born obliges the present generation to
      protect the environment and to assume the care and custody of natural goods for the
      benefit of future generations.
    elemento_proprio: >
      La «relación jurídica obligatoria» come «prestación de no-hacer» con effetto di
      «limitación de la libertad de acción de las generaciones presentes», fondata su
      solidarieta' della specie e valore intrinseco. Non e' Brundtland (principio di politica),
      non e' T-411 (patrimonio da consegnare), non e' Neubauer (liberta' intertemporale dei
      viventi).
    canonical: |
      Lo planteado entonces, formula una relación jurídica obligatoria de los derechos
      ambientales de las generaciones futuras, como la prestación de “no-hacer”, cuyo efecto
      se traduce en una limitación de la libertad de acción de las generaciones presentes,
      al tiempo que esta exigencia implícitamente les atribuye nuevas cargas de compromiso
      ambiental, a tal punto que asuman una actitud de cuidado y custodia de los bienes
      naturales y del mundo humano futuro”.
    canonical_pagina: 21
    canonical_paragrafo: 5.3 (p. 21)
    canonical_documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
    canonical_grado: Corte Suprema de Justicia, Sala de Casación Civil, 5 aprile 2018
    nota_verbatim:
      corpus_legge: >
        Il corpus legge: «relación juridica» letto «relación jurídica»; «futuro”4.» letto
        «futuro”.».
    nota_fonte: >
      Il periodo chiude con virgolette perche' la Corte incorpora le ultime parole da Kormody
      (nota 24): la relazione giuridica obbligatoria e la prestazione di non-fare sono
      formulazione della Corte; «cuidado y custodia de los bienes naturales y del mundo humano
      futuro» e' citazione.
    seeds:
      - testo: >
          Los derechos ambientales de las futuras generaciones se cimentan en el (i) deber
          ético de la solidaridad de la especie y (ii) en el valor intrínseco de la
          naturaleza.
        documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
        pagina: 19
        paragrafo: 5.3 (p. 19)
        nota_verbatim:
          corpus_legge: >
            Il corpus legge: «(ij deber» letto «(i) deber»; «especie!5 y» letto «especie y»;
            «naturaleza!6.» letto «naturaleza.».
      - testo: >
          Así las cosas, la fundamentación de la obligación de solidaridad humana con la
          naturaleza constituye el contenido esencial de “los verdaderos valores que
          diariamente le facilitan la vida”, tanto en su dimensión presente como futura.
        documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
        pagina: 20
        paragrafo: 5.3 (p. 20)
        nota_verbatim:
          corpus_legge: >
            Il corpus legge: «vida”18, tanto» letto «vida”, tanto».
        avvertenza: >
          La citazione interna e' di Jaquenod de Zsögön (nota 18).
      - testo: >
          El fundamento de la obligación de solidaridad directa con la naturaleza se edifica
          en un valor, en sí mismo, de ésta, por afinidad con el sujeto cognoscente u
          “objeto” externo por el que se define, por cuanto el ser humano “forma parte de la
          naturaleza “siendo”, a su vez, naturaleza”.
        documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
        pagina: 21
        paragrafo: 5.3 (p. 21)
        nota_verbatim:
          corpus_legge: >
            Il corpus legge: «naturaleza”?2,» letto «naturaleza”.»; «en si mismo» letto «en
            sí mismo».
        avvertenza: >
          La citazione finale e' di Jaquenod de Zsögön (nota 22).
      - testo: >
          5.3 The environmental rights of future generations are based on the (i) ethical
          duty of the solidarity of the species and (ii) on the intrinsic value of nature.
        documento: future-generations-v-ministry-of-the-environment-and-others-decision_7592
        pagina: 4
        paragrafo: estratti Dejusticia, "(...) 5.3"
      - testo: >
          What has been stated then, develops a binding legal relationship regarding the
          environmental rights of future generations, such as an “om​ission,” whose impact
          translates into a limitation to the freedom of action of present generations,
          while simultaneously implicitly demanding new burdens of environmental
          commitments, to the extent that they take on the care and stewardship of natural
          resources and the future world.
        documento: future-generations-v-ministry-of-the-environment-and-others-decision_7592
        pagina: 5
        paragrafo: estratti Dejusticia, "p. 21"
        avvertenza: >
          Traduzione del canonical. Il corpus contiene un carattere invisibile (U+200B)
          dentro «omission»; conservato perche' il seed e' verbatim.
      - testo: >
          la construcción de un “pacto intergeneracional por la vida del amazonas colombiano
          -PIVAC”, en donde se adopten medidas encaminadas a reducir a cero la deforestación
          y las emisiones de gases efecto invernadero, el cual deberá contar con estrategias
          de ejecución nacional, regional y local, de tipo preventivo, obligatorio,
          correctivo, y pedagógico, dirigidas a la adaptación del cambio climático.
        documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
        pagina: 46
        paragrafo: 14 (p. 46)
        nota_verbatim:
          omissione: >
            Omessa la reggente «Asi mismo, se ordenará a la Presidencia de la República
            [...] formular en un plazo de cinco (5) meses [...]».
        avvertenza: >
          RIMEDIO: il patto intergenerazionale e' la traduzione operativa della
          proposizione.
    lexical_markers:
      contati_sul_corpus: false
      en: [binding legal relationship, obligation of non-action, freedom of action of present generations, solidarity of the species, intergenerational pact]
      es: [relación jurídica obligatoria, prestación de no-hacer, libertad de acción, solidaridad de la especie, valor intrínseco, pacto intergeneracional]
      falsi_amici:
