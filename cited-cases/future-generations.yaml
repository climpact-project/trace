  data_ultima_pronuncia: 2018-04-05     # Corte Suprema de Justicia, STC4360-2018; sent to the Corte Constitucional for possible review (outcome not in the case file)
  esito: accolto
  caso_perso: false
  caso_di_controllo: false
  documenti_corpus_successivi_alla_decisione: null   # denominator, to be computed by the pipeline
  percorsi_di_lettura: >
