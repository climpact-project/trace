  motivazione_selezione: >
    Da approvare prima di ogni conteggio (guida §2). Proposta, non ancora approvata:
    prima decisione di una corte suprema latinoamericana che accoglie un ricorso climatico di
    giovani su base di diritti fondamentali, che tratta i ricorrenti come generazione futura gia'
    lesa, e che estende a un intero bioma il riconoscimento di soggettivita' giuridica gia' dato
    a un fiume; rende disponibili la conexidad ambiente-diritti applicata al clima, i diritti
    delle generazioni future come limite giuridico alle presenti, e la natura soggetto di diritti
    come rimedio.
  famiglia_giuridica: civil law, costituzionalismo latinoamericano (Colombia)
