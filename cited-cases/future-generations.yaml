# CITED CASE: FUTURE GENERATIONS (Generaciones Futuras v. Minambiente), query specification v2
#
# VERSION 2: revision of v1 following the Urgenda register (732 judged rows, the first real
# measurement of the probes). What changes, and why:
#
# 1. THE PROBE CARRIES THE LINE OF REASONING, NOT THE CONCLUSION (register, "How to reset the
#    probes", 1; false positives that say the same thing as Urgenda but take it from Paris, from
#    CBDR, from a constitution). Test applied to every probe: "would it stand unchanged if the case
#    had never existed?", the criterion that separated 56% from 21% in the Urgenda measurement.
#    Three v1 probes failed it and are rewritten: `conexidad_diritti` (now carries «seres
#    sintientes» and the survival of family, society and State), `deforestazione_clima_diritti`
#    (now carries deforestation as a climate source and the State's co-responsibility through
#    solidarity), `ecocentrico_antropico` (now carries the coinage «ecocéntrico-antrópico», «a la
#    par», the «derechos-deberes»). The other four already passed.
# 2. EXCLUSIONS OF POLARITY AND PROVENANCE, NOT OF SAME TOPIC (register, 4: same topic 27.4% vs
#    none 32.7%, does not discriminate; polarity 13.2%, discriminates). The v1 same-topic
#    exclusions are removed. Each probe now has one POLARITY exclusion (who says the opposite) and
#    three to five PROVENANCE exclusions (who says the same thing taking it from another source:
#    constitution, Corte Constitucional, Stockholm, Paris, scholarship, another case). Field `tipo`.
# 3. REAL TEXT BEATS WRITTEN TEXT (register, 6: real passages 0.681, sentences written by an LLM
#    0.630). Where the source is in the case file, the exclusion is VERBATIM from the corpus, with
#    document and page: the Court quotes its own sources at length (T-411/1992, C-431/2000,
#    C-449/2015, art. 79 C.P., Stockholm, Paris, T-622/2016, T-362/2014, STC 7630/2016,
#    Peces-Barba, Rodríguez Palop), and the first-instance court states the procedural polarity.
#    Field `origine: verbatim`. Where the source is not in the case file (Rio, UNFCCC, OC-23/17,
#    Ecuador, Neubauer, Juliana, Urgenda), the exclusion is drafted, `origine: redazionale`, TO BE
#    REPLACED with real passages rejected by the validators after the first run.
# 4. ONE FORMULATION BY DEFAULT (register, 2: a second formulation widens results by 64-80% and on
#    three probes out of five adds noise). `testo` is run. `probe_alternativa` and `probe_es` stay
#    in the file as TRIALS: run once, measured alone on the judged sample, kept only if they
#    perform at least as well as `testo`. See `politica_formulazioni`.
# 5. MARKERS ONLY IN THE CORPUS LANGUAGES, SHORT, TO BE COUNTED (register, 7: 44 of Urgenda's 101
#    markers never occur in the corpus). it/pt/fr removed; en/es remain, 1-3 words;
#    `contati_sul_corpus: false` until counted; `falsi_amici` with the reason (lesson of "tort",
#    6% precision).
# 6. SENTENCES OF THE JUDGMENT ARE A SEPARATE SEARCH (register, 8: 403 rows never seen by the
#    probes). `canonical` and `seeds` are run as standalone queries, never pasted into the probe.
#    See `frasi_della_sentenza`.
# Retained from v1 unchanged: pipeline reader (keys `nome`, `data_decisione`, `forme`,
# `semantic_queries` with `titolo` and `testo` BEFORE `seeds`, `formulazioni_escluse` with `per`);
# canonical passages from the full Spanish text with `corpus_legge` and `salto_pagina` declared;
# threshold date 12 February 2018; `probe_es`.
#
# EXCLUSION OF THE CITED CASE'S OWN DOCUMENTS (register, 10 and "Errors": in the 2,000-candidate
# search, 46 of the top 400 were documents of Urgenda itself). `escludi_case_id` must also be
# applied to the broadened search and to the sentence search: searching with the judge's words
# finds the judge first, and here the words also appear in the complaint (122 pp.) and in the
# impugnación.

