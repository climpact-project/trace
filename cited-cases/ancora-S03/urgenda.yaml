  Prima delle tre pronunce (Rechtbank Den Haag, 24 giugno 2015). Decisione del PI del 30 luglio
  2026: chi cita Urgenda la cita a prescindere dal grado, quindi la soglia segue il giudizio e
  non la proposizione. Conseguenza da tenere presente in lettura: quattro canonical su cinque
  vengono dalla Cassazione (20 dicembre 2019) e uno dal primo grado; fra il 24 giugno 2015 e il
  20 dicembre 2019 la rete semantica restituira' candidati che non possono riprendere le
  formulazioni della Cassazione ma possono riprendere il primo grado o la Corte d'appello, che
  le enunciano in altra forma (vedi i seed di ciascuna sonda). I candidati anteriori al 24
  giugno 2015 non si buttano: sono l'argomento CONTRO la derivazione e si rileggono con
  `--con-anteriori`.

