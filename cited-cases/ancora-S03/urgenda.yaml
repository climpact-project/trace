    ragione: Ogni fondazione olandese. Da sola produce omonimia certa.
  - forma: State of the Netherlands
    ragione: Convenuto in OGNI causa olandese contro lo Stato (Milieudefensie, Klimaatzaak, Greenpeace NL). Nome dello Stato, non del caso.
  - forma: Dutch State
    ragione: Idem.
  - forma: Klimaatzaak
    ragione: >
      PROCEDIMENTO DIVERSO. Da sola e' il nome del caso BELGA (VZW Klimaatzaak v. Kingdom of
      Belgium), presente nel corpus con i propri documenti. Nel fascicolo Urgenda compare solo
      nel composto "Klimaatzaak Urgenda", che resta fra le forme.
  - forma: the Dutch climate case
    ragione: >
      Denominazione giornalistica. Copre anche Milieudefensie et al. v. Royal Dutch Shell
      ("the Dutch Shell case", spesso presentato come "Urgenda 2.0") e il contenzioso olandese
      successivo. Non usata nelle citazioni formali.
  - forma: the Hague climate case
    ragione: Idem; l'Aja e' sede anche del giudizio Shell.
  - forma: Milieudefensie
    ragione: Parte di un procedimento diverso (Shell), citato spesso ACCANTO a Urgenda ma non e' Urgenda.
  - forma: Urgenda 2.0
    ragione: Soprannome del giudizio Shell, non di questo.
  - forma: HAZA C/09/00456689
    ragione_nota: >
      NON esclusa: e' compresa in "[2015] HAZA C/09/00456689" fra gli `identifiers`. Segnalata
      perche' e' la forma del metadato Sabin, non della sentenza (che scrive "C/09/456689 / HA
      ZA 13-1396"); improbabile nei testi, tenuta per completezza.
  - forma: Urgenda
    ragione_nota: >
      NON esclusa. Resta forma breve principale, ma e' anche il nome dell'organizzazione: un
      documento puo' nominare la fondazione (le sue campagne, i suoi rapporti sulla transizione) senza
      citare il giudizio. Nel corpus contenzioso il caso e' quasi sempre il giudizio; le
      occorrenze vanno comunque riviste a mano alla prima esecuzione, come per "Juliana".

