# CASO CITATO — URGENDA (query specification, versione 2)
#
# Che cosa cercare. Il codebook (`codebook/citazioni.yaml`) dice invece COME classificare
# cio' che si trova. Qui si dice solo CHE COSA cercare. Nessuna classificazione e nessun
# `tipo_citazione` e' assegnato in questo file: il codebook e' `0.2-pilot`, `approvato_da: null`.
#
# STORIA DEL FILE. Versione 1 = pilota (luglio 2026): cinque sonde con `testo` ricavato dalla
# sentenza di Cassazione (due dal suo riassunto iniziale, una verbatim dal par. 8.2.6, due
# parafrasate), dieci formulazioni escluse senza ragione scritta,
# quattordici forme senza esclusioni. Questa versione 2 (2 settembre 2026) conserva le CINQUE
# PROPOSIZIONI del pilota e le riscrive secondo TRACE-RIFERIMENTO-COMPLETO.md (25/08/2026) e
# secondo il formato dei tre file del 28 agosto (`leghari.yaml`, `greenpeace-nordic.yaml`,
# `juliana.yaml`): canonical verbatim con documento e pagina, seeds, probe 25-35 parole,
# probe_alternativa, lexical_markers, esclusioni con ragione (minimo tre, una di polarita'),
# forme lessicali con esclusioni motivate, scheda del caso ancora (guida §2).
#
# COMPATIBILITA' CON LA PIPELINE (guida §15.1). `leggi_caso()` in `tools/cerca.py` non e' un
# parser YAML completo: toglie i commenti e legge `nome`, `codebook_versione`, `data_decisione`,
# `escludi_case_id`, `forme`, `semantic_queries` come {id, titolo, testo}, `formulazioni_escluse`
# con `per`. Il portale (`sondeDelCaso`) estrae i `titolo:` dentro il blocco `semantic_queries:`.
# Questo file CONSERVA quelle chiavi con quel significato, e aggiunge accanto i campi documentali:
#   pipeline            | qui                                   | nei tre file del 28 agosto
#   nome                | nome                                  | official_name
#   data_decisione      | data_decisione (+ data_soglia_motivazione) | data_soglia
#   forme (lista piatta)| forme (lista piatta, categorie nei commenti) + forme_escluse | lexical_variants.* + EXCLUSIONS
#   titolo              | titolo                                | etichetta
#   testo (la sonda)    | testo  — messo PRIMA di seeds, perche' anche i seed hanno un campo `testo` | probe
#   formulazioni_escluse| formulazioni_escluse (blocco unico, con `per`, + `ragione`) | exclusions annidate per sonda
# Se i tre file vengono allineati a queste chiavi, la pipeline li legge senza modifiche al
# lettore. Se invece il PI preferisce lo schema annidato, va modificato `leggi_caso()`. Decisione
# al PI: NOTE-PER-PI-URGENDA.md, domanda 1.
#
# DECISIONE DEL PI (30 luglio 2026): il grado di giudizio NON si distingue. Chi cita Urgenda cita
# Urgenda, che si riferisca al Tribunale dell'Aja (2015), alla Corte d'appello (2018) o alla
# Cassazione (2019). La regola vale per il lato CITANTE. Per il lato CITATO, ogni canonical porta
# il documento e il grado da cui viene, perche' le cinque proposizioni non sono enunciate dai tre
# giudici nello stesso modo, e una (il dovere di diligenza civilistico) solo dal primo grado.
#
# CONVENZIONE REDAZIONALE SUI VERBATIM. `canonical` e `seeds.testo` sono estratti
# programmaticamente dai markdown del corpus e verificati token per token. Ogni scostamento e'
# dichiarato in `nota_verbatim` con tre categorie: `omissione` (citazione interna, inciso o
# proposizione reggente omessi), `corpus_legge` (corruzione OCR corretta: qui nessuna, i tre
# documenti fonte sono PDF con testo nativo), `salto_pagina` (NUOVA, proposta: intestazione di
# stampa e numeri di paragrafo a margine che l'estrazione inserisce dentro un passaggio a cavallo
# di due pagine; usata una sola volta, su un seed). I riferimenti interni della corte
# ("see above in para. 5.2.2") NON sono omessi: fanno parte del testo.
#
# LINGUA. Sonde in inglese: le tre pronunce sono lette all'estero nella traduzione inglese
# pubblicata su rechtspraak.nl, ed e' quel lessico che chi le riprende riecheggia (regola 5.5).
# Le sonde sono scritte come passaggi di sentenza, dichiarativi, non come domande: il manifesto
# dell'indice porta `prefisso_domanda: "passage: "` (guida §13.2), quindi la sonda viene
# incorporata come se fosse un passaggio.

