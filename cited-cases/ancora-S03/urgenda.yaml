    ragione: >
      Token a distanza di edit 2 da "Urgenda", 67 occorrenze nella scansione del sotto-corpus
      (NOTE-PER-PI 28/08, § 2.3). Non e' una variante ma una parola inglese. La ricerca esatta
      non la pesca comunque; la ragione va scritta perche' e' cio' che rende difendibile la
      lista (guida §15.1).
  - forma: urgent
    ragione: Idem, 66 occorrenze.
  - forma: agenda
    ragione: Idem, 33 occorrenze. Da non confondere con l'etimo dichiarato dal Hof ("Urgenda ('Urgent Agenda')", p. 2).
  - forma: Uganda
    ragione: Idem, 5 occorrenze. Nome di Stato.
  - forma: Brenda
    ragione: Idem, 7 occorrenze. Nome proprio.
