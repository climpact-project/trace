forme_escluse:
  - forma: Seniorinnen
    ragione: >
      Parola tedesca comune («Seniorinnen und Senioren»); da sola non identifica il caso.
  - forma: VKS
    ragione: >
      Sigla dell'associazione, OSSERVATA una volta («VKS, a non-profit association», R (Friends of the Earth e
      altri), Regno Unito), ma di tre lettere: sotto la soglia di quattro caratteri e sigla di altro.
  - forma: Verein case
    ragione: >
      OSSERVATA una volta (in una richiesta di parere consultivo, «the Verein case»), ma «Verein» e' la parola tedesca per
      associazione: produrrebbe omonimie in ogni documento tedesco.
  - forma: Swiss women
    ragione: >
      Generica («the individual Swiss women were not», Aurora, Anton Foley e altri c. Svezia); non e' un nome.
  - forma: Swiss climate case
    ragione: >
      Denominazione giornalistica che copre anche il giudizio svizzero interno e Uniterre c. DATEC (il «caso dei
      contadini svizzeri»). Nessuna occorrenza oggi.
  - forma: Climate Seniors
    ragione: >
      OSSERVATA solo negli atti del giudizio svizzero (esclusi); generica, puo' indicare altri gruppi di anziani
      (per es. Senior Citizens c. Corea, nel corpus).
  - forma: A-2992/2017
    ragione: >
      Numero di ruolo della sentenza del Tribunale amministrativo federale del 27/11/2018. Cita il giudizio
      svizzero, non Strasburgo.
  - forma: 1C_37/2019
    ragione: >
      Numero di ruolo della sentenza del Tribunale federale del 5/5/2020 (BGE 146 I 145). Idem.
  - forma: BGE 146 I 145
    ragione: Raccolta ufficiale della sentenza del Tribunale federale. Idem.
  - forma: "5360020"
    ragione: >
      Coda numerica dell'ECLI senza il prefisso, con rischio di cifre casuali in tabelle e indirizzi. Coperta da
      «0409JUD005360020».
  - forma: Duarte Agostinho
    ragione: >
      Altro ricorso deciso dalla stessa Grande Camera lo stesso giorno (irricevibile). Citato quasi sempre accanto a
      KlimaSeniorinnen, ma e' un altro caso; idem Carême c. Francia.
  - forma: 9 April 2024
    ragione: >
      Data di tre pronunce della Grande Camera (KlimaSeniorinnen, Duarte Agostinho, Carême), quindi non identifica.
  - forma: Switzerland
    ragione: Ovvio; resta solo nelle forme composte.
  - forma: Senior Women for Climate Protection
    ragione_nota: >
      NON esclusa ma segnalata. E' il nome inglese dell'associazione ed e' anche la testa del nome del giudizio
      svizzero («Union of Swiss Senior Women for Climate Protection v. Federal Department of the Environment,
      Transport, Energy and Communications (DETEC) and Others», OSSERVATO in Duarte Agostinho, nota 83). Seguita da
      «v. Federal Department», «v. DETEC», «v. Swiss Federal Council» o «v. Swiss Federal Parliament» indica il
      giudizio svizzero e non la sentenza di Strasburgo: da rivedere a mano.
  - forma: KlimaSeniorinnen
    ragione_nota: >
      NON esclusa. E' anche il nome dell'associazione (il suo sito klimaseniorinnen.ch, le sue campagne) e del
      giudizio svizzero: prima del 9/4/2024 un documento che la nomina parla del ricorso o delle sentenze svizzere.
      Le occorrenze dentro un indirizzo web non contano (regola `e_nome` della pipeline).
  - forma: KlimaSen- iorinnen
    ragione_nota: >
      Sillabazione di fine riga OSSERVATA solo negli atti svizzeri esclusi. La pipeline confronta le forme latine in
      modo esatto: un nome spezzato dall'a capo non si trova. Segnalata, non aggiunta.

falso_positivo_dichiarato:
  tipo: citazione in catena
  nota: >
    Nelle memorie europee dopo il 2024 il caso e' citato in elenco («Urgenda; Neubauer; KlimaSeniorinnen») e accanto
    a Duarte Agostinho e Carême, decisi lo stesso giorno: si attende molta `menzione_in_catena`.

# ── Sonde (semantic queries) ────────────────────────────────────────────────────────────────
# Nessuna contiene il nome del caso, la Svizzera, le cifre del giudizio (20%, 2020, 2024, 2030, 2050, 0,44 Gt) o
# l'eta' delle ricorrenti. Ogni sonda porta l'elemento proprio della sentenza. Lessico separato: «do its part» (§ 545)
# non sta in nessuna sonda perche' e' troppo vicino a «own share» (§ 442); «future generations» sta solo nei
# requisiti (§ 549); «representational disadvantage» in nessuna; «budget» solo nei requisiti; «actio popularis» solo
# nella qualita' di vittima.
semantic_queries:
- id: klimaseniorinnen.vittima_soglia_alta
  titolo: Qualita' di vittima dei singoli nel contenzioso climatico, esposizione di alta intensita' e bisogno pressante
    di protezione individuale, con una soglia particolarmente alta
  testo: 'In climate-change complaints an individual can claim to be a victim only if personally and directly affected:
    he or she must be subject to a high intensity of exposure to the adverse effects of climate change and there
    must be a pressing need to ensure his or her individual protection, owing to the absence or inadequacy of reasonable
    measures to reduce harm. The threshold is especially high, so that complaints do not slip into an actio popularis.

    '
  paragrafi: §§ 479-488, 527-535
  fonte: proposta dell'esecutore, 1/10/2026
  esclusione_di_provenienza: 'Non i principi generali sulla qualita'' di vittima (vittime dirette, indirette, potenziali,
    §§ 460-472: Aksu, Tănase, Senator Lines, ripresi dalla Corte), ne'' il criterio ambientale classico (gravita''
    minima, durata, vicinanza geografica, § 472: Tătar, Cordella): una pagina che li enuncia senza i due criteri
    climatici non riprende questa sentenza. Carême c. Francia (stesso giorno) applica i §§ 487-488: chi cita Carême
    per i due criteri riprende questa sentenza in forma annidata.

    '
  canonical: 'Two key criteria have been set out for recognising the victim status of natural persons in the climate-change
    context: (a) high intensity of exposure of the applicant to the adverse effects of climate change; and (b) a
    pressing need to ensure the applicant’s individual protection (see paragraphs 487-488 above). The threshold
    for fulfilling these criteria is especially high (see paragraph 488 above).

    '
  canonical_paragrafo: § 527
  canonical_pagina: 199
  canonical_documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
  nota_canonical: 'Il principio e'' enunciato ai §§ 487-488 (pp. 188-189), che attraversano un salto di pagina;
    il § 527 lo ripete per intero in una pagina sola ed e'' preferito per la ricerca per frasi.

    '
- id: klimaseniorinnen.legittimazione_associazioni
  titolo: Legittimazione delle associazioni ad agire per conto dei membri, a tre condizioni e senza che i rappresentati
    debbano qualificarsi uno per uno
  testo: 'An association may lodge a complaint about a State''s failure to protect people against the adverse effects
    of climate change on behalf of its members and other affected individuals, if it is lawfully established, pursues
    a dedicated statutory purpose of defending their human rights against climate threats, and is genuinely qualified
    and representative to act for them. It does not have to show that the people it represents would themselves
    qualify individually.

    '
  paragrafi: §§ 489-503, 521-526
  fonte: proposta dell'esecutore, 1/10/2026
  esclusione_di_provenienza: 'Non la Convenzione di Aarhus e il diritto UE sull''accesso alla giustizia delle organizzazioni
    ambientaliste (§§ 490-494, Protect, Deutsche Umwelthilfe), che la Corte richiama ma non applica (§ 501), ne''
    la giurisprudenza Gorraiz Lizarraga e Câmpeanu sulle «special considerations» (§§ 475-477): chi riconosce la
    legittimazione di un''associazione ambientalista per quelle vie non riprende i tre requisiti del § 502.

    '
  canonical: 'In order to be recognised as having locus standi to lodge an application under Article 34 of the Convention
    on account of the alleged failure of a Contracting State to take adequate measures to protect individuals against
    the adverse effects of climate change on human lives and health, the association in question must be: (a) lawfully
    established in the jurisdiction concerned or have standing to act there; (b) able to demonstrate that it pursues
    a dedicated purpose in accordance with its statutory objectives in the defence of the human rights of its members
    or other affected individuals within the jurisdiction concerned, whether limited to or including collective
    action for the protection of those rights against the threats arising from climate change; and (c) able to demonstrate
    that it can be regarded as genuinely qualified and representative to act on behalf of members or other affected
    individuals within the jurisdiction who are subject to specific threats or adverse effects of climate change
    on their lives, health or well-being as protected under the Convention.

    '
  canonical_paragrafo: § 502
  canonical_pagina: 193
  canonical_documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
  nota_verbatim:
    omissione: 'Il § 502 si apre con «Thus, taking into account the above-noted considerations, the following factors
      will determine the standing of associations before the Court in the present context.», qui omesso, e prosegue
      dopo il canonical con i fattori di valutazione e con la frase sull''assenza di un requisito separato di qualita''
      di vittima dei rappresentati, che passa a p. 194.

      '
- id: klimaseniorinnen.art8_protezione_effettiva
  titolo: L'art. 8 comprende un diritto alla protezione effettiva dagli effetti negativi gravi del cambiamento climatico,
    che obbliga lo Stato a regolare e attuare misure di mitigazione
  testo: 'Article 8 of the Convention encompasses a right for individuals to effective protection by the State authorities
    from serious adverse effects of climate change on their life, health, well-being and quality of life, given
    the causal relationship between State action or inaction and that harm. The State''s primary duty is to adopt,
    and to effectively apply in practice, regulations and measures capable of mitigating the existing and potentially
    irreversible future effects of climate change, supplemented by adaptation measures.

    '
  paragrafi: §§ 435-436, 478, 519-520, 544-546, 552
  fonte: proposta dell'esecutore, 1/10/2026
  esclusione_di_provenienza: 'Non Urgenda (Hoge Raad 5.6.2, 5.8, 5.9.1: obblighi positivi degli artt. 2 e 8 contro
    il rischio climatico), ne'' la giurisprudenza ambientale della Corte che il § 538 riassume (Tătar, Di Sarno,
    Jugheli, Cordella): chi fonda sugli artt. 2 e 8 un dovere di protezione dal clima citando solo quelle fonti
    non riprende questa sentenza.

    '
  canonical: 'Drawing on the above considerations, and having regard to the causal relationship between State actions
    and/or omissions relating to climate change and the harm, or risk of harm, affecting individuals (see paragraphs
    435, 436 and 478 above), Article 8 must be seen as encompassing a right for individuals to effective protection
    by the State authorities from serious adverse effects of climate change on their life, health, well-being and
    quality of life.

    '
  canonical_paragrafo: § 519
  canonical_pagina: 198
  canonical_documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
  canonical_bis: 'Accordingly, the State’s obligation under Article 8 is to do its part to ensure such protection.
    In this context, the State’s primary duty is to adopt, and to effectively apply in practice, regulations and
    measures capable of mitigating the existing and potentially irreversible, future effects of climate change.

    '
  canonical_bis_paragrafo: § 545
  canonical_bis_pagina: 206
- id: klimaseniorinnen.margine_differenziato
  titolo: Margine di apprezzamento differenziato, ridotto sull'impegno e sugli obiettivi, ampio sulla scelta dei
    mezzi, con le garanzie procedurali come misura
  testo: 'The State''s margin of appreciation is reduced as regards its commitment to combating climate change and
    the setting of the requisite aims and objectives, given the nature and gravity of the threat and the general
    consensus on what is at stake, but wide as regards the choice of means, including operational choices and policies.
    Climate protection carries considerable weight in any balancing, and procedural safeguards, such as public access
    to information and the possibility for those affected to have their views taken into account, are especially
    material in assessing whether the State stayed within its margin.

    '
  paragrafi: §§ 542-543, 551, 553-554, 657
  fonte: proposta dell'esecutore, 1/10/2026
  esclusione_di_provenienza: 'Non la dottrina generale del margine di apprezzamento in materia ambientale («wide
    margin», Hatton, Hardy and Maile, § 538 (c)-(d)) e i principi procedurali Taşkın e Flamenbaum (§ 539): un margine
    ampio senza la distinzione fra obiettivi e mezzi non e'' questa sentenza.

    '
  canonical: 'Taking as a starting-point the principle that States must enjoy a certain margin of appreciation in
    this area, the above considerations entail a distinction between the scope of the margin as regards, on the
    one hand, the State’s commitment to the necessity of combating climate change and its adverse effects, and the
    setting of the requisite aims and objectives in this respect, and, on the other hand, the choice of means designed
    to achieve those objectives. As regards the former aspect, the nature and gravity of the threat and the general
    consensus as to the stakes involved in ensuring the overarching goal of effective climate protection through
    overall GHG reduction targets in accordance with the Contracting Parties’ accepted commitments to achieve carbon
    neutrality, call for a reduced margin of appreciation for the States. As regards the latter aspect, namely their
    choice of means, including operational choices and policies adopted in order to meet internationally anchored
    targets and commitments in the light of priorities and resources, the States should be accorded a wide margin
    of appreciation.

    '
  canonical_paragrafo: § 543
  canonical_pagina: 205
  canonical_documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
- id: klimaseniorinnen.requisiti_quadro_regolatorio
  titolo: Requisiti del quadro regolatorio, con tempi per la neutralita', bilancio di carbonio o quantificazione
    equivalente, obiettivi intermedi, verifica, aggiornamento e azione tempestiva e coerente
  testo: 'Effective respect for private life requires each State to reduce its emissions substantially and progressively
    towards net neutrality within, in principle, the next three decades, through a binding domestic framework that
    specifies a timeline and the overall remaining carbon budget or another equivalent quantification of future
    emissions, sets intermediate reduction targets and sectoral pathways, shows compliance and keeps the targets
    updated. The authorities must act in good time and in an appropriate and consistent manner, and immediate action
    is needed to avoid a disproportionate burden on future generations.

    '
  paragrafi: §§ 547-550, 555, 558-573
  fonte: proposta dell'esecutore, 1/10/2026
  esclusione_di_provenienza: 'Non Neubauer (BVerfG, Rn. 215-229) per il bilancio di carbonio nazionale: il § 571
    lo dichiara fonte del rigetto dell''argomento dell''impossibilita'' di determinarlo; una pagina che chiede un
    bilancio nazionale citando solo Neubauer riprende Neubauer. Non l''Accordo di Parigi, la Legge europea sul clima
    (bilanci indicativi, § 571) o l''IPCC (§ 116) per gli obiettivi e i bilanci in quanto tali.

    '
  canonical: 'When assessing whether a State has remained within its margin of appreciation (see paragraph 543 above),
    the Court will examine whether the competent domestic authorities, be it at the legislative, executive or judicial
    level, have had due regard to the need to: (a) adopt general measures specifying a target timeline for achieving
    carbon neutrality and the overall remaining carbon budget for the same time frame, or another equivalent method
    of quantification of future GHG emissions, in line with the overarching goal for national and/or global climate-change
    mitigation commitments; (b) set out intermediate GHG emissions reduction targets and pathways (by sector or
    other relevant methodologies) that are deemed capable, in principle, of meeting the overall national GHG reduction
    goals within the relevant time frames undertaken in national policies; (c) provide evidence showing whether
    they have duly complied, or are in the process of complying, with the relevant GHG reduction targets (see sub-
    paragraphs (a)-(b) above); (d) keep the relevant GHG reduction targets updated with due diligence, and based
    on the best available evidence; and (e) act in good time and in an appropriate and consistent manner when devising
    and implementing the relevant legislation and measures.

    '
  canonical_paragrafo: § 550
  canonical_pagina: 207
  canonical_documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
  nota_verbatim:
    sillabazione: '«sub- paragraphs» e'' cosi'' nel corpus (trattino di fine riga seguito da spazio); conservato
      come nel testo.

      '
- id: klimaseniorinnen.possibilita_reale
  titolo: 'Basta una possibilita'' reale di cambiare l''esito: niente «goccia nel mare» e niente prova del «se non
    fosse stato per»'
  testo: 'The drop-in-the-ocean argument does not relieve a State of responsibility: it need not be shown that,
    but for the authorities'' failings, the harm would not have occurred; it is sufficient that reasonable measures
    which they failed to take had a real prospect of altering the outcome or mitigating the harm.

    '
  elemento_proprio: 'Non «ogni Stato risponde della propria quota»: lo dicono Urgenda, Neubauer e qui il § 442.
    Proprio di KlimaSeniorinnen e'' il criterio causale di Strasburgo portato nel clima: basta la possibilita''
    reale (real prospect, O''Keeffe) che le misure mancate cambiassero l''esito o attenuassero il danno, invece
    della prova del «but for».

    '
  paragrafi: § 444
  fonte: 'PI, 01/10/2026: sonde distintive (prima «propria_quota», §§ 439, 441-444)'
  canonical: Rather, what is important, and sufficient to engage the responsibility of the State, is that reasonable
    measures which the domestic authorities failed to take could have had a real prospect of altering the outcome
    or mitigating the harm
  canonical_paragrafo: § 444
  canonical_pagina: 178
  canonical_documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
- id: klimaseniorinnen.prospettiva_intergenerazionale
  titolo: 'La prospettiva fra generazioni giustifica il controllo dei giudici: chi verra'' porta i pesi senza partecipare
    alle decisioni di oggi'
  testo: 'Future generations will bear an increasingly severe burden of present failures to combat climate change
    while having no say in today''s decisions; because short-term interests may prevail in political decision-making,
    this intergenerational perspective adds justification for judicial review of climate policy.

    '
  elemento_proprio: 'Non il controllo dei giudici in generale, ne'' la sua compatibilita'' con la democrazia (Urgenda,
    ordine al legislatore). Proprio di KlimaSeniorinnen e'' il fondamento intergenerazionale del controllo: le generazioni
    future non partecipano alle decisioni e la politica tende al breve periodo, quindi il giudice ha una ragione
    in piu'' per intervenire. Neubauer fonda la tutela del futuro sulla liberta'' intertemporale, non sul controllo
    del giudice.

    '
  paragrafi: § 420
  fonte: 'PI, 01/10/2026: sonde distintive (prima «controllo_giudiziale», §§ 410-413, 419-421, 449-451, 639)'
  canonical: the intergenerational perspective underscores the risk inherent in the relevant political decision-making
    processes, namely that short-term interests and concerns may come to prevail over, and at the expense of, pressing
    needs for sustainable policy-making, rendering that risk particularly serious and adding justification for the
    possibility of judicial review
  canonical_paragrafo: § 420
  canonical_pagina: 171
  canonical_documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1

sonde_di_riserva:
- id: klimaseniorinnen.accesso_giudice_associazione
  titolo: Accesso al giudice (art. 6 § 1) per l'associazione che chiede l'attuazione delle misure di mitigazione gia' previste dalla legge
  testo: >
    The right of access to a court does not extend to actions that seek to compel the legislature to enact climate
    legislation, but an association's action seeking the effective implementation of mitigation measures already
    required by existing law concerns its members' civil rights and falls within it; a future harm that is real and
    highly probable need not be strictly imminent. Domestic courts that do not engage seriously with such an action
    impair the very essence of that right.
  paragrafi: "§§ 608-625, 629-638"
  fonte: proposta dell'esecutore, 1/10/2026
  canonical: >
    While the complaint concerning policy decisions that are subject to the relevant democratic processes is not a
    matter falling within the scope of Article 6 (see paragraph 594 above), the applicants’ complaint concerning
    effective implementation of the mitigation measures under existing law is a matter capable of falling within the
    scope of that provision, provided that the other conditions for the applicability of Article 6 § 1 are satisfied.
  canonical_paragrafo: § 616
  canonical_pagina: 223
  canonical_documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1

