# CASO CITATO — VEREIN KLIMASENIORINNEN SCHWEIZ E ALTRI c. SVIZZERA, query specification v1 (PROPOSTA)
#
# Corte europea dei diritti dell'uomo, Grande Camera, sentenza del 9 aprile 2024, ricorso n. 53600/20.
# Scritto il 1 ottobre 2026 come PROPOSTA per il PI, nella cartella `cited-cases/proposte-2026-10-01/klimaseniorinnen/`.
# Non sostituisce `cited-cases/klimaseniorinnen.yaml` (il file breve del 19/9, solo forme): lo affianca finche' il PI
# non decide. Struttura presa da `neubauer-P05.yaml` e `urgenda.yaml`; compagni: `klimaseniorinnen-fascicolo.md`,
# `klimaseniorinnen-mappa-paragrafi.yaml`, `PROPOSTA.md`, `conta_paragrafi.py`.
#
# LINGUA. La sentenza e' resa in inglese e francese, entrambi facenti fede (p. 233: «Done in English and in French»).
# Nel corpus c'e' solo l'inglese (`judgment_f4b1`): tutti i canonical vengono da li'. Sonde in inglese.
#
# PAGINE. `canonical_pagina` = marcatore `<!-- page N -->` del markdown = pagina del PDF. La numerazione stampata
# della sentenza e' la pagina del PDF meno 2 (la p. 3 del PDF porta il numero 1). La sentenza occupa le pp. 1-234
# del PDF; il voto separato del giudice Eicke le pp. 235-260. Paragrafi (§) = numerazione della Corte, 1-657.
#
# VERBATIM. Ogni canonical e' stato ritrovato nel markdown della sentenza con i soli spazi normalizzati (script di
# controllo dell'esecutore, 1/10/2026). Nessun canonical attraversa un salto di pagina. Una sola sillabazione di fine
# riga conservata come nel corpus («sub- paragraphs», § 550), dichiarata nella sonda.
#
# SETTE SONDE, PIU' UNA DI RISERVA. Dalla lettura dei §§ 410-657 (la valutazione della Corte) e dal conteggio dei
# rinvii a paragrafo nel corpus (`conta_paragrafi.py`, risultati in PROPOSTA.md). Intervalli di paragrafi DISGIUNTI.
# Le parti di ammissibilita' che anticipano il merito sono state separate: i §§ 435-436 e 478 (nesso causale fra
# omissioni dello Stato e danno) vanno alla sonda dell'art. 8, perche' il § 519 li richiama come proprio fondamento.
# La sonda sull'art. 6 (accesso al giudice dell'associazione) e' in `sonde_di_riserva`: la pipeline non la legge.

