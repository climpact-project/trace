caso_ancora:
  misurato: >
    132 documenti del corpus nominano il caso fuori dai suoi atti e da quelli del giudizio svizzero, in 61 case_id
    (1/10/2026, `conta_paragrafi.py`). Il file del 19/9 diceva 64 casi: la differenza viene dai due case_id esclusi
    e dal conteggio solo sul corpo del documento (il front matter di molti documenti riporta il nome nei riassunti).
  motivazione_selezione: >
    DA SCRIVERE DAL PI. Proposta dell'esecutore, NON decisa: prima sentenza di una corte internazionale dei diritti
    umani che accerta la violazione di un diritto (art. 8 CEDU) per l'insufficienza della politica climatica di uno
    Stato; fissa criteri propri per la qualita' di vittima nel contenzioso climatico (soglia particolarmente alta per i
    singoli, legittimazione delle associazioni a condizioni), un margine di apprezzamento differenziato (ridotto sugli
    obiettivi, ampio sui mezzi) e un elenco di requisiti del quadro regolatorio (fra cui un bilancio di carbonio o una
    quantificazione equivalente).
  famiglia_giuridica: diritto internazionale dei diritti umani (CEDU), sistema regionale europeo
  data_prima_pronuncia: 2024-04-09
  data_ultima_pronuncia: 2024-04-09
  esito: >
    accolto in parte: violazione dell'art. 8 (16 voti a 1) e dell'art. 6 § 1 (all'unanimita') per l'associazione;
    ricorsi delle quattro ricorrenti individuali irricevibili (difetto della qualita' di vittima); art. 2 non esaminato;
    art. 13 assorbito; nessuna misura specifica indicata ex art. 46.
  caso_perso: false
  caso_di_controllo: false
  documenti_corpus_successivi_alla_decisione: null

