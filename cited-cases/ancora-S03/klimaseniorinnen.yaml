nota_analitica:
  spartiacque_possibili: [2024-04-09]
  effetto_atteso: >
    Riprese sostanziali attese sui requisiti (§ 550, il piu' citato), sul margine differenziato (§ 543) e sui criteri
    di legittimazione (§§ 487-488, 502), nelle sentenze nazionali successive (Paesi Bassi, Belgio, Germania, Repubblica
    ceca, Norvegia) e nelle richieste di parere consultivo. Riattribuzione possibile a Strasburgo di cio' che Urgenda e
    Neubauer avevano detto prima (propria quota, bilancio di carbonio, ragione intergenerazionale): da verificare, non
    da presupporre.
