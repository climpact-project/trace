    pagina: "181-182"
    sintesi: "Metodo: i principi sulla qualita' di vittima si espongono a parte, ma si applicano insieme all'applicabilita' degli artt. 2 e 8."
    sonde: []

  - paragrafo: "§§ 460-477"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "182-186"
    sintesi: "Principi generali, ricapitolazione: niente actio popularis; vittime dirette, indirette e potenziali; criteri ambientali; le associazioni di regola non sono vittime e non invocano la salute, salvo «special considerations» (Câmpeanu)."
    sonde: []

  - paragrafo: "§ 478"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "186"
    sintesi: "Prove scientifiche solide; gli Stati controllano le cause e si sono impegnati a mitigare e adattarsi: puo' esistere un nesso causale giuridicamente rilevante fra azioni od omissioni dello Stato e danno agli individui."
    sonde: [klimaseniorinnen.art8_protezione_effettiva]
    nota: "Sta nella parte sulla qualita' di vittima, ma il suo punto e' il nesso causale; il § 519 lo richiama."

  - paragrafo: "§§ 479-480"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "186-187"
    sintesi: "Numero indefinito di persone colpite e omissioni nelle misure generali: serve un approccio speciale alla qualita' di vittima; restano salvi i casi di danno individuale gia' subito."
    sonde: [klimaseniorinnen.vittima_soglia_alta]

  - paragrafo: "§§ 481-484"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "187-188"
    sintesi: "Come esaminare queste lagnanze senza ammettere l'actio popularis: nel clima chiunque puo' essere toccato; il cerchio delle vittime non deve essere ne' troppo largo ne' troppo stretto."
    sonde: [klimaseniorinnen.vittima_soglia_alta]

  - paragrafo: "§§ 485-486"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "188"
    sintesi: "La categoria delle vittime potenziali come «class of people» non funziona qui; criteri distintivi: livello e gravita' del rischio e urgenza del bisogno di protezione."
    sonde: [klimaseniorinnen.vittima_soglia_alta]

  - paragrafo: "§ 487"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "188-189"
    sintesi: "I due criteri: (a) alta intensita' di esposizione agli effetti negativi del cambiamento climatico; (b) bisogno pressante di protezione individuale per l'assenza o l'inadeguatezza di misure ragionevoli."
    sonde: [klimaseniorinnen.vittima_soglia_alta]

  - paragrafo: "§ 488"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "189"
    sintesi: "Soglia particolarmente alta; valutazione concreta (condizioni locali, vulnerabilita', attualita' e probabilita' degli effetti, durata, portata del rischio)."
    sonde: [klimaseniorinnen.vittima_soglia_alta]

  - paragrafo: "§§ 489-494"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "189-191"
    sintesi: "Importanza dell'azione collettiva nel clima, «common concern of humankind»; Aarhus, diritto UE, studi comparati e indagine della Corte sulla legittimazione delle associazioni."
    sonde: [klimaseniorinnen.legittimazione_associazioni]

  - paragrafo: "§§ 495-497"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "191-192"
    sintesi: "Distinzione fra qualita' di vittima e rappresentanza; l'associazione non puo' far valere la salute; evoluzione della societa' verso il contenzioso climatico delle associazioni."
    sonde: [klimaseniorinnen.legittimazione_associazioni]

  - paragrafo: "§ 498"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "192"
    sintesi: "Le considerazioni proprie del clima depongono per riconoscere alle associazioni la legittimazione come rappresentanti, anche se non sono esse stesse vittime."
    sonde: [klimaseniorinnen.legittimazione_associazioni]

  - paragrafo: "§ 499"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "192"
    sintesi: "Clima come preoccupazione comune e ripartizione fra generazioni depongono per la legittimazione delle associazioni; gli Stati devono proteggere anche chi potra' essere colpito gravemente in futuro senza azione tempestiva."
    sonde: [klimaseniorinnen.legittimazione_associazioni]
    nota: "La frase centrale e' di merito ed e' citata per l'urgenza insieme al § 436 (Greenpeace Nordic, una richiesta di parere consultivo). Assegnato alle associazioni perche' apertura e conclusione riguardano la legittimazione. Domanda al PI."

  - paragrafo: "§§ 500-501"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "192-193"
    sintesi: "Niente lagnanza astratta sul deterioramento generale delle condizioni di vita; Aarhus come riferimento, senza ammettere l'azione popolare."
    sonde: [klimaseniorinnen.legittimazione_associazioni]

  - paragrafo: "§ 502"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "193-194"
    sintesi: "Le tre condizioni (costituzione regolare; scopo statutario dedicato alla difesa dei diritti umani dei membri; qualificazione e rappresentativita') e i fattori di valutazione; nessun requisito separato che i rappresentati siano vittime."
    sonde: [klimaseniorinnen.legittimazione_associazioni]

  - paragrafo: "§ 503"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "194"
    sintesi: "Se il diritto interno limita la legittimazione delle associazioni, la Corte puo' considerare l'accesso al giudice dei singoli membri."
    sonde: [klimaseniorinnen.legittimazione_associazioni]

  - paragrafo: "§§ 504-506"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "194"
    sintesi: "Le obiezioni del Governo; esame congiunto con l'applicabilita' delle disposizioni."
    sonde: []

  - paragrafo: "§§ 507-513"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "194-196"
    sintesi: "Art. 2 nel contesto climatico: attivita' per sua natura pericolosa per la vita (§ 509); rischio «reale e imminente» letto alla luce dell'irreversibilita', con prossimita' materiale e temporale; un grave rischio di calo significativo della speranza di vita puo' far scattare l'art. 2 (§ 513)."
    sonde: []
    nota: "Senza sonda: l'art. 2 non e' stato esaminato (§§ 536-537). Citato da 12 documenti (De Conto e Uricchio c. Italia per il § 513, Smith c. Attorney General per i §§ 507-509)."

  - paragrafo: "§§ 514-518"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "196-198"
    sintesi: "Applicabilita' dell'art. 8 nei casi ambientali, ricapitolazione: interferenza effettiva, soglia minima di gravita', esposizione a un rischio ambientale grave."
    sonde: []

  - paragrafo: "§ 519"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "198"
    sintesi: "L'art. 8 comprende un diritto alla protezione effettiva dello Stato dagli effetti negativi gravi del cambiamento climatico su vita, salute, benessere e qualita' della vita."
    sonde: [klimaseniorinnen.art8_protezione_effettiva]

  - paragrafo: "§ 520"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "198"
    sintesi: "L'applicabilita' dell'art. 8 dipende dagli stessi criteri della qualita' di vittima (§§ 487-488) o della legittimazione delle associazioni (§ 502)."
    sonde: [klimaseniorinnen.art8_protezione_effettiva]

  - paragrafo: "§§ 521-526"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "198-199"
    sintesi: "Applicazione: l'associazione soddisfa le tre condizioni (oltre 2.000 socie, eta' media 73 anni; le singole non hanno avuto accesso a un giudice); ha legittimazione e l'art. 8 si applica."
    sonde: [klimaseniorinnen.legittimazione_associazioni]

  - paragrafo: "§§ 527-535"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "199-201"
    sintesi: "Applicazione: le quattro ricorrenti non raggiungono la soglia (nessuna condizione medica critica non alleviabile con l'adattamento disponibile); ricorsi irricevibili ratione personae."
    sonde: [klimaseniorinnen.vittima_soglia_alta]

  - paragrafo: "§§ 536-537"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "201-202"
    sintesi: "Art. 2 non esaminato per l'associazione; ricorsi individuali sull'art. 2 irricevibili; esame sotto il solo art. 8, tenendo conto dei principi dell'art. 2."
    sonde: []

  - paragrafo: "§§ 538-541"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "202-205"
    sintesi: "Principi generali degli obblighi positivi in materia ambientale (quadro normativo, attuazione effettiva, margine ampio, scelta dei mezzi, informazione, processo decisionale) e sussidiarieta': ricapitolazione."
    sonde: []
    nota: "Il § 538 e' molto citato (16 rinvii, 7 documenti), ma riassume la giurisprudenza precedente."

  - paragrafo: "§ 542"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "205"
    sintesi: "La protezione del clima pesa in modo considerevole nel bilanciamento: urgenza, gravita' e irreversibilita', natura globale delle emissioni, scarso bilancio passato degli Stati."
    sonde: [klimaseniorinnen.margine_differenziato]

  - paragrafo: "§ 543"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "205"
    sintesi: "Margine ridotto sull'impegno a combattere il cambiamento climatico e sugli obiettivi; margine ampio sulla scelta dei mezzi."
    sonde: [klimaseniorinnen.margine_differenziato]

  - paragrafo: "§ 544"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "205-206"
    sintesi: "Dall'art. 8 deriva un diritto alla protezione effettiva dagli effetti gravi del clima (rinvio al § 519)."
    sonde: [klimaseniorinnen.art8_protezione_effettiva]

  - paragrafo: "§ 545"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "206"
    sintesi: "Lo Stato deve fare la sua parte: dovere primario di adottare e applicare in concreto misure capaci di mitigare gli effetti presenti e futuri, potenzialmente irreversibili."
    sonde: [klimaseniorinnen.art8_protezione_effettiva]

  - paragrafo: "§ 546"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "206"
    sintesi: "In linea con UNFCCC, Parigi e IPCC, gli Stati devono prevenire un aumento della temperatura oltre livelli capaci di effetti gravi e irreversibili sui diritti."
    sonde: [klimaseniorinnen.art8_protezione_effettiva]

  - paragrafo: "§ 547"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "206"
    sintesi: "Gli obiettivi globali di Parigi da soli non bastano come criterio: ogni Stato deve definire il proprio percorso adeguato verso la neutralita'."
    sonde: [klimaseniorinnen.requisiti_quadro_regolatorio]

  - paragrafo: "§ 548"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "206-207"
    sintesi: "Riduzione sostanziale e progressiva verso la neutralita' entro, in principio, tre decenni; le autorita' devono agire per tempo, in modo appropriato e coerente."
    sonde: [klimaseniorinnen.requisiti_quadro_regolatorio]

  - paragrafo: "§ 549"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "207"
    sintesi: "Azione immediata e obiettivi intermedi per evitare un peso sproporzionato sulle generazioni future, dentro un quadro nazionale vincolante."
    sonde: [klimaseniorinnen.requisiti_quadro_regolatorio]

  - paragrafo: "§ 550"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "207"
    sintesi: "I cinque requisiti: (a) tempi per la neutralita' e bilancio di carbonio residuo o quantificazione equivalente; (b) obiettivi intermedi e percorsi; (c) prova del rispetto; (d) aggiornamento; (e) azione tempestiva e coerente."
    sonde: [klimaseniorinnen.requisiti_quadro_regolatorio]
    nota: "Il paragrafo piu' citato della sentenza (36 rinvii, 17 documenti)."

  - paragrafo: "§ 551"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "207"
    sintesi: "Valutazione d'insieme: una sola mancanza non comporta di per se' il superamento del margine."
    sonde: [klimaseniorinnen.margine_differenziato]

  - paragrafo: "§ 552"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "207-208"
    sintesi: "La mitigazione va integrata da misure di adattamento contro le conseguenze piu' gravi o imminenti."
    sonde: [klimaseniorinnen.art8_protezione_effettiva]

  - paragrafo: "§§ 553-554"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "208"
    sintesi: "Garanzie procedurali: informazione accessibile al pubblico e possibilita' che le opinioni e gli interessi delle persone toccate siano considerati nelle decisioni."
    sonde: [klimaseniorinnen.margine_differenziato]

  - paragrafo: "§ 555"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "208"
    sintesi: "Basta l'inadempimento sulla mitigazione per la violazione, senza esaminare l'adattamento."
    sonde: [klimaseniorinnen.requisiti_quadro_regolatorio]

  - paragrafo: "§§ 556-557"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "208-209"
    sintesi: "La Corte considera la situazione complessiva fino al 14/2/2024 e non risolve il disaccordo delle parti sugli studi."
    sonde: []

  - paragrafo: "§§ 558-559"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "209-210"
    sintesi: "Legge sul CO2 del 2011: meno 20% al 2020, gia' insufficiente per il Consiglio federale nel 2009; obiettivo 2020 mancato (circa meno 11%)."
    sonde: [klimaseniorinnen.requisiti_quadro_regolatorio]

  - paragrafo: "§§ 560-562"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "210"
    sintesi: "Revisione respinta al referendum del 2021; vuoto legislativo dopo il 2024: mancano gli obiettivi richiesti dal § 550 (a)-(b)."
    sonde: [klimaseniorinnen.requisiti_quadro_regolatorio]

  - paragrafo: "§§ 563-568"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "210-212"
    sintesi: "NDC del 2021 e legge sul clima del 2022, non in vigore: obiettivi senza misure concrete, periodo 2025-2030 non regolato; il solo impegno a misure «in good time» non basta."
    sonde: [klimaseniorinnen.requisiti_quadro_regolatorio]

  - paragrafo: "§§ 569-572"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "212-213"
    sintesi: "Bilancio di carbonio: stima dell'associazione, nessun bilancio fissato dal Governo; nessun quadro efficace senza quantificazione; rinvio a Neubauer (Rn. 215-229) e alle responsabilita' comuni ma differenziate; bilanci indicativi della legge europea sul clima."
    sonde: [klimaseniorinnen.requisiti_quadro_regolatorio]
    nota: "Il § 571 cita Neubauer: chi riprende di qui il bilancio nazionale riprende Neubauer in forma annidata."

  - paragrafo: "§ 573"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "213"
    sintesi: "Conclusione: lacune critiche, nessuna quantificazione, obiettivi passati mancati; non avendo agito per tempo e in modo appropriato e coerente, lo Stato ha superato il margine."
    sonde: [klimaseniorinnen.requisiti_quadro_regolatorio]

  - paragrafo: "§ 574"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "213"
    sintesi: "Violazione dell'art. 8."
    sonde: []

  - paragrafo: "§§ 575-589"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "213-217"
    sintesi: "Art. 6: tesi delle parti."
    sonde: []

  - paragrafo: "§§ 590-607"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "217-221"
    sintesi: "Art. 6: qualita' di vittima e principi generali di applicabilita', ricapitolazione (diritto di carattere civile, controversia reale e seria, esito direttamente decisivo; nessun diritto a un giudice che annulli le leggi, § 594)."
    sonde: []

  - paragrafo: "§§ 608-614"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "221-223"
    sintesi: "Art. 6 nel contesto climatico: principi invariati ma applicati secondo la specificita'; nessuna azione per costringere il Parlamento a legiferare; un danno futuro reale e molto probabile non deve essere strettamente imminente; ruolo delle associazioni."
    sonde: []
    riserva: [klimaseniorinnen.accesso_giudice_associazione]

  - paragrafo: "§§ 615-625"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "223-225"
    sintesi: "Applicazione: la parte dell'azione sull'attuazione delle misure di mitigazione previste dalla legge rientra nell'art. 6; l'associazione ha un legame diretto e sufficiente con i diritti delle socie; per le singole l'esito non era direttamente decisivo (irricevibili)."
    sonde: []
    riserva: [klimaseniorinnen.accesso_giudice_associazione]

  - paragrafo: "§§ 626-628"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "225-226"
    sintesi: "Principi generali sull'accesso al giudice (Zubac); la separazione dei poteri e' uno scopo legittimo di limitazione."
    sonde: []

  - paragrafo: "§§ 629-638"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "226-228"
    sintesi: "Applicazione: i giudici svizzeri non hanno esaminato le prove scientifiche ne' la legittimazione dell'associazione; nessun'altra via per le socie; lesa l'essenza del diritto di accesso al giudice."
    sonde: []
    riserva: [klimaseniorinnen.accesso_giudice_associazione]

  - paragrafo: "§ 639"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "228-229"
    sintesi: "Ruolo chiave dei giudici nazionali nel contenzioso climatico e importanza dell'accesso alla giustizia; spetta anzitutto alle autorita' nazionali, giudici compresi, far rispettare la Convenzione."
    sonde: []   # 01/10/2026: sonde distintive (il PI); prima ['klimaseniorinnen.controllo_giudiziale']
    nota: "Sta nella parte sull'art. 6 ma il suo punto e' il ruolo dei giudici; se il PI adotta la sonda di riserva sull'accesso al giudice, va deciso dove metterlo."

  - paragrafo: "§ 640"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "229"
    sintesi: "Violazione dell'art. 6 § 1."
    sonde: []

  - paragrafo: "§§ 641-645"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "229"
    sintesi: "Art. 13: assorbito dall'art. 6 per l'associazione; irricevibile per le ricorrenti individuali."
    sonde: []

  - paragrafo: "§§ 646-651"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "229-230"
    sintesi: "Art. 41: nessun danno chiesto; 80.000 euro per le spese."
    sonde: []

  - paragrafo: "§§ 652-656"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "230-232"
    sintesi: "Art. 46: tesi delle parti; le sentenze sono essenzialmente dichiarative (ricapitolazione)."
    sonde: []

  - paragrafo: "§ 657"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "232"
    sintesi: "Nessuna misura specifica indicata: dato il margine differenziato, lo Stato, assistito dal Comitato dei Ministri, valuta le misure da prendere."
    sonde: [klimaseniorinnen.margine_differenziato]

  - paragrafo: "Dispositivo, punti 1-14"
    documento: verein-klimaseniorinnen-schweiz-and-others-v-switzerland-judgment_f4b1
    pagina: "232-233"
    sintesi: "Erede legittimato; obiezioni preliminari respinte; legittimazione dell'associazione e solo art. 8 (16 a 1); ricorrenti individuali non vittime (unanimita'); art. 2 non esaminato; violazione dell'art. 8 (16 a 1); art. 6 applicabile all'associazione (16 a 1) e violato (unanimita'); art. 13 assorbito; 80.000 euro di spese."
