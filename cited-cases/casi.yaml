# REGISTRO UNICO DEI CASI CITATI DI TRACE (06/10/2026).
# Un caso nuovo si aggiunge QUI (una voce in fondo) e in cited-cases/<id>.yaml: gli strumenti leggono l'elenco da questo
# file tramite tools/casi_registro.py (gemello: tracepipe/casi_registro.py), niente piu' liste scritte nei file.
# L'ORDINE conta (e' quello di tutti gli output: conti, rapporti, cicli): i casi nuovi vanno in fondo.
# Formato: elenco semplice di voci "chiave: valore" (niente liste annidate); i valori sono sempre testo.
#   id           nome del file in cited-cases/ e valore di caso_citato in corpus_rows
#   prefisso     il prefisso dei codici delle citazioni (URG-0001...)
#   nome         il nome pubblico breve (lo stesso di pubblicazione/mappa/casi.json)
#   colore       il colore del caso nella mappa
#   serie_prima  la prima serie di sonde del caso (quella dei file senza suffisso), come tools/sonde.PRIMA_SERIE
#   serie_in_uso la serie in uso senza TRACE_SONDE, come tools/sonde.SERIE_IN_USO (vuota = nessuna: file senza suffisso)
#   soglia_d05   data minima degli atti scaricati da D05 (tools/d05_pronto.py)
#   codice_mappa codice di registro della mappa dei paragrafi, se diverso dal predefinito R04 (tools/carica_ripresa.py)
#   attivo       si' = entra negli elenchi CASI; no = tenuto qui ma fuori dai cicli
casi:
  - id: urgenda
    prefisso: URG
    nome: Urgenda
    colore: "#5cb6ee"
    serie_prima: P01
    serie_in_uso:
    soglia_d05: 2015-06-24
    codice_mappa:
    attivo: si
