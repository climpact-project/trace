# PARAGRAPH MAP OF OC-32/25 (IACtHR, «Emergencia Climática y Derechos Humanos», 29/5/2025)
# Version 2, 1 October 2026, PROPOSAL for the PI: probes of the series approved by the PI
# (eight distinguishing principles); only the paragraphs that state the element carry the probe, all others `sonde: []`. Companion to `idh-oc-32-25-fascicolo.md`
# and to `idh-oc-32-25.yaml`. It serves to decipher cross-references of the type «OC-32/25, párr. 233», «AO-32/25, paras. 345-350»,
# «IACtHR, Climate Emergency and Human Rights, ¶ 546», and to know which probe a paragraph supports.
#
# SOURCES. One ruling, four versions in the corpus; the paragraph numbers (1-629) are the same in all.
#   ES  decision_28df  (original Spanish, 234 pp.)           -> `pagina_es`
#   EN  decision_3b51  (Court's English translation, 219 pp.) -> `pagina_en`
#   (EN bis decision_9329, 234 pp., same pagination as the Spanish; PT opinion_2cd0, 228 pp.)
#   The full ids begin with request-for-an-advisory-opinion-on-the-scope-of-the-state-obligations-for-responding-to-the-climate-emergency-
# `pagina` = markdown marker `<!-- page N -->`, which coincides with the PDF page. The pages are those in
# which the first paragraph of the group begins and the last one ends.
#
# HOW THE NUMBERS WERE ESTABLISHED. The paragraph numbers are printed at the beginning of each paragraph, in sequence from 1 to 629,
# identical in both versions: no reconstruction. The section headings are those of the table of contents (pp. 2-4) and of the
# text. The resolutive points (VII. Opinión, pp. 229-233) have their own numbering, 1-20, preceded by «decide 1»
# on jurisdiction: «operative para 3» in citing texts means resolutive point 3, not § 3.
#
# GROUPS. The opinion has 629 paragraphs: the map groups them by subsection, without gaps and without overlaps
# (checked by the script that generated it). `sonde` uses the ids of `idh-oc-32-25.yaml` without prefix.
# Empty list = no probe: facts, procedure, method, surveys, connecting passages, or a non-promoted axis (`nota`).
# `punto_resolutivo` = the point of the Opinión that refers to those paragraphs. `verbatim` = fragment found in the
# Spanish markdown by normalizing only spaces (with its page).

