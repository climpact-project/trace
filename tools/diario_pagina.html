<title>Diario TRACE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Questrial&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root {
  --bg: #eef2f7; --panel: #ffffff; --panel-2: #e4eaf2; --ink: #1c2636; --ink-2: #4a586d; --ink-3: #7a879a;
  --accent: #2e84ff; --accent-soft: #dceaff; --mark: #ffe8a3; --code: #eef2f7;
  --ui: "Questrial", "Helvetica Neue", Arial, sans-serif;
  --read: "Newsreader", Georgia, "Times New Roman", serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121a25; --panel: #1c2636; --panel-2: #243146; --ink: #e8edf5; --ink-2: #b3bfd1; --ink-3: #8491a6;
    --accent: #6aa8ff; --accent-soft: #22385a; --mark: #5a4a12; --code: #172030; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121a25; --panel: #1c2636; --panel-2: #243146; --ink: #e8edf5; --ink-2: #b3bfd1; --ink-3: #8491a6;
  --accent: #6aa8ff; --accent-soft: #22385a; --mark: #5a4a12; --code: #172030; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); margin: 0; }
.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; height: 100%; padding: 16px; }
.lato { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.testa { background: var(--panel); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.testa h1 { font-family: var(--ui); font-weight: 400; font-size: 20px; margin: 0; letter-spacing: .01em; }
.testa .quando { font-size: 12px; color: var(--ink-3); }
.schede { display: flex; gap: 6px; background: var(--panel-2); border-radius: 999px; padding: 4px; }
.schede button { flex: 1; border: 0; border-radius: 999px; padding: 8px 10px; background: transparent; color: var(--ink-2);
  font: inherit; font-size: 13px; cursor: pointer; }
.schede button[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(20, 30, 50, .12); }
.cerca { width: 100%; border: 0; border-radius: 12px; padding: 10px 12px; background: var(--panel-2); color: var(--ink);
  font: inherit; font-size: 14px; }
.cerca:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.indice { background: var(--panel); border-radius: 16px; padding: 8px; overflow-y: auto; min-height: 0; flex: 1; }
.indice button { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: var(--ink-2);
  font: inherit; font-size: 13px; line-height: 1.35; padding: 7px 10px; border-radius: 10px; cursor: pointer; }
.indice button.l3 { padding-left: 22px; font-size: 12.5px; }
.indice button:hover { background: var(--panel-2); color: var(--ink); }
.indice button.su { background: var(--accent-soft); color: var(--ink); }
.indice .gruppo { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding: 12px 10px 4px; }
.lettura { overflow-y: auto; min-height: 0; background: var(--panel); border-radius: 16px; padding: 28px 32px 48px; }
.voce { max-width: 72ch; margin: 0 auto 40px; }
.voce .dove { font-size: 12px; color: var(--ink-3); letter-spacing: .02em; margin-bottom: 6px; }
.voce h2 { font-family: var(--ui); font-weight: 400; font-size: 24px; line-height: 1.25; margin: 0 0 14px; text-wrap: balance; }
.voce.l3 h2 { font-size: 20px; }
.corpo { font-family: var(--read); font-size: 17px; line-height: 1.62; color: var(--ink); }
.corpo p { margin: 0 0 14px; }
.corpo strong, .corpo b { font-weight: 700; }
.corpo h4, .corpo h5 { font-family: var(--ui); font-weight: 400; font-size: 17px; margin: 22px 0 8px; }
.corpo code { font-family: var(--mono); font-size: .82em; background: var(--code); padding: 1px 5px; border-radius: 6px; }
.corpo pre { background: var(--code); padding: 14px; border-radius: 12px; overflow-x: auto; font-size: 13px; line-height: 1.5; }
.corpo pre code { background: none; padding: 0; }
.corpo blockquote { margin: 0 0 14px; padding: 10px 16px; background: var(--panel-2); border-radius: 12px; color: var(--ink-2); }
.corpo table { border-collapse: separate; border-spacing: 0; font-family: var(--ui); font-size: 13.5px; margin: 0 0 16px; }
.corpo .tab { overflow-x: auto; margin-bottom: 16px; }
.corpo th, .corpo td { padding: 7px 10px; text-align: left; vertical-align: top; }
.corpo tr:nth-child(even) td { background: var(--panel-2); }
.corpo th { color: var(--ink-3); font-weight: 400; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
.corpo ul, .corpo ol { padding-left: 22px; margin: 0 0 14px; }
.corpo li { margin-bottom: 6px; }
.corpo hr { border: 0; height: 12px; }
mark { background: var(--mark); color: inherit; border-radius: 4px; padding: 0 2px; }
.piu { display: block; margin: 0 auto; border: 0; border-radius: 999px; padding: 10px 18px; background: var(--accent-soft);
  color: var(--ink); font: inherit; font-size: 14px; cursor: pointer; }
.vuoto { color: var(--ink-3); font-size: 15px; text-align: center; padding: 40px 0; }
.apri-indice { display: none; }
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; height: auto; }
  .indice { display: none; max-height: 60vh; }
  .indice.aperto { display: block; }
  .apri-indice { display: block; border: 0; border-radius: 12px; padding: 9px 12px; background: var(--panel-2); color: var(--ink);
    font: inherit; font-size: 14px; cursor: pointer; }
  .lettura { padding: 20px 18px 40px; overflow: visible; }
  .corpo { font-size: 16.5px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="app">
  <aside class="lato">
    <div class="testa">
      <h1>Diario TRACE</h1>
      <div class="quando" id="quando"></div>
      <div class="schede" role="tablist" aria-label="Documento">
        <button type="button" role="tab" id="t-diario" aria-selected="true">Diario</button>
        <button type="button" role="tab" id="t-unico" aria-selected="false">Documento unico</button>
      </div>
      <input class="cerca" id="cerca" type="search" placeholder="Cerca in tutti e due" autocomplete="off">
      <button type="button" class="apri-indice" id="apri-indice">Indice</button>
    </div>
    <nav class="indice" id="indice" aria-label="Indice"></nav>
  </aside>
  <main class="lettura" id="lettura"></main>
</div>

<script>
const DATI = /*DATI*/null;
const LOTTO = 6;
let scheda = 'diario', cerca = '', mostrate = LOTTO;
const $ = (id) => document.getElementById(id);
try { const s = localStorage.getItem('diario-scheda'); if (s === 'unico' || s === 'diario') scheda = s; } catch (e) {}

marked.setOptions({ gfm: true, breaks: false });

function ordinate(nome) {
  const v = DATI[nome].slice();
  /* Il diario si legge dall'ultima voce; il documento unico nel suo ordine, ma con le ultime sezioni
     del capitolo aperto (le §63.x) in cima quando non si cerca. */
  if (nome === 'diario') return v.reverse();
  return v;
}

function voci() {
  let v = ordinate(scheda);
  if (cerca) {
    const q = cerca.toLowerCase();
    v = DATI.diario.concat(DATI.unico).filter((x) => (x.titolo + '\n' + x.testo).toLowerCase().includes(q));
  }
  return v;
}

function evidenzia(html) {
  if (!cerca) return html;
  const q = cerca.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return html.replace(/>([^<]+)</g, (m, t) => '>' + t.replace(new RegExp(q, 'gi'), (x) => '<mark>' + x + '</mark>') + '<');
}

function disegnaVoce(v) {
  const box = document.createElement('article');
  box.className = 'voce' + (v.livello === 3 ? ' l3' : '');
  box.id = v.id + (DATI.diario.includes(v) ? 'd' : 'u');
  const dove = document.createElement('div');
  dove.className = 'dove';
  dove.textContent = [DATI.diario.includes(v) ? 'Diario' : 'Documento unico', v.parte, v.capitolo].filter(Boolean).join('  /  ');
  const h = document.createElement('h2');
  h.textContent = v.titolo;
  const c = document.createElement('div');
  c.className = 'corpo';
  c.innerHTML = evidenzia(marked.parse(v.testo)).replace(/<table>/g, '<div class="tab"><table>').replace(/<\/table>/g, '</table></div>');
  box.append(dove, h, c);
  return box;
}

function disegna() {
  $('t-diario').setAttribute('aria-selected', String(scheda === 'diario'));
  $('t-unico').setAttribute('aria-selected', String(scheda === 'unico'));
  const L = $('lettura');
  L.textContent = '';
  const v = voci();
  if (!v.length) {
    const p = document.createElement('p'); p.className = 'vuoto'; p.textContent = 'Nessuna voce contiene «' + cerca + '».';
    L.append(p);
  }
  v.slice(0, mostrate).forEach((x) => L.append(disegnaVoce(x)));
  if (v.length > mostrate) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'piu';
    b.textContent = 'Mostra altre voci (' + (v.length - mostrate) + ')';
    b.onclick = () => { mostrate += LOTTO * 2; disegna(); };
    L.append(b);
  }
  disegnaIndice(v);
}

function disegnaIndice(v) {
  const I = $('indice');
  I.textContent = '';
  let gruppo = null;
  v.forEach((x, i) => {
    const g = cerca ? (DATI.diario.includes(x) ? 'Diario' : 'Documento unico') : x.parte;
    if (g && g !== gruppo) {
      gruppo = g;
      const t = document.createElement('div'); t.className = 'gruppo'; t.textContent = g; I.append(t);
    }
    const b = document.createElement('button');
    b.type = 'button';
    b.className = x.livello === 3 ? 'l3' : '';
    b.textContent = x.titolo;
    b.onclick = () => {
      if (i >= mostrate) { mostrate = i + LOTTO; disegna(); }
      const el = document.getElementById(x.id + (DATI.diario.includes(x) ? 'd' : 'u'));
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      I.querySelectorAll('button.su').forEach((y) => y.classList.remove('su'));
      b.classList.add('su');
      I.classList.remove('aperto');
    };
    I.append(b);
  });
}

function vaiA(s) {
  scheda = s; mostrate = LOTTO; cerca = ''; $('cerca').value = '';
  try { localStorage.setItem('diario-scheda', s); } catch (e) {}
  $('lettura').scrollTop = 0;
  disegna();
}

$('t-diario').onclick = () => vaiA('diario');
$('t-unico').onclick = () => vaiA('unico');
let attesa;
$('cerca').addEventListener('input', (e) => {
  clearTimeout(attesa);
  attesa = setTimeout(() => { cerca = e.target.value.trim(); mostrate = LOTTO * 2; disegna(); }, 200);
});
$('apri-indice').onclick = () => $('indice').classList.toggle('aperto');
$('quando').textContent = 'Aggiornata il ' + DATI.generata + '. Diario: ' + DATI.diario.length + ' voci. Documento unico: ' + DATI.unico.length + ' voci.';
disegna();
</script>
