  sintesi: 'Dispositivo, all''unanimita'': (1) competenza; (2) risposta alla richiesta; (3) A obblighi dei trattati sul clima,
    lettere a-h; B consuetudine, a prevenzione e b cooperazione; C ozono, biodiversita'', desertificazione; D UNCLOS; E diritti
    umani; (4) violazione e fatto illecito, dovere di adempiere, cessazione, garanzie, riparazione piena con nesso causale
    sufficientemente diretto e certo. Corrispondenze con le sonde (il § 457 non ne porta nessuna): (3)A(e) e (3)A(f), NDC
    capaci insieme di 1,5 gradi, a ndc_discrezionalita_limitata (la (f) nomina anche l''1,5, cfr. obiettivo_1_5); (3)B(a),
    prevenzione con diligenza, a diligenza_stringente_clima; (4) a fossili_illecito (violazione come fatto illecito) e a erga_omnes
    (cessazione, garanzie, riparazione). Non hanno un sottopunto del dispositivo: non_lex_specialis, continuita_stato, e la
    parte erga omnes in senso stretto.'
