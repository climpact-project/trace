    documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
    pagina: 37
    sintesi: "Solidarieta' nel caso concreto: dovere e corresponsabilita' dello Stato colombiano di fermare le cause delle emissioni di GEI da riduzione boschiva; mitigazione immediata; diritto al benessere ambientale dei ricorrenti, di chi abita l'Amazzonia nazionale e straniera, di tutti gli abitanti del pianeta, ecosistemi e viventi compresi."
    sonde: [deforestazione_clima_diritti]
    anelli: [c]
    verbatim: "corresponsabilidad del Estado colombiano en detener las causas que provocan la emisión de GEI"

  - pronuncia: corte_suprema_2018
    paragrafo: "11.3 (secondo, Parigi)"
    documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
    pagina: 38-39
    sintesi: "Inadempimento: la realta' descritta viola la Carta ambientale e gli strumenti internazionali e costituisce grave disconoscimento degli obblighi di Parigi, dove la Colombia si impegno' a zero deforestazione in Amazzonia nel 2020, che avrebbe evitato 44 megatonnellate (p. 38); otto questioni a cui le autorita' devono rispondere: cultivos ilícitos e miniere, vuoto lasciato dalle FARC, incendi e frontiera agricola, vie e titoli, agroindustria, ruolo climatico globale, calcoli del carbonio, cambiamento climatico (pp. 38-39). Esclusa di provenienza `prov_paris_ndc_deforestacion`; asse non promosso a sonda."
    sonde: [deforestazione_clima_diritti]
    anelli: [d]
    verbatim: "constituye un grave desconocimiento de las obligaciones adquiridas por el Estado"

  - pronuncia: corte_suprema_2018
    paragrafo: "12"
    documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
    pagina: 39-41
    sintesi: "Intensificazione del problema e inefficacia delle misure governative; concessione del rimedio per palmario quebranto di acqua, aria, vita degna, salute in conexidad con l'ambiente (p. 39); la Sala segue T-622/2016 sul riconoscimento della natura come autentico soggetto di diritti, dalla prospettiva ecocentrica; T-622 citata per esteso: entidad viviente, sujetos de derechos individualizables, interdipendenza, derechos bioculturales, «justicia con la naturaleza», obblighi dello Stato e delle comunita' (pp. 40-41: escluse di provenienza)."
    sonde: [conexidad_diritti, natura_soggetto_diritti, ecocentrico_antropico]
    anelli: [b, e]
    verbatim: "relacionada con el reconocimiento de la naturaleza como un auténtico sujeto de derechos"

  - pronuncia: corte_suprema_2018
    paragrafo: "13"
