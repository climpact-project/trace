# PARAGRAPH MAP OF FUTURE GENERATIONS (Generaciones Futuras v. Minambiente), version 1
#
# Companion to `future-generations-fascicolo.md`. Used to resolve precise citations such as
# «STC4360-2018, p. 13», «Generaciones Futuras, supra, at para. 11.2», «Barragán at 48-49», and to
# know which probe and which link of the chain a paragraph supports.
#
# SOURCES. Corpus documents in the folder future-generations-v-ministry-of-the-environment-and-others_f076:
#   corte_suprema_2018   future-generations-v-ministry-of-the-environment-and-others-decision_7519  (Corte Suprema de Justicia, Sala de Casación Civil, STC4360-2018, 5/4/2018, Spanish, 51 pp., OCR)
#   dejusticia_2018      future-generations-v-ministry-of-the-environment-and-others-decision_7592  (excerpts translated into English by Dejusticia, 11 pp.)
#   tribunal_superior_2018  future-generations-v-ministry-of-the-environment-and-others-decision_15f3  (Tribunal Superior de Bogotá, 12/2/2018, Spanish, 21 pp.)
#   salvamento_2018      future-generations-v-ministry-of-the-environment-and-others-opinion_e35a  (salvamento de voto Ramírez Cardona, 12/2/2018, Spanish, 18 pp.)
#   tutela_2018          future-generations-v-ministry-of-the-environment-and-others-complaint_7da3  (tutela, 29/1/2018, 122 pp.); role parte
#   impugnacion_2018     future-generations-v-ministry-of-the-environment-and-others-appeal_3c21  (impugnación, 16/2/2018, 40 pp.); role parte
#   amicus_hansen_2018   future-generations-v-ministry-of-the-environment-and-others-other_e010  (Hansen amicus, 16/3/2018, English, 4 pp.); role amicus
# `pagina` = number of the markdown marker `<!-- page N -->`, which matches the PDF page.
#
# HOW THE PARAGRAPH NUMBERS WERE ESTABLISHED. The Corte Suprema numbers the Consideraciones 1 to 14,
# with sub-numbers printed at the start of the paragraph (5.1-5.3, 6.1-6.5, 11.1-11.3, 13.1-13.4); the
# Antecedentes have their own numbering (1-3, 2.1-2.6, 1.1-1.3). No reconstruction: the numbers are the
# printed ones. Two caveats: number 11.3 is used twice (p. 37 solidarity, p. 38 Paris); number 5 is
# read as «>.» by the OCR (p. 16). The Tribunal Superior numbers the Consideraciones 1-5 and the
# Antecedentes 1-3 with 3.1-3.15. The salvamento numbers 1.1-1.6, 2.1-2.3 (2.3.1-2.3.2 with letters a-d), 3.1-3.4.
# The Dejusticia excerpts give the Spanish page in parentheses («(p. 13)», «p. 34», «p.45»):
# `dejusticia_2018` entries give the English page and, in `paragrafo`, the Spanish reference.
#
# OBSERVATIONS WITH RESPECT TO `future-generations.yaml` (version 2, not modified): see case file, 2.2.
# No wrong page number or verbatim found. T-622/2016 is in the corpus (atrato-river-decision-t-622-16-of-november-10-2016_976c).
#
# PROBES: conexidad_diritti, generazioni_future_obbligo, equita_intergenerazionale_violata,
#         deforestazione_clima_diritti, natura_soggetto_diritti, ecocentrico_antropico, tutela_conexidad_collettivo.
# LINKS of the chain (case file, section 0):
#   a = admissibility through conexidad: harm to the environment harms fundamental rights; the tutela
#       proceeds despite the acción popular; the minors act in their own right
#   b = foundation: fundamental rights determined by the ecosystem; ecocentric-anthropic criterion;
#       future generations as right-holders; duty of abstention of present generations
#   c = fact and link: deforestation as a source of CO2 and greenhouse effect, imminent and serious harm
#       to present and future generations; precaution, intergenerational equity (obvious transgression),
#       solidarity (co-responsibility)
#   d = non-compliance: Paris and zero deforestation by 2020; omissions of CAR, parks, departments, municipalities
#   e = remedy: the Amazon as a subject of rights (like the Atrato); plans with participation of the complainants, PIVAC
# Empty lists: the paragraph supports no probe or link (facts, procedure).
# `verbatim`: fragment found in the corpus (normalising spaces, line breaks and accents).

voci:

# ═══════════════════════════ CORTE SUPREMA, STC4360-2018, 5 April 2018 ═══════════════════════════

  - pronuncia: corte_suprema_2018
