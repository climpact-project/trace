    documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
    pagina: 1-2
    sintesi: "Oggetto: protezione dei diritti «supralegales», ambiente sano, vita e salute, contro la Presidencia, i ministeri, PNN e le gobernaciones amazzoniche (27 entita', nota 1) per l'aumento della deforestazione in Amazzonia."
    sonde: []
    anelli: []

  - pronuncia: corte_suprema_2018
    paragrafo: "Antecedentes 2.1-2.5"
    documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
    pagina: 2-4
    sintesi: "Fatti come narrati dai ricorrenti (RIPORTATO): 25 fra 7 e 25 anni, vita adulta 2041-2070, +1,6 e +2,14 gradi secondo l'IDEAM; impegni di Parigi e Ley 1753/2015 a zero deforestazione nel 2020; AT-D 66,2%; 178.597 ettari persi nel 2016, +44%; cause; effetti su acqua, suoli, páramos, riscaldamento; autoqualificazione come generazione futura (2.5, p. 4)."
    sonde: [equita_intergenerazionale_violata, deforestazione_clima_diritti]
    anelli: [c]
    verbatim: "la generación futura que enfrentará los efectos del cambio climático en el período 2041-2070 y 2071-2100"

  - pronuncia: corte_suprema_2018
    paragrafo: "Antecedentes 2.6"
    documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
    pagina: 4
    sintesi: "Tesi dei ricorrenti sulla procedibilita' (RIPORTATO): criteri di SU-1116/2001, inidoneita' dell'acción popular, in subordine tutela come meccanismo transitorio contro il perjuicio irremediable."
    sonde: [tutela_conexidad_collettivo]
    anelli: [a]

  - pronuncia: corte_suprema_2018
    paragrafo: "Antecedentes 3"
    documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
    pagina: 4-5
    sintesi: "Le sei pretese: piano d'azione in sei mesi per zero deforestazione nel 2020; accordo intergenerazionale elaborato con i ricorrenti; POT dei municipi; moratoria; indagini della Fiscalía; bilancio dei parchi."
    sonde: [generazioni_future_obbligo]
    anelli: [e]
    verbatim: "un acuerdo intergeneracional sobre las medidas que se adoptarán para reducir la deforestación"

  - pronuncia: corte_suprema_2018
    paragrafo: "1.1 (risposte 1-15)"
    documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
    pagina: 6-9
    sintesi: "Risposte dei convenuti e interventi: Presidencia e Minagricultura senza competenza; Minambiente elenca strategie; Procuraduría coadiuva; PNN; Putumayo: strumento improcedente per diritti collettivi (POLARITA', p. 7); universita', Foro Nacional Ambiental, associazioni indigene a favore; amicus di Hansen riportato in traduzione (p. 9)."
    sonde: [tutela_conexidad_collettivo, equita_intergenerazionale_violata]
    anelli: []
    verbatim: "el principio de la equidad intergeneracional obliga a actuar sin más demora"

  - pronuncia: corte_suprema_2018
    paragrafo: "1.2"
    documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
    pagina: 9-10
    sintesi: "La sentenza impugnata riassunta per esteso: l'acción popular e' idonea, il perjuicio irremediable non e' provato. POLARITA' riportata."
    sonde: [tutela_conexidad_collettivo, deforestazione_clima_diritti]
    anelli: []

  - pronuncia: corte_suprema_2018
    paragrafo: "1.3"
    documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
    pagina: 10
    sintesi: "L'impugnación: l'acción popular non e' il meccanismo idoneo, il perjuicio e' provato; coadiuvata dalla Procuraduría Delegada para Asuntos Ambientales."
    sonde: [tutela_conexidad_collettivo]
    anelli: [a]

  - pronuncia: corte_suprema_2018
    paragrafo: "1"
    documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
    pagina: 10-11
    sintesi: "Regola ed eccezione: la tutela non protegge diritti collettivi (art. 88 C.P., Ley 472/1998), salvo quando la lesione del collettivo lede garanzie individuali; quattro condizioni della giurisprudenza costituzionale (nota 4: T-1451/2000, SU-1116/2001, T-288/2007, T-659/2007, T-601/2017): conexidad, ricorrente direttamente leso, lesione provata o minaccia, ordine diretto ai diritti individuali."
    sonde: [tutela_conexidad_collettivo]
    anelli: [a]
    verbatim: "La conexidad entre la vulneración de derechos colectivos y la violación a uno u otros de tipo primario, fundamental e individual"

  - pronuncia: corte_suprema_2018
    paragrafo: "2"
    documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
    pagina: 11-14
    sintesi: "La protezione dell'ambiente acquista per conexidad natura fondamentale: urgenza delle misure e impossibilita' pratica di delimitare i due strumenti, prevalenza dei diritti fondamentali (pp. 11-12); T-362/2014 citata per esteso (pp. 12-13); precedenti della Sala STC 7630/2016, 9813/2016, 15985/2017 (p. 13); CANONICAL conexidad_diritti (p. 13): diritti fondamentali determinati dall'ecosistema, sujetos de derecho e seres sintientes, famiglia, societa', Stato; il deterioro come atentado grave (pp. 13-14); CANONICAL tutela_conexidad_collettivo (p. 14): procedencia excepcional dimostrata."
    sonde: [tutela_conexidad_collettivo, conexidad_diritti]
    anelli: [a, b]
    verbatim: "están ligados sustancialmente y determinados por el entorno y el ecosistema"

  - pronuncia: corte_suprema_2018
    paragrafo: "3"
    documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
    pagina: 14-15
    sintesi: "Art. 86 C.P.: chiunque puo' chiedere la protezione immediata; la maggiore eta' non e' un limite; i dodici minori nominati agiscono in causa propria, non in rappresentanza di terzi, perche' la degradazione dell'ambiente per la deforestazione della selva amazzonica ricade su di loro."
    sonde: [equita_intergenerazionale_violata, tutela_conexidad_collettivo]
    anelli: [a, c]
    verbatim: "se encuentran legitimados para actuar en causa propia"

  - pronuncia: corte_suprema_2018
    paragrafo: "4"
    documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
    pagina: 15-16
    sintesi: "Diagnosi: le questioni ambientali in cima all'agenda internazionale; minaccia alla possibilita' di esistenza dell'essere umano; fenomeni estremi; esaurimento delle risorse, colonizzazione irrazionale dei boschi; l'umanita' responsabile per un «modelo antropocéntrico y egoísta» con tre tratti (demografia, consumismo, sfruttamento)."
    sonde: [ecocentrico_antropico]
    anelli: [b]
    verbatim: "la adopción de un modelo antropocéntrico y egoísta"

  - pronuncia: corte_suprema_2018
    paragrafo: "5"
    documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
    pagina: 16-17
    sintesi: "Coscienza dell'obbligo di cambiare: movimenti per una societa' «ecocéntrica antrópica» che superi la «homomensura» antropocentrica (nota 7, Protagora) e includa l'ambiente nell'idea di progresso e nel desarrollo sostenible, con C-389/2016 citata (esclusa di provenienza)."
    sonde: [ecocentrico_antropico, generazioni_future_obbligo]
    anelli: [b]
    verbatim: "Hay surgimiento de movimientos favorables a una nueva ideología de sociedad"

  - pronuncia: corte_suprema_2018
    paragrafo: "5.1"
    documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
    pagina: 17-18
    sintesi: "Rischi planetari (Rodríguez Palop): la giurisdizione deve riconoscere diritti che, pur orientati a interessi collettivi, difendono i diritti essenziali della persona; lo Stato costituzionale e il rispetto dell'altro: ogni atto che danneggia la natura lede i diritti fondamentali personali (p. 17); dall'etica privata all'etica pubblica e i diritti ridefiniti come «derechos-deberes», Peces-Barba citato per esteso (esclusa di provenienza, p. 18)."
    sonde: [conexidad_diritti, ecocentrico_antropico]
    anelli: [b]
    verbatim: "todos los actos que impactan negativamente la naturaleza, implican indiscutiblemente menoscabo de los derechos fundamentales personales"

  - pronuncia: corte_suprema_2018
    paragrafo: "5.2"
    documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
    pagina: 18-19
    sintesi: "L'ambito di protezione e' ogni persona ma anche l'altro: le altre persone del pianeta, le altre specie animali e vegetali, e i soggetti non ancora nati, che meritano le stesse condizioni ambientali vissute da noi; Rodríguez Palop sulla solidaridad diacrónica citata per esteso (esclusa di provenienza, p. 19)."
    sonde: [generazioni_future_obbligo]
    anelli: [b]
    verbatim: "incluye a los sujetos aun no nacidos, quienes merecen disfrutar de las mismas condiciones medioambientales vividas por nosotros"

  - pronuncia: corte_suprema_2018
    paragrafo: "5.3"
    documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
    pagina: 19-21
    sintesi: "I diritti ambientali delle generazioni future si fondano sul dovere etico della solidarieta' della specie e sul valore intrinseco della natura (p. 19); i beni naturali sono condivisi con i discendenti, «tributarios, destinatarios y titulares» (p. 20); solidarieta' e ambientalismo si identificano; CANONICAL ecocentrico_antropico (pp. 20-21): il secondo fondamento trascende l'antropocentrismo e pone l'uomo a la par dell'ecosistema; solidarieta' diretta con la natura (Jaquenod, p. 21); CANONICAL generazioni_future_obbligo (p. 21): relación jurídica obligatoria, prestación de no-hacer, limitazione della liberta' dei presenti, nuovi carichi di cura (chiusa da Kormody)."
    sonde: [generazioni_future_obbligo, ecocentrico_antropico]
    anelli: [b]
    verbatim: "una limitación de la libertad de acción de las generaciones presentes"

  - pronuncia: corte_suprema_2018
    paragrafo: "6-6.5"
    documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
    pagina: 22-25
    sintesi: "«orden público ecológico mundial» di hard e soft law a tutela dei diritti soggettivi delle generazioni presenti e future (p. 22): PIDESC art. 12 (6.1); ENMOD 1976 e Protocollo I artt. 35.3 e 55 (6.2); Stoccolma 1972 citata per esteso, proclami 6-9 (6.3, pp. 23-24: esclusa di provenienza); Rio 1992 e i suoi strumenti (6.4, pp. 24-25); Parigi 2015, chiamata «Convención Marco sobre el Cambio Climático de París de 2015», con la cooperazione citata (6.5, p. 25: esclusa di provenienza)."
    sonde: [generazioni_future_obbligo, deforestazione_clima_diritti]
    anelli: []
    verbatim: "constituye un orden público ecológico mundial y sirve de criterio orientador para las legislaciones patrias"

  - pronuncia: corte_suprema_2018
    paragrafo: "7"
    documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
    pagina: 26-29
    sintesi: "«orden público ecológico nacional» della Costituzione del 1991: elenco degli articoli (1, 8, 49, 58, 63, 67, 79, 80, 88, 95-8, 215, 226, ecc.) (p. 26); la Corte Constitucional e la «Constitución Ecológica» (p. 27); T-411/1992 citata per esteso: problema di sopravvivenza, patrimonio naturale delle generaciones venideras, «El hombre no es el amo omnipotente del universo» (pp. 27-28: escluse di provenienza); C-431/2000 citata per esteso: ambiente indispensabile alla sopravvivenza delle generazioni future, doveri correlativi dello Stato (pp. 28-29: esclusa di provenienza)."
    sonde: [conexidad_diritti, generazioni_future_obbligo, ecocentrico_antropico]
    anelli: [b]
    verbatim: "pertenece a las personas que en él viven, pero también a las generaciones venideras"

  - pronuncia: corte_suprema_2018
    paragrafo: "8"
    documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
    pagina: 29-30
    sintesi: "Artt. 79 e 80 C.P. citati per esteso (esclusa di provenienza); i diritti relativi all'ambiente sono di natura fondamentale e collettiva; C-449/2015 (reiterata in C-389/2016) sulla «triple dimensión» dell'ambiente sano: principio, diritto fondamentale e collettivo, obbligo (p. 30: esclusa di provenienza)."
    sonde: [conexidad_diritti]
    anelli: [b]
    verbatim: "Todas las personas tienen derecho a gozar de un ambiente sano"

  - pronuncia: corte_suprema_2018
    paragrafo: "9"
    documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
    pagina: 30
    sintesi: "Ribadita la procedibilita' della tutela, azione residuale ed eccezionale, per conexidad dell'ambiente sano con vita, salute, dignita'; la situazione e' pienamente provata e colpisce direttamente diritti fondamentali individuali dei ricorrenti e di tutti i colombiani; ne segue l'inefficacia dell'acción popular."
    sonde: [tutela_conexidad_collettivo, conexidad_diritti]
    anelli: [a]
    verbatim: "ello permite concluir la ineficacia de la acción popular"

  - pronuncia: corte_suprema_2018
    paragrafo: "10"
    documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
    pagina: 30-32
    sintesi: "La conservazione dell'Amazzonia e' obbligo nazionale e globale, «pulmón del mundo» (p. 30); dati OTCA su superficie, acqua, specie (p. 31); Tratado de Cooperación Amazónica; l'impegno colombiano a Parigi di ridurre la deforestazione, iniziativa Colombia Sostenible e Fondo Visión Amazonía con cinque pilastri (pp. 31-32)."
    sonde: [natura_soggetto_diritti, deforestazione_clima_diritti]
    anelli: [e]
    verbatim: "La conservación de la Amazonía es una obligación nacional y global"

  - pronuncia: corte_suprema_2018
    paragrafo: "11"
    documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
    pagina: 32-35
    sintesi: "La Corte esamina se la lesione del diritto collettivo trascenda in violazione dei diritti fondamentali (pp. 32-33); i ricorrenti individuano quattordici municipi; la domanda sul nexo causal fra cambiamento climatico da riduzione della copertura forestale e danni a salute, vita degna, acqua, alimentazione (p. 33); dalla EICDGB e dall'IDEAM: +44% fra 2015 e 2016, da 56.952 a 70.074 ettari (p. 34); le sei cause; CANONICAL deforestazione_clima_diritti (pp. 34-35): perjuicio inminente y grave ai ricorrenti e a tutti gli abitanti, presenti e future, per emissione incontrollata di CO2, effetto serra, ecosistemi, acqua, suolo; minaccia a flora e fauna (57% delle specie arboree); i tre principi: precauzione, equita' intergenerazionale, solidarieta' (p. 35)."
    sonde: [deforestazione_clima_diritti, equita_intergenerazionale_violata]
    anelli: [c]
    verbatim: "un perjuicio inminente y grave para los niños, adolescentes y adultos que acuden a esta acción"

  - pronuncia: corte_suprema_2018
    paragrafo: "11.1"
    documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
    pagina: 35-37
    sintesi: "Precauzione: non c'e' dubbio sul pericolo di danno, con gli scenari IDEAM di temperatura (+0,7-1,1 gradi 2011-2040; 1,4-1,7 2041-2070; fino a 2,7 2071-2100); rottura della connettivita' ecosistemica Amazzonia-Ande; precipitazioni in aumento e in deficit; irreversibilita' e certezza scientifica evidenti, perche' i GEI da deforestazione sono il 36% del settore forestale."
    sonde: [deforestazione_clima_diritti]
    anelli: [c]
    verbatim: "no cabe duda que existe peligro de daño"

  - pronuncia: corte_suprema_2018
    paragrafo: "11.2"
    documento: future-generations-v-ministry-of-the-environment-and-others-decision_7519
    pagina: 37
    sintesi: "CANONICAL equita_intergenerazionale_violata: la trasgressione del criterio di equita' intergenerazionale e' ovvia, perche' la temperatura salira' di 1,6 gradi nel 2041 e fino a 2,14 nel 2071, e le generazioni future, fra cui i minori che propongono la tutela, saranno direttamente colpite, a meno che le presenti riducano a zero la deforestazione."
    sonde: [equita_intergenerazionale_violata, generazioni_future_obbligo]
    anelli: [c]
    verbatim: "es obvia su transgresión"

  - pronuncia: corte_suprema_2018
