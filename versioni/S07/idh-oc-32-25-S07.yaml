nota_analitica:
  spartiacque_possibili: [2025-07-03, 2025-07-23]
  effetto_atteso: >
    Ricezione oggi concentrata in un solo procedimento (le memorie alla Corte africana), che cita il
    parere per paragrafo, quasi sempre accanto alla CIG del 23/7/2025, e per lo piu' su parti NON proprie
    (fatti, OC-23/17 ripreso, gruppi vulnerabili): 356 rinvii su 511 non toccano nessuna sonda. Le sonde
    distintive attese fuori di li': diligenza_rafforzata (gia' 3 casi), valutazione_impatto_climatico
    (Corte EDU, Greenpeace Nordic, per trascrizione), clima_sano_autonomo. prova_agevolata e
    mobilita_climatica sono scommesse sul contenzioso futuro: oggi zero rinvii fuori dalla Corte africana.
    Da verificare, non da presupporre.

# ── S07 (04/10/2026): RICERCA PER NOME CON I GRUPPI CHE NON ATTRAVERSANO LE NOTE, RETE DESCRITTIVA, DEDUPLICA PER PAGINA ──
# Tutto quello che sta sopra e' il file S05 identico. Qui due chiavi nuove, lette da tools/cerca_s07.py e
# tools/rete_descrittiva.py (gli altri strumenti non le leggono):
#   forme_s07_aggiunte  forme semplici che mancavano, cercate come le altre forme (misura del 04/10/2026, audit/forme);
#   rete_descrittiva    le regole della RETE DESCRITTIVA: le pagine che citano la pronuncia senza nessuna forma
#                       dichiarata («BVerfG, a.a.O.», la corte con l'anno e il clima, la data...). Una regola e' un'ancora
#                       (espressione regolare, maiuscole e minuscole uguali) piu' le parole che devono stare a meno di
#                       `finestra` caratteri (`con`, tutte); `escludi` toglie la corrispondenza se compare nella stessa
#                       finestra; `solo_atti_col_nome` la tiene solo negli atti che citano gia' il caso col nome. Le
#                       espressioni si applicano al testo normalizzato (textnorm: sillabazione tolta, spazi uniti) e la
#                       posizione torna quella del file. Fuori: gli atti del procedimento stesso (escludi_case_id,
#                       atti_del_procedimento_altrove), gli atti datati prima della pronuncia, le pagine dove il caso e'
#                       gia' nominato o ha gia' una riga (come nella misura). Le righe hanno proposto_rete «descrittiva».
#                       Misura del 04/10: 331 pagine senza nessuna forma, ~250 citazioni vere (audit/forme).
