      and Human Rights» dentro questa stringa non conta.
  - forma: Request for an Advisory Opinion on Climate Emergency and Human Rights
    ragione: Idem, senza articolo (cosi' nel corpus, per es. Álvarez c. Perù).
  - forma: Request for Advisory Opinion OC-32
    ragione: Idem; e' come la Corte stessa chiamava la procedura prima del parere (in inglese, nota 4 della traduzione).
  - forma: Solicitud de Opinión Consultiva OC-32
    ragione: Idem in spagnolo; e' la forma della nota 4 del parere stesso (p. 7) e delle risoluzioni di convocazione.
  - forma: Solicitud de Opinión Consultiva sobre la Emergencia Climática
    ragione: Idem in spagnolo (titolo della domanda, other_d40b).
  - forma: Urgence climatique et droits de l'homme
    ragione_nota: 'RIAMMESSA in S05 (02/10/2026, misura delle perdite della ricerca per nome), vedi le forme.'
    ragione_prima_di_S05: >
      Titolo dell'avis della Commission nationale consultative des droits de l'homme (CNCDH, 27/5/2021),
      citato negli atti francesi contro BNP Paribas e TotalEnergies e dalla commissione coreana. Stesso
      titolo, altro parere.
  - forma: Series A No. 32
    ragione: >
      Collide con Corte EDU, Airey c. Irlanda (1979), «Series A no. 32», citata nel corpus. Vale solo in
      composizione con 2025 o con un codice («Series A No 32 (29 May 2025)»).
  - forma: Serie A No. 32
    ragione: Idem in spagnolo.
  - forma: Obligations of States in respect of Climate Change
    ragione: "PARERE DIVERSO: Corte internazionale di giustizia, 23/7/2025. Citato quasi sempre accanto a questo («ICJ Climate AO, para. 136; IACtHR OC-32/25, para. 320»)."
  - forma: Climate Change and International Law
    ragione: "PARERE DIVERSO: ITLOS, 21/5/2024."
  - forma: OC-31/25
    ragione: Altro parere della Corte IDH del 2025 (diritto alla cura); il numero vicino genera refusi.
  - forma: Advisory Opinion IACHR
    ragione: >
      Forma breve definita con «hereafter» nella sentenza Bonaire (Rechtbank Den Haag, 28/1/2026:
      «Advisory Opinion IACHR, §327»), unica occorrenza nel corpus. Altrove puo' indicare OC-23/17 o un
      altro parere della Corte IDH: esclusa (decisione del PI, 01/10/2026). Il rinvio Bonaire al § 327 si perde.
  - forma: Opinión Consultiva
    ragione: Generica; ogni parere della Corte IDH.
  - forma: Advisory Opinion
    ragione: Generica; anche CIG, ITLOS, Corte africana.
  - forma: Corte Interamericana
    ragione: La corte, non il parere.
  - forma: Inter-American Court of Human Rights
    ragione: Idem.
  - forma: IACtHR
    ragione: Idem.
  - forma: emergencia climática
    ragione: Locuzione comune; il titolo vale solo intero.
  - forma: climate emergency
    ragione: Idem.

falso_positivo_dichiarato:
  tipo: riassunti Sabin, rinvii interni, catene di citazioni
  nota: >
    (1) Il `riassunto_caso` di altri casi nomina il parere: lo script cerca solo nel corpo. (2) Rinvii
    interni del documento citante: la sentenza Greenpeace Nordic scrive «Advisory Opinion OC-32/25 on Climate
    emergency and human rights (see paragraph 132 above)», dove 132 e' un paragrafo della sentenza stessa. (3) Citazione in catena
    con la CIG: «ICJ Climate AO, paras. 136; IACtHR OC-32/25, paras. 141–174» (il rinvio della CIG
    precede quello della Corte IDH). (4) «Concurring Opinion, para. 83» e «operative para 3» non sono
    paragrafi del parere. Lo script gestisce i quattro casi; restano esclusi i rinvii «ibid., para. 183».

# ── Sonde (semantic queries) ────────────────────────────────────────────────────────────────
# SERIE APPROVATA DAL PI il 01/10/2026: otto sonde DISTINTIVE. Una sonda e' un principio PROPRIO di
# questo parere, tale che chi lo riprende sia riconoscibile come debitore dell'OC-32/25; non e' una
# copertura dei capitoli. Le affermazioni che ogni corte o trattato fa (cooperazione, adattamento come
# obbligo, uguaglianza, ambiente sano come diritto autonomo) non sono sonde. Le sette sonde della prima
# proposta sono superate.
# Nessuna sonda contiene il nome del parere, il codice, «Inter-American» o il nome della Corte.
# Intervalli verificati sul testo spagnolo e ristretti ai paragrafi che ENUNCIANO l'elemento; disgiunti.
# Vocabolario separato: «reinforced/enhanced due diligence» solo nella 4; «healthy climate» solo nella
# 1; «peremptory» solo nella 2; «subject of rights» solo nella 3; «climate impact assessment» solo nella
# 5; «traditional knowledge» e «disinformation» solo nella 6; «displaced/refoulement» solo nella 7;
# «causation/burden of proof» solo nella 8.
semantic_queries:
- id: idh-oc-32-25.clima_sano_autonomo
  titolo: 'Il diritto a un clima sano come diritto autonomo, derivato dall''ambiente sano ma distinto, con una dimensione
    collettiva che protegge l''umanita'' presente e futura e la Natura'
  testo: 'There is a human right to a healthy climate, derived from but independent of the right to a healthy environment,
    protecting a climate system free from dangerous anthropogenic interference; in its collective dimension it belongs
    indivisibly to present and future humanity and to other species.

    '
  probe_es: 'Existe un derecho humano a un clima sano, derivado del derecho a un ambiente sano pero independiente
    de él, que protege un sistema climático libre de interferencias antropogénicas peligrosas y, en su dimensión
    colectiva, a la humanidad presente y futura y a las demás especies.

    '
  elemento_proprio: 'Il CLIMA sano come diritto a se'', con «una base con entidad propia» (§ 300): prima corte a riconoscerlo.
    Non e'' l''ambiente sano come diritto autonomo, che e'' di OC-23/17 (§§ 62-64) e che il parere riassume ai §§ 270-274;
    non e'' il dovere oggettivo verso le generazioni future di Neubauer, ne'' l''art. 8 CEDU di KlimaSeniorinnen; la CIG
    (23/7/2025, § 393) parla di ambiente pulito, sano e sostenibile come precondizione dei diritti, non di un diritto al clima.
    L''equita'' intergenerazionale entra solo dove e'' parte del diritto: la titolarita'' collettiva indivisibile dell''umanita''
    presente e futura (§§ 302, 311-313). I §§ 305-310 (equita'' intergenerazionale come principio, da La Oroya, UNFCCC,
    Parigi, CIG, ITLOS, CEDU e corti nazionali; ripartizione degli oneri fra generazioni) restano fuori: chi li riprende
    puo'' prenderli da quelle fonti.'
  paragrafi: párrs. 297-304, 311-316
  punto_resolutivo: 9 (cinco votos contra dos, en parte)
  evidenza: 'rinvii 16, documenti 9, casi 3 (senza la Corte africana: 2 rinvii, 2 documenti, 2 casi)'
  esclusione_di_provenienza: 'Non OC-23/17, non la risoluzione 76/300 dell''Assemblea generale, non le costituzioni
    nazionali che riconoscono l''ambiente sano, non La Oroya (aria e acqua pulite). Conta solo il diritto al CLIMA come
    diritto distinto, o la sua titolarita'' collettiva estesa a umanita'' futura e Natura.'
  canonical: 'Ante esta situación, la Corte considera que el reconocimiento de un derecho humano a un clima sano como
    un derecho independiente —derivado del derecho a un ambiente sano— responde a la necesidad de dotar al orden
    jurídico interamericano de una base con entidad propia, que permita delimitar con claridad las obligaciones
    estatales específicas frente a la crisis climática y exigir su cumplimiento de manera autónoma respecto de otros
    deberes vinculados a la protección ambiental.'
  canonical_paragrafo: párr. 300
  canonical_pagina: 110
  canonical_pagina_en: 104
  canonical_documento: request-for-an-advisory-opinion-on-the-scope-of-the-state-obligations-for-responding-to-the-climate-emergency-decision_28df
  canonical_bis: 'En su esfera colectiva, este derecho protege el interés colectivo de las generaciones presentes y
    futuras de seres humanos y de otras especies a mantener un sistema climático apto para asegurar su bienestar
    y el equilibrio entre ellas, frente a las graves amenazas existenciales derivadas de los efectos de la emergencia
    climática.'
  canonical_bis_paragrafo: párr. 302
  canonical_bis_pagina: 111
  canonical_bis_pagina_en: 105
- id: idh-oc-32-25.jus_cogens_dano_irreversible
  titolo: 'Jus cogens: il divieto imperativo di condotte antropiche che danneggiano in modo irreversibile l''equilibrio
    dell''ecosistema comune'
  testo: 'The prohibition of anthropogenic conduct that irreversibly harms the vital balance of the common ecosystem
    on which the life of all species depends is a peremptory norm of general international law, admitting no agreement
    to the contrary, because preserving that balance is a precondition of every other fundamental right.

    '
  probe_es: 'La prohibición de conductas antropogénicas que afectan de forma irreversible el equilibrio vital del
    ecosistema común que hace posible la vida de las especies es una norma imperativa de jus cogens, que no admite
    acuerdo en contrario.

    '
  elemento_proprio: 'La qualifica di JUS COGENS, fondata sul principio di effettivita'' (§§ 292, 294) e sul legame di
    dipendenza con vita, integrita'', salute e non discriminazione (§ 293). Nessun''altra fonte del corpus lo afferma:
    la CIG (23/7/2025, § 440) parla di obblighi ERGA OMNES per il sistema climatico come bene comune; OC-23/17 non
    qualifica nulla come imperativo in materia ambientale; le proposte di un crimine di ecocidio sono diritto penale,
    non norme imperative. Votato 4 a 3.'
  paragrafi: párrs. 287-294
  punto_resolutivo: 8 (cuatro votos contra tres)
  evidenza: 'rinvii 26, documenti 8, casi 1 (senza la Corte africana: 0)'
  esclusione_di_provenienza: 'Non la CIG (erga omnes, § 440), non il progetto di conclusioni della Commissione del
    diritto internazionale sullo jus cogens (2022), non le campagne sull''ecocidio. Conta il carattere imperativo
    del divieto di danno irreversibile all''ecosistema comune, o l''attribuzione.'
  canonical: 'Las prohibiciones derivadas de la obligación de preservar nuestro ecosistema común, como precondición
    al goce de otros derechos ya identificados como fundamentales, son de una trascendencia tal que no deben admitir
    acuerdo en contrario, por lo que tienen el carácter de jus cogens.'
  canonical_paragrafo: párr. 291
  canonical_pagina: 108
  canonical_pagina_en: 102
  canonical_documento: request-for-an-advisory-opinion-on-the-scope-of-the-state-obligations-for-responding-to-the-climate-emergency-decision_28df
- id: idh-oc-32-25.natura_soggetto_diritti
  titolo: La Natura e i suoi componenti come soggetti di diritti nel sistema interamericano
  testo: 'Recognising Nature and its components as subjects of rights is a development compatible with, and internal
    to, the regional human rights corpus: it overcomes the view of Nature as mere property or exploitable resource
    and strengthens the long-term protection of the integrity and functioning of ecosystems.

    '
  probe_es: 'El reconocimiento de la Naturaleza y sus componentes como sujetos de derechos es compatible con la Convención
    Americana y no introduce un contenido ajeno al corpus iuris interamericano: supera su concepción como objeto de
    propiedad o recurso explotable.

    '
  elemento_proprio: 'Che una corte regionale dei diritti umani collochi il riconoscimento DENTRO il proprio diritto:
    compatibile con gli artt. 2 e 26 CADH e con il principio di progressivita'' (§ 281), «manifestación contemporánea»
    dell''interdipendenza fra diritti umani e ambiente, nessun contenuto «ajeno al corpus iuris interamericano»
    (§ 282), con l''obbligo positivo di proteggere, restaurare e rigenerare (§ 283). Gia'' altrove, e quindi non proprio:
    Costituzione dell''Ecuador, T-622/2016 (Atrato), STC4360-2018 (Amazzonia), Te Awa Tupua, leggi municipali brasiliane.
    I §§ 284-286, che passano in rassegna proprio quegli strumenti e quella tendenza, sono lasciati senza sonda:
    chi li riprende puo'' prenderli dalle fonti. Votato 4 a 3.'
  paragrafi: párrs. 279-283
  punto_resolutivo: 7 (cuatro votos contra tres)
  evidenza: 'rinvii 8, documenti 3, casi 1 (senza la Corte africana: 0)'
  esclusione_di_provenienza: 'Non la Costituzione dell''Ecuador (art. 71), non la Corte Constitucional colombiana
    (T-622/2016), non la Corte Suprema colombiana (STC4360-2018), non Te Awa Tupua, non la Carta mondiale della natura
    o la CBD. Conta il riconoscimento come sviluppo del diritto interamericano, o l''attribuzione.'
  canonical: 'Este reconocimiento permite superar concepciones jurídicas heredadas, que concebían a la Naturaleza
    exclusivamente como objeto de propiedad o recurso explotable. Reconocer a la Naturaleza como sujeto de derechos
    implica también visibilizar su rol estructural en el equilibrio vital de las condiciones que hacen posible la
    habitabilidad del planeta.'
  canonical_paragrafo: párr. 280
  canonical_pagina: 102
  canonical_pagina_en: 97
  canonical_documento: request-for-an-advisory-opinion-on-the-scope-of-the-state-obligations-for-responding-to-the-climate-emergency-decision_28df
- id: idh-oc-32-25.diligenza_rafforzata
  titolo: 'La «debida diligencia reforzada»: lo standard rafforzato di prevenzione nell''emergenza climatica'
  testo: 'Given the extreme gravity of climate impacts, the information available and the urgency of effective measures,
    States must act with reinforced (enhanced) due diligence to prevent human rights violations, requiring exhaustive
    risk identification and proactive, ambitious preventive action against the worst climate scenarios.

    '
  probe_es: 'Ante la extrema gravedad de los impactos climáticos y la urgencia de medidas eficaces, los Estados deben
    actuar con una debida diligencia reforzada para cumplir con el deber de prevención derivado de la obligación de
    garantía.

    '
  elemento_proprio: 'La formula propria «debida diligencia reforzada» (inglese della Corte: «enhanced due diligence»;
    altra versione: «reinforced»), agganciata all''OBBLIGO DI GARANZIA dei diritti umani (§ 233) e declinata nei suoi
    contenuti (§ 236). Non e'' la due diligence «apropiado y proporcional» al rischio di OC-23/17 (§ 142, ripresa al
    § 232), ne'' la «stringent due diligence» dell''ITLOS (21/5/2024) e della CIG (23/7/2025, §§ 138, 246), che sono
    standard interstatali di prevenzione del danno, non di garanzia dei diritti. I §§ 224-230 (garanzia, prevenzione,
    precauzione «aún en ausencia de certeza científica», obblighi minimi di regolare e supervisionare) ripetono
    OC-23/17 e restano fuori.'
  paragrafi: párrs. 231-237
  punto_resolutivo: 3
  evidenza: 'rinvii 29, documenti 9, casi 4 (senza la Corte africana: 7 rinvii, 3 documenti, 3 casi)'
  esclusione_di_provenienza: 'Non OC-23/17, non ITLOS, non CIG. Conta la qualifica RAFFORZATA della diligenza, o l''attribuzione.'
  canonical: 'Teniendo en cuenta, en primer lugar, la información existente y aquella que debe ser producida por el
    Estado a propósito de la emergencia climática (infra párrs. 501-518); en segundo lugar, la extrema gravedad
    de los impactos climáticos; y, finalmente, la urgencia de medidas eficaces para evitar afectaciones irreparables
    para las personas (supra párrs. 185-194), la Corte estima que los Estados deben actuar con una debida diligencia
    reforzada para cumplir con el deber de prevención derivado de la obligación de garantía de los derechos protegidos
    por la Convención Americana en el contexto de la emergencia climática.'
  canonical_paragrafo: párr. 233
  canonical_pagina: 88
  canonical_pagina_en: 84
  canonical_documento: request-for-an-advisory-opinion-on-the-scope-of-the-state-obligations-for-responding-to-the-climate-emergency-decision_28df
- id: idh-oc-32-25.valutazione_impatto_climatico
  titolo: 'Valutazione d''impatto climatico obbligatoria per i progetti emissivi, vigilanza stretta e obblighi piu''
    severi per chi emette di piu'''
  testo: 'Projects or activities that risk generating significant greenhouse gas emissions must undergo a climate impact
    assessment as part of environmental impact assessment, and States must strictly supervise emitting activities,
    imposing stricter duties and closer oversight on the firms whose current and historical emissions are largest.

    '
  probe_es: 'Los proyectos o actividades que impliquen el riesgo de generar emisiones significativas de GEI deben ser
    sometidos a una evaluación de impacto climático, y los Estados deben supervisar y fiscalizar en forma estricta
    las actividades generadoras de emisiones.

    '
  elemento_proprio: 'L''impatto sul SISTEMA CLIMATICO come contenuto obbligatorio della VIA e la «evaluación de impacto
    climático» come obbligo autonomo (§ 359), con contenuto minimo (§ 361) e greenwashing (§ 360); la vigilanza STRETTA
    delle attivita'' emissive, come minimo combustibili fossili, cemento, agroindustria (§ 353); obblighi e vigilanza
    piu'' severi per le imprese secondo il contributo ATTUALE E STORICO alle emissioni (§§ 350, 353). La VIA in se''
    e'' di OC-23/17 (§§ 156-170) e del diritto ambientale generale;
    l''ITLOS (§ 367) chiede la VIA per l''inquinamento marino da gas serra. DECISIONE sui §§ 345-351: entra solo il
    § 350 (obblighi differenziati per contributo storico delle imprese, il paragrafo piu'' citato del parere). I §§
    345-349 ripetono i Principi guida ONU e il Gruppo di lavoro ONU sulla due diligence d''impresa, il § 351 chiede
    di rivedere i trattati di investimento: non distintivi, senza sonda.'
  paragrafi: párrs. 350, 352-363
  punto_resolutivo: 10 (ii) e (iii); il § 350 sta in 10 (i)
  evidenza: 'rinvii 48, documenti 8, casi 1 (senza la Corte africana: 0 nel conteggio); a mano: la Corte EDU, Greenpeace Nordic (28/10/2025, §§ 134-135, 322), trascrive i §§ 353, 358-359 e ne riprende la valutazione d''impatto climatico'
  esclusione_di_provenienza: 'Non OC-23/17 (VIA, supervisione e fiscalizzazione), non ITLOS (§ 367), non la Corte
    EFTA (2025, effetti indiretti nella VIA), non la Corte suprema del Regno Unito in R (Finch) v Surrey County
    Council [2024] UKSC 20 (emissioni a valle). Conta la valutazione d''impatto CLIMATICO come obbligo derivato dai diritti
    umani, o gli obblighi differenziati per contributo storico delle imprese, o l''attribuzione.'
  canonical: 'En particular, aquellos proyectos o actividades que impliquen el riesgo de generar emisiones significativas
    de GEI deben ser sometidos a una evaluación de impacto climático.'
  canonical_paragrafo: párr. 359
  canonical_pagina: 127
  canonical_pagina_en: 120
  canonical_documento: request-for-an-advisory-opinion-on-the-scope-of-the-state-obligations-for-responding-to-the-climate-emergency-decision_28df
  canonical_bis: 'La Corte considera, en consecuencia, que los Estados deben establecer obligaciones diferenciadas
    en materia de acción climática basadas en la contribución actual e histórica de las empresas al cambio climático
    e imponer deberes más estrictos a las empresas que desarrollan actividades generadoras de mayores emisiones de
    GEI.'
  canonical_bis_paragrafo: párr. 350
  canonical_bis_pagina: 125
  canonical_bis_pagina_en: 118
- id: idh-oc-32-25.scienza_disinformazione
  titolo: 'Il diritto alla scienza esteso ai saperi locali, tradizionali e indigeni, e l''obbligo di contrastare la
    disinformazione climatica'
  testo: 'By evolutive interpretation, the right to science covers not only the benefits of science in the strict sense
    but also those of local, traditional and indigenous knowledge, and States must adopt progressive measures to counter
    climate disinformation while respecting freedom of expression and avoiding prior censorship.

    '
  probe_es: 'El derecho a la ciencia comprende también el acceso a los beneficios de los saberes locales, tradicionales
    e indígenas, y los Estados tienen la obligación de adoptar medidas progresivas para contrarrestar la desinformación
    en materia climática.

    '
  elemento_proprio: 'Due mosse proprie. (1) L''estensione, per interpretazione evolutiva dell''art. 14 del Protocollo
    di San Salvador, del diritto alla scienza ai saperi locali, tradizionali e indigeni (§§ 477, 483), con il diritto
    di tutti ai benefici di misure basate sulla migliore scienza E su quei saperi (§ 478) e gli obblighi di proteggerli
    e raccoglierli (§ 484). Il diritto alla scienza in se'' (§§ 471-475) e'' del PIDESC e del Commento generale 25: fuori.
    L''art. 7.5 dell''Accordo di Parigi menziona i saperi tradizionali per l''adattamento, ma non come contenuto di un
    diritto umano. (2) L''obbligo di adottare misure progressive contro la disinformazione climatica (§ 527), dedotto
    dall''art. 13 CADH, con il divieto per lo Stato di diffondere informazione non sostenuta dalla scienza o dai saperi
    (§ 525) e il limite della censura preventiva. I §§ 485-487 (criteri della migliore scienza disponibile, l''IPCC
    «al tenor de lo considerado por otros tribunales internacionales») restano fuori.'
  paragrafi: párrs. 476-484, 524-529
  punto_resolutivo: 14 (seis votos contra uno, en parte) e 15 (iii)
  evidenza: 'rinvii 22, documenti 5, casi 1 (senza la Corte africana: 0)'
  esclusione_di_provenienza: 'Non il PIDESC (art. 15) e il Commento generale 25 del Comitato DESC, non l''art. 7.5
    dell''Accordo di Parigi, non la Dichiarazione ONU sui diritti dei popoli indigeni, non il Patto per il Futuro (2024)
    sull''alfabetizzazione mediatica. Conta il diritto alla scienza come diritto che INCLUDE i saperi tradizionali, o
    l''obbligo di contrastare la disinformazione climatica come obbligo convenzionale.'
  canonical: 'Teniendo en cuenta el valor intrínseco y las características propias de cada tipo de saber, este Tribunal
    considera que, de acuerdo a una interpretación evolutiva, el “derecho a la ciencia” no solo comprende el acceso
    a beneficios que se deriven de la ciencia en sentido estricto, sino también, como lo indica el título del artículo
    14 del Protocolo de San Salvador, el acceso a la cultura o, más precisamente, a los beneficios que puedan derivarse
    de las formas de conocimiento relacionadas con ésta; es decir, de los saberes locales, tradicionales e indígenas.'
  canonical_paragrafo: párr. 477
  canonical_pagina: 174
  canonical_pagina_en: 163
  canonical_documento: request-for-an-advisory-opinion-on-the-scope-of-the-state-obligations-for-responding-to-the-climate-emergency-decision_28df
  canonical_bis: 'En línea con lo anterior, los Estados tienen la obligación de adoptar medidas progresivas para contrarrestar
    la desinformación en materia climática, con el fin de garantizar el acceso a la información y proteger los derechos
    sustantivos amenazados en el contexto de la emergencia climática.'
  canonical_bis_paragrafo: párr. 527
  canonical_bis_pagina: 191
  canonical_bis_pagina_en: 179
- id: idh-oc-32-25.mobilita_climatica
  titolo: 'Mobilita'' climatica: prevenzione dello sfollamento, ricollocazioni eccezionali, protezione complementare e
    non respingimento di chi attraversa le frontiere per effetto del cambiamento climatico'
  testo: 'States must give people displaced across international borders by climate change legal and humanitarian protection,
    through humanitarian visas, temporary stay or refugee-like status that shields them from refoulement, and must
    prevent forced displacement, allowing planned relocation only as an exceptional, last-resort measure.

    '
  probe_es: 'Los Estados deben garantizar la protección jurídica y humanitaria de las personas desplazadas a través
    de fronteras internacionales por los efectos del cambio climático, mediante visas humanitarias, permanencias temporales
    o el estatus de refugiado u otros similares que las protejan contra la devolución.

    '
  elemento_proprio: 'Prima pronuncia di una corte regionale che deduce dalla Convenzione (art. 22 CADH, artt. VIII
    e XXVII della Dichiarazione) obblighi verso chi si sposta per il clima: prevenire gli sfollamenti forzati (§ 422),
    ricollocazioni solo «en circunstancias excepcionales» (§ 429), e soprattutto un quadro normativo interno che dia
    protezione giuridica e umanitaria a chi attraversa una frontiera per gli effetti del cambiamento climatico, con
    categorie migratorie (visti umanitari, permanenze temporanee, status di rifugiato o simili) che diano «protección
    contra la devolución» (§ 433, p. 155). Gia'' altrove, e quindi non proprio: il Comitato diritti umani in Teitiota
    c. Nuova Zelanda (non respingimento in astratto), l''Iniziativa Nansen, il Patto globale sulle migrazioni, il Quadro
    di Sendai, i Principi guida sugli sfollati interni. I §§ 414-421 (richiamo dell''art. 22 e fatti sulla mobilita''
    climatica, da ACNUDH e ACNUR) restano fuori.'
  paragrafi: párrs. 422-434
  punto_resolutivo: 12
  evidenza: 'rinvii 8, documenti 5, casi 1 (senza la Corte africana: 0)'
  esclusione_di_provenienza: 'Non Teitiota c. Nuova Zelanda (Comitato diritti umani, 2020), non l''Iniziativa Nansen
    (2015), non il Patto globale per migrazioni sicure (2018), non la Corte Constitucional
    colombiana (T-123/2024, citata dal parere alla nota 723). Conta la protezione complementare e il non respingimento
    come obbligo convenzionale per lo sfollamento climatico transfrontaliero, o l''attribuzione.'
  canonical: 'La Corte estima que los Estados deben establecer un marco normativo adecuado que disponga a nivel interno
    mecanismos legales y/o administrativos efectivos para garantizar la protección jurídica y humanitaria de las personas
    desplazadas a través de fronteras internacionales debido a los efectos del cambio climático.'
  canonical_paragrafo: párr. 433
  canonical_pagina: 154
  canonical_pagina_en: 145
  canonical_documento: request-for-an-advisory-opinion-on-the-scope-of-the-state-obligations-for-responding-to-the-climate-emergency-decision_28df
- id: idh-oc-32-25.prova_agevolata
  titolo: 'Prova agevolata nelle cause climatiche: standard alternativi per il nesso causale, presunzione del nesso,
    inversione dell''onere della prova'
  testo: 'In climate litigation, courts should apply alternative evidentiary standards that establish causation from
    the generation or tolerance of significant risks and people''s exposure to them, without requiring a direct causal
    link, may presume the link between emissions and climate degradation, and may reverse the burden of proof.

    '
  probe_es: 'En los litigios climáticos deben adoptarse estándares probatorios alternativos que permitan establecer
    la relación causal sin exigir un nexo causal directo, con la posibilidad de presumir el nexo entre las emisiones
    de GEI y la degradación del sistema climático y de invertir la carga probatoria.

    '
  elemento_proprio: 'Standard probatori ALTERNATIVI per il nesso causale fondati sul rischio generato o tollerato e
    sull''esposizione, «sin exigir necesariamente la prueba de un nexo causal directo» (§ 553); la PRESUNZIONE del
    nesso fra emissioni e degradazione del sistema climatico, e fra questa e i rischi per persone e sistemi naturali
    (§ 553); l''inversione dell''onere della prova come misura per le asimmetrie fra le parti (§ 554); la prova satellitare
    (§ 555). L''Accordo di Escazú (art. 8.3) prevede l''inversione dell''onere e il carico dinamico della prova in
    materia ambientale, e le corti nazionali (Lliuya c. RWE in Germania; i tribunali brasiliani sull''onere
    invertito nel danno ambientale) hanno strade proprie: proprio del parere e'' la
    presunzione del nesso emissioni-sistema climatico-rischi, enunciata come standard per le cause climatiche.'
  paragrafi: párrs. 552-555
  punto_resolutivo: 17 (cuatro votos contra tres, en parte)
  evidenza: 'rinvii 0: nessun rinvio puntuale ai §§ 552-555 nel corpus al 01/10/2026'
  esclusione_di_provenienza: 'Non l''Accordo di Escazú (art. 8.3), non il principio brasiliano dell''inversione dell''onere
    nel danno ambientale, non la scienza dell''attribuzione citata da sola. Conta lo standard alternativo di causalita''
    o la presunzione del nesso nelle cause climatiche, o l''attribuzione.'
  canonical: 'En tal sentido, este Tribunal llama la atención sobre la posibilidad de presumir el nexo causal entre
    las emisiones de GEI y la degradación del sistema climático, así como aquel existente entre dicha degradación
    y los riesgos que esta genera sobre los sistemas naturales y las personas.'
  canonical_paragrafo: párr. 553
  canonical_pagina: 200
  canonical_pagina_en: 187
  canonical_documento: request-for-an-advisory-opinion-on-the-scope-of-the-state-obligations-for-responding-to-the-climate-emergency-decision_28df
  canonical_bis: 'Ello requiere una valoración particularizada de las posibles asimetrías entre las partes y la adopción
    de medidas adecuadas —como la inversión de la carga probatoria— que permitan garantizar el acceso efectivo a la
    justicia.'
  canonical_bis_paragrafo: párr. 554
  canonical_bis_pagina: 200
  canonical_bis_pagina_en: 187

