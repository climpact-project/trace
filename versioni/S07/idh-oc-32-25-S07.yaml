politica_formulazioni:
  eseguita_per_default: testo
  probe_es: prova — eseguire una volta, misurare da sola, tenere solo se rende almeno quanto `testo`; e' la lingua del parere e di quasi tutti gli atti latinoamericani che lo citano (registro, 2)
  domande_contrarie: >
    Nessuna formulazione esclusa scritta in anticipo (come in neubauer-P05): le prime righe bocciate
    dai validatori diventeranno le domande contrarie. Le esclusioni di provenienza sono scritte per
    ogni sonda in `esclusione_di_provenienza`.

frasi_della_sentenza:
  eseguire_come_ricerca_separata: true
  cosa: i campi `canonical` e `canonical_bis` di ogni sonda, ciascuno come query autonoma
  mai: incollarli dentro `testo`
  nota: >
    Per questo parere la ricerca per frasi conta piu' del solito: gli atti latinoamericani lo citano
    trascrivendo paragrafi interi («Eis o teor do § 547 da OC-32/25»), in spagnolo o in una
    traduzione portoghese propria.

caso_ancora:
  posizione_nella_lista: null           # DA DECIDERE DAL PI: il parere non e' nella lista dei casi ancora [non verificato nel corpus]
  motivazione_selezione: >
    DA SCRIVERE DAL PI. Proposta dell'esecutore, NON decisa: primo parere di una corte regionale dei
    diritti umani interamente dedicato all'emergenza climatica; prima corte a riconoscere un diritto al
    clima sano distinto dall'ambiente sano; qualifica come jus cogens il divieto di danno irreversibile
    all'ecosistema comune; colloca la Natura soggetto di diritti nel diritto interamericano; conia la
    debida diligencia reforzada; rende obbligatoria la valutazione d'impatto climatico; estende il
    diritto alla scienza ai saperi tradizionali e impone di contrastare la disinformazione; protegge
    lo sfollamento climatico transfrontaliero; agevola la prova del nesso causale.
  famiglia_giuridica: sistema interamericano dei diritti umani, funzione consultiva (art. 64.1 CADH)
  data_prima_pronuncia: 2025-05-29
  data_ultima_pronuncia: 2025-05-29
  esito: parere reso (procedura consultiva, nessuna parte soccombente)
  caso_perso: non applicabile
  caso_di_controllo: false
  voti: >
    Unanimita' sulla competenza e sui punti 1-3, 5, 6, 11, 13, 15, 16, 18, 19. Quattro contro tre sul
    punto 7 (natura soggetto di diritti) e sul punto 8 (jus cogens): dissentono Hernández López, Sierra
    Porto, Pérez Goldberg. Cinque contro due, in parte, sul punto 9 (clima sano). Sei contro uno sui
    punti 4, 10, 12 e 14 (dissente, in tutto o in parte, Pérez Goldberg). Quattro contro tre, in parte,
    sui punti 17 (accesso alla giustizia) e 20 (gruppi vulnerabili). I voti separati (tre parzialmente
    dissenzienti, quattro concorrenti) non sono nel corpus [non verificato nel corpus].
  documenti_corpus_successivi_alla_decisione: null
  percorsi_di_lettura: >
    Due percorsi separati, come per gli altri casi: documenti che nominano il parere; corpus intero.
    ATTENZIONE: 490 dei 511 rinvii a paragrafo trovati il 01/10/2026 vengono da un solo procedimento,
    la richiesta di parere alla Corte africana (case_id
    request-for-an-advisory-opinion-on-the-human-rights-obligations-of-african-states-in-addressing-the-climate-crisis_2579).
    Ogni misura va data con e senza quel procedimento.

