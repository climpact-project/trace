# trattati, organi ONU), o perche' sono affermazioni generali che ogni corte fa. Rinvii a paragrafo del
# 01/10/2026, dopo la soglia; fra parentesi quelli fuori dal procedimento della Corte africana. Chi
# riprende questi paragrafi CITA il parere ma non ne riprende un elemento proprio.
