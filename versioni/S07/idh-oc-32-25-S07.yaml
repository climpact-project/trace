# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────────
# CASO CITATO — CORTE INTERAMERICANA DEI DIRITTI UMANI, PARERE CONSULTIVO OC-32/25
# «Emergencia Climática y Derechos Humanos», 29 maggio 2025, richiesto da Cile e Colombia.
# PROPOSTA per il PI, 1 ottobre 2026. Versione 2: le otto sonde sono quelle approvate
# dal PI il 01/10/2026 (principi DISTINTIVI del parere), verificate sul testo spagnolo; forme e intervalli
# restano da confermare.
#
# QUESTO FILE SOSTITUIRA' `cited-cases/oc-32-25.yaml` (v0, 19/09/2026), che aveva solo le forme e due
# difetti: `escludi_case_id` senza il suffisso `_fbcd` (non corrisponde al case_id del corpus, come era
# successo a Neubauer) e nessuna sonda. Il v0 resta dov'e' finche' il PI non approva; non e' stato toccato.
#
# STRUTTURA. Come `future-generations-P05.yaml` e `neubauer-P05.yaml`: identificativi, esclusione del
# fascicolo, date, fonte primaria, forme e forme escluse con la ragione, sonde (`semantic_queries`) con
# `testo` inglese, `probe_es` spagnolo, `paragrafi`, `canonical` verbatim dallo spagnolo.
#
# LINGUA. L'originale e' spagnolo («Redactada en español en San José, Costa Rica, el 29 de mayo de 2025»,
# p. 233): i canonical sono VERBATIM dallo spagnolo (`decision_28df`), con i soli spazi normalizzati, e
# ognuno sta su una pagina sola, senza richiami di nota. Accanto, la pagina della traduzione inglese
# della Corte (`decision_3b51`, 219 pp.). I numeri di paragrafo (1-629) sono gli stessi in tutte le
# lingue: sono la chiave. I punti resolutivi (Opinión, pp. 229-233) hanno una numerazione propria (1-20)
# e non sono paragrafi.
#
# COME SONO STATE SCELTE LE SONDE. Lista del PI (01/10/2026): una sonda e' un elemento PROPRIO del
# parere, che rende riconoscibile la provenienza di chi lo riprende; non una copertura dei capitoli.
# Per ognuna gli intervalli sono stati letti sullo spagnolo e ristretti ai paragrafi che enunciano
# l'elemento (`elemento_proprio` dice che cosa e' proprio e che cosa resta fuori). Gli intervalli non si
# sovrappongono; tutto il resto del parere e' senza sonda. Conteggi: `conta_paragrafi.py`, accanto a
# questo file.

nome: Climate Emergency and Human Rights, Advisory Opinion OC-32/25
non_english_name: Emergencia Climática y Derechos Humanos, Opinión Consultiva OC-32/25
case: request-for-an-advisory-opinion-on-the-scope-of-the-state-obligations-for-responding-to-the-climate-emergency_fbcd
