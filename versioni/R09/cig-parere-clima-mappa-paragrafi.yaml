# `pagina_stampa` = numero a pie' di pagina dell'edizione della Corte («- 73 -»): pagina PDF meno 7.
# Le pagine di un gruppo vanno dalla pagina in cui comincia il primo paragrafo a quella in cui finisce l'ultimo;
