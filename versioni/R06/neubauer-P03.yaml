forme_escluse:
  - forma: Bundesverfassungsgericht
    ragione: La corte, non il caso; centinaia di decisioni citate nel corpus tedesco.
  - forma: BVerfG
    ragione: Idem.
  - forma: Klimaschutzgesetz
    ragione: La legge impugnata, citata in ogni causa tedesca successiva (KlimaSeniorinnen, DUH, i ricorsi contro le Länder) senza che si citi il Beschluss.
  - forma: KSG
    ragione: Idem; anche sigla di altro.
  - forma: Federal Climate Change Act
    ragione: Idem in inglese.
  - forma: Klimaurteil
    ragione: Denominazione giornalistica usata per molte decisioni (anche Urgenda, KlimaSeniorinnen); non identifica.
  - forma: intertemporale Freiheitssicherung
    ragione_nota: >
      NON forma lessicale: e' la proposizione, non il nome del caso. Sta in `lexical_markers` della
      sonda e nella rete semantica. Metterla fra le forme conterebbe come citazione lessicale ogni
      ripresa implicita, confondendo le due reti.
  - forma: Luisa Neubauer
    ragione_nota: >
      NON esclusa ma segnalata: la prima ricorrente e' una figura pubblica (Fridays for Future);
      «Luisa Neubauer» in un documento puo' nominare la persona e non il caso. Coperta da «Neubauer»;
      da rivedere a mano.
  - forma: Fridays for Future
    ragione: Movimento; non e' parte formale e compare in contesti che non citano il caso.
  - forma: Germany
    ragione: Ovvio; resta solo nelle forme composte.

