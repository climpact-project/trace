# CASO CITATO — NEUBAUER E ALTRI c. GERMANIA (Klimabeschluss), query specification v1
#
# Bundesverfassungsgericht, Erster Senat, Beschluss vom 24. März 2021, 1 BvR 2656/18, 1 BvR 78/20,
# 1 BvR 96/20, 1 BvR 288/20. Scritto il 23 settembre 2026 direttamente con le regole del Registro
# di Urgenda (v. `future-generations.yaml` v2 per la loro enunciazione): sonda che porta la via e
# non la conclusione (`elemento_proprio`), escluse solo di polarita' e di provenienza, verbatim
# dove la fonte e' nel fascicolo, una formulazione per default, marcatori nelle lingue del corpus,
# frasi della sentenza come ricerca separata, atti del caso esclusi anche dalla ricerca allargata.
#
# LINGUA (decisione del ricercatore, 23/9/2026). Verbatim dall'ORIGINALE TEDESCO per i canonical;
# seed dalla traduzione inglese UFFICIALE del Bundesverfassungsgericht (78 pp., con lacune «[…]»
# dichiarate), che e' quella che le corti straniere leggono; sonde in inglese; `probe_de` con la
# formulazione tedesca, PROVA come `probe_alternativa` (il corpus ha documenti tedeschi: i cinque
# ricorsi di questo fascicolo, e i casi austriaci e svizzeri). Dove la traduzione ufficiale omette
# un Randnummer (per es. Rn. 186-189, ridotti), il seed manca e lo si dice.
#
# TESTO NATIVO, NIENTE OCR: nessun `corpus_legge`. In compenso entrambe le versioni portano la
# SILLABAZIONE di fine riga del PDF («Ver- pflichtung», «sen- tence»): i trattini sono ricongiunti e
# ogni ricongiunzione e' elencata in `nota_verbatim.sillabazione` (categoria NUOVA, proposta al PI:
# NOTE, domanda 1). I tre trattini reali spezzati a fine riga («decision- making») sono conservati.
# A cavallo di pagina l'estrazione inserisce numero di pagina e numeri di Randnummer: `salto_pagina`.
#
# DALLE QUATTRO PROPOSIZIONI DEL RICERCATORE A SEI SONDE. «Obbligo costituzionale di protezione» ->
# `schutzpflicht_clima` (con il punto proprio: verso le generazioni future e' SOLO oggettiva). «Non
# imporre oneri sproporzionati a chi vivra' dopo» -> `proporzionalita_intergenerazionale`. «Target
# conforme al budget» -> `budget_co2_parametro`. «Intertemporale Freiheitssicherung, verticale e
# orizzontale» -> due sonde: `vorwirkung_liberta_intertemporale` (diacronica: la Vorwirkung sulle
# stesse persone nel tempo) e `protezione_extraterritoriale` (orizzontale: i ricorrenti del
# Bangladesh e del Nepal, Rn. 173-181). Aggiunta dall'esecutore, come per la Colombia, la sonda
# `art20a_giustiziabile_autovincolo` (Leitsatz 2e, Rn. 205-207, 213): e' l'asse su cui il caso e'
# citato dalle corti che devono decidere se un obiettivo climatico costituzionale sia sindacabile,
# e contiene la regola «il legislatore e' vincolato alla propria concretizzazione» che e' lo
# specchio dell'esclusa `target_autoimposto` di Urgenda. Da togliere se il PI non la vuole.
#
# ASSE NON PROMOSSO, con paternita' DICHIARATA ad altri: «lo Stato non puo' sottrarsi alla propria
# responsabilita' indicando le emissioni di altri Stati» (Leitsatz 2c, Rn. 202). Il BVerfG lo dice
# citando espressamente VG Berlin, BVerwG, Thomson (Nuova Zelanda), Hof Den Haag n. 64, Hoge Raad
# n. 5.7.7 e il Nono Circuito: e' `propria_quota` di Urgenda ripresa con attribuzione. Il passaggio
# (EN p. 60) va nel file di Urgenda come ESCLUSA DI PROVENIENZA verbatim di quella sonda, non qui.
# Secondo asse non promosso: Leitsatz 5 (le quantita' di emissione le fissa il legislatore
# parlamentare, non l'esecutivo per regolamento; Wesentlichkeitstheorie). Terzo: il dovere di
# «orientamento tempestivo e certezza di pianificazione» per la transizione (Rn. 248-250).

