  probe_alternativa: prova — eseguire una volta, misurare da sola, tenere solo se rende almeno quanto testo (registro, 2)
  probe_de: prova — idem; formulazione nella lingua dell'originale e dei documenti tedeschi del corpus
  domande_contrarie: >
    Le escluse di questo file sono il primo insieme di domande contrarie; dopo la prima validazione
    le righe bocciate dal gruppo sostituiscono le `redazionale` e si aggiungono alle `verbatim`.

frasi_della_sentenza:
  eseguire_come_ricerca_separata: true
  cosa: i campi `canonical`, `canonical_bis` e `seeds.testo` di ogni sonda, ciascuno come query autonoma
  mai: incollarli dentro `testo`
  nota: >
    Per questo caso la ricerca per frasi e' particolarmente informativa: i Leitsätze (pp. 1-3 EN)
    circolano tal quali nelle citazioni straniere, e sono seed dichiarati.

caso_ancora:
  posizione_nella_lista: 2              # guida §2, decisione PI 27/08/2026
  misurato: 97 casi del corpus lo nominano (19/09/2026), terzo dopo Juliana e Urgenda
  motivazione_selezione: >
    DA SCRIVERE DAL PI. Proposta dell'esecutore, NON decisa: prima corte costituzionale che fonda
    l'incostituzionalita' di una legge climatica non sull'insufficienza presente della protezione
    ma sull'effetto anticipato di interferenza (eingriffsähnliche Vorwirkung) che le quantita' di
    emissione ammesse oggi hanno sulla liberta' futura; rende disponibili la costruzione dei diritti
    fondamentali come garanzia intertemporale di liberta', la proporzionalita' fra generazioni nel
    consumo del budget, la giustiziabilita' di un obiettivo climatico costituzionale e il vincolo
    del legislatore alla propria concretizzazione del target.
  famiglia_giuridica: civil law, costituzionalismo tedesco (Grundgesetz)
  data_prima_pronuncia: 2021-03-24
  data_ultima_pronuncia: 2021-03-24
  esito: parzialmente accolto            # accolto sulla Vorwirkung/proporzionalita' (§ 3 Abs. 1 S. 2, § 4 Abs. 1 S. 3 KSG incostituzionali in parte); respinto sulle Schutzpflichten; inammissibile per le associazioni
  caso_perso: false
  caso_di_controllo: false
  documenti_corpus_successivi_alla_decisione: null
  percorsi_di_lettura: >
    Due percorsi separati (registro, "Dove sta il passaggio"): documenti che nominano il caso;
    corpus intero. Due strade di citazione (nota del PI nel file precedente): fuori dalla Germania
    «Neubauer», dentro il numero di registro o «Klimabeschluss» senza le parti.

